    const scar = S.scar && S.scar.d === d ? S.scar : null;
    const hp = bossMax(d) * (scar ? scar.k : 1);
    const rally = (scar ? TUNE.rally * Math.min(TUNE.rallyMax, scar.n || 0) : 0) + (S.rested ? 0.4 : 0);
    return (D.heroDps || 0) * (D.bossMult || 1) * (1 + rally) * (D.bossTime + (lord ? 15 : 0)) * torment().bossTime / Math.max(1e-9, hp);
  }
  G.bossOdds = bossOdds;

  // Phases: a lord changes at 66% and 33% of its health, a boss at 50%. It shrugs off
  // everything for a moment, throws the Horde back, hits the whole party and fights harder.
  function phaseAt(b) { return b.lord ? (b.hp < b.max * 0.33 ? 3 : b.hp < b.max * 0.66 ? 2 : 1) : (b.hp < b.max * 0.5 ? 2 : 1); }
  function hitBoss(dmg) {
    const b = R.boss;
    if (!b || b.dead) return;
    if (b.inv > 0) return;
    // a shield soaks most of it; a staggered boss takes half again
    if (b.move && b.move.k === 'shield') dmg *= 0.3;
    // Shielded: a barrier soaks most of it until Smite or a broken wind-up cracks it (it comes back after 10 s)
    else if (G.bossHas(b, 'shielded') && !(b.sh > 0)) dmg *= 0.35;
    else if (b.stagger > 0) dmg *= 1.5;
    if (b.rally) dmg *= 1 + b.rally;
    b.hp -= dmg;
    if (b.hp <= 0) bossWin();
    else if (phaseAt(b) > b.phase) {
      // one phase at a time: a huge hit stops at the next phase's floor
      const fl = (b.lord ? [0.66, 0.33, 0] : [0.5, 0])[b.phase] || 0;
      if (fl > 0) b.hp = Math.max(b.hp, fl * b.max + 1);
      b.phase++; b.inv = 1.6; b.move = null; b.moveT = 1.5;
      // the last phase of a lord is its rage: twice the adds, harder bites
      if (b.lord && b.phase === 3) { b.rage = 1; emit('bossRage', b); }
      for (const m of R.mobs) m.p = Math.max(-0.1, m.p - 0.3);
      const a = G.mobAtk(b.d);
      emit('bossPhase', b);
      if (G.partyUnits) for (const u of G.partyUnits()) if (!(u.down > 0) && R.boss === b) G.hurtParty(u.who, a * 1.5, 'phase');
    }
  }
  G.hitBoss = hitBoss;

  function bossWin() {
    const S = G.S, b = R.boss;
    b.dead = true;
    const d = b.d;
    const first = S.st.bossKills === 0;
    if (d === 39 && S.rec && !S.rec.madTime) S.rec.madTime = S.st.playTime;
    S.st.bossKills++;
    if (b.lord) S.st.lordKills++;
    const om = G.omen ? G.omen().bossRew : 1;
    const rew = { gold: D.incomeRef * (b.lord ? 40 : 10) * om, ess: (2 + d * 0.3) * (b.lord ? 3 : 1) * D.essMult * om,
      eggs: 0, pots: [], chests: [], lord: b.lord, d };
    addGold(rew.gold, 'boss');
    addEssence(rew.ess, 'boss');
    let eggEV = (b.lord ? 1 + Math.floor(d / 15) : 0.15) * D.eggMult;
    rew.eggs = addEggs(rollCount(eggEV) + (first ? 1 : 0));
    const pots = b.lord ? 1 : (chance(0.15) ? 1 : 0);
    for (let i = 0; i < pots; i++) { const p = givePotion(); if (p) rew.pots.push(p); }
    const tier = b.lord ? Math.min(6, 1 + Math.floor(d / 8)) : Math.min(5, Math.floor(d / 8));
    const count = (b.lord ? 2 : 1) * om;
    if (G.heroBossEnd) G.heroBossEnd(true); // its swarm dies with it, still in this land
    // only this boss's wounds heal; a deeper wall the party was pushed back from keeps its scar and Rally
    if (S.scar && S.scar.d === d) S.scar = null;
    S.rested = 0;
    S.depth++;
    if (S.depth >= S.maxDepth) S.tormentRun = Math.max(S.tormentRun || 0, torment().n);
    if (S.depth > S.maxDepth) S.maxDepth = S.depth;
    if (S.depth > S.bestDepth) {
      S.bestDepth = S.depth;
      const slot = G.PARTY_AT ? G.PARTY_AT.indexOf(S.bestDepth) : -1;
      if (slot >= 0) emit('slotOpen', slot);
    }
    S.bossMeter = 0;
    R.boss = null;
    R.dirty = true;
    recalc();
    // the loot bursts out of it onto the ground; without js/world.js, chests open as before
    if (G.bossLoot) G.bossLoot(b, tier, count);
    else for (let i = 0; i < count; i++) rew.chests.push(openChest(makeChest(tier, null), 'boss'));
    questProgress('boss', 1);
    emit('bossWin', rew, b);
    if (realmIndex(S.depth) !== realmIndex(d)) emit('realm', realmIndex(S.depth));
  }

  function bossFail() {
    const S = G.S, b = R.boss;
    R.boss = null;
    // it keeps 70% of the damage it took, and never comes back weaker than 25%
    const left = Math.max(0, b.hp / b.max);
    // only a try that actually hurt the boss counts toward Rally
    // and it heals back less after each try, so a wall always gives way to someone who keeps at it
    const n0 = S.scar && S.scar.d === b.d ? S.scar.n || 0 : 0;
    S.scar = { d: b.d, k: Math.max(0.15, left + (1 - left) * 0.3 / (1 + n0)), n: n0 + (left < 0.95 ? 1 : 0) };
    S.rested = 0;
    b.wound = 1 - S.scar.k;
    if (G.heroBossEnd) G.heroBossEnd(false);
    S.bossMeter = Math.floor(D.bossNeed * 0.5);
    emit('bossFail', b);
  }
  G.fleeBoss = () => { if (R.boss) bossFail(); };

  // ---------- Wisps ----------
  function spawnWisp() {
    R.wisp = { t: TUNE.wispLife, life: TUNE.wispLife, seed: G.rng() };
    emit('wisp', R.wisp);
  }
  function catchWisp() {
    const S = G.S;
    if (!R.wisp) return;
    R.wisp = null;
    S.st.wisps++;
    const e = G.WISP_EFFECTS[weighted(G.WISP_EFFECTS.map(x => x.w))];
    let amount = 0;
    if (e.id === 'frenzy' || e.id === 'storm') {
      S.buffs = S.buffs.filter(b => b.id !== e.id);
      S.buffs.push({ id: e.id, t: e.dur * D.buffDur, T: e.dur * D.buffDur });
      R.dirty = true;
    } else if (e.id === 'rain') {
      for (let i = 0; i < 8; i++) spawnChest();
    } else if (e.id === 'lucky') {
      amount = Math.min(S.gold * 0.15 + D.incomeRef * 30, D.incomeRef * 600);
      addGold(amount, 'wisp');
    } else if (e.id === 'egg') {
      addEggs(1);
    }
    questProgress('wisp', 1);
    emit('wispCatch', e, amount);
  }
  G.catchWisp = catchWisp;

  // ---------- Shop ----------
  function upgCost(u, L) { return u.base * Math.pow(u.growth, L); }
  G.upgCost = u => upgCost(u, G.S.upg[u.id] || 0);
  function buyUpgrade(id) {
    const S = G.S, u = G.UPGRADES.find(x => x.id === id);
    const L = S.upg[id] || 0;
    if (u.max && L >= u.max) return false;
    if (u.req && !(S.upg[u.req] > 0)) return false;
    const c = upgCost(u, L);
    if (S.gold < c) return false;
    S.gold -= c; S.upg[id] = L + 1;
    R.dirty = true; recalc();
    emit('buy', 'upg', id);
    return true;
  }
  G.buyUpgrade = buyUpgrade;

  function heroCost(h, n, amount) { return G.geoCost(h.cost, G.HERO_GROWTH, n, amount); }
  G.heroCost = (h, amount) => heroCost(h, G.S.heroes[h.id] || 0, amount);
  G.heroMax = h => G.geoMax(h.cost, G.HERO_GROWTH, G.S.heroes[h.id] || 0, G.S.gold);
  function buyHero(id, amount) {
    const S = G.S, h = G.HEROES.find(x => x.id === id);
    const n = S.heroes[id] || 0;
    if (amount === 'max') amount = G.geoMax(h.cost, G.HERO_GROWTH, n, S.gold);
    if (amount <= 0) return false;
    const c = heroCost(h, n, amount);
    if (S.gold < c) return false;
    S.gold -= c; S.heroes[id] = n + amount;
    R.dirty = true; recalc();
    emit('buy', 'hero', id, amount);
    return true;
  }
  G.buyHero = buyHero;

  function nodeCost(nd, L) { return Math.ceil(nd.cost * Math.pow(nd.growth, L)); }
  G.nodeCost = nd => nodeCost(nd, G.S.nodes[nd.id] || 0);
  function nodeAvailable(nd) {
    if (!nd.req.length) return true;
    return nd.req.some(r => (G.S.nodes[r] || 0) > 0);
  }
  G.nodeAvailable = nodeAvailable;
  function buyNode(id) {
    const S = G.S, nd = G.NODE_BY_ID[id];
    const L = S.nodes[id] || 0;
    if (L >= nd.max || !nodeAvailable(nd)) return false;
    const c = nodeCost(nd, L);
    if (S.essence < c) return false;
    S.essence -= c; S.nodes[id] = L + 1;
    R.dirty = true; recalc();
    emit('buy', 'node', id);
    return true;
  }
  G.buyNode = buyNode;

  function legacyCost(l, L) { return Math.ceil(l.base * Math.pow(l.growth, L)); }
  G.legacyCost = l => legacyCost(l, G.S.legacy[l.id] || 0);
  function buyLegacy(id) {
    const S = G.S, l = G.LEGACY_BY_ID[id];
    const L = S.legacy[id] || 0;
    if (L >= l.max) return false;
    const c = legacyCost(l, L);
    if (S.fame < c) return false;
    S.fame -= c; S.legacy[id] = L + 1;
    R.dirty = true; recalc();
    emit('buy', 'legacy', id);
    return true;
  }
  G.buyLegacy = buyLegacy;

  // ---------- Pets / gacha ----------
  function pullOne() {
    const S = G.S;
    S.pity.l++; S.pity.d++; S.pulls++;
    let tier = weighted(G.PET_TIERS.map(t => t.rate));
    if (S.pity.d >= 120) tier = 3;
    else if (S.pity.l >= 25 && tier < 2) tier = 2;
    if (tier >= 2) S.pity.l = 0;
    if (tier === 3) S.pity.d = 0;
    const pet = pick(G.PETS.filter(p => p.tier === tier));
    const golden = chance(D.goldenChance);
    let st = S.pets[pet.id];
    const isNew = !st;
    const newGold = golden && (!st || !st.gold);
    if (!st) st = S.pets[pet.id] = { lvl: 1, n: 1, gold: golden };
    else { st.n++; st.lvl = Math.min(G.PET_MAX_LEVEL, st.lvl + 1); if (golden) st.gold = true; }
    return { pet, golden, isNew, newGold, lvl: st.lvl };
  }
  function pull(n) {
    const S = G.S;
    const cost = n >= 10 ? 9 : n;
    if (S.eggs < cost) return null;
    S.eggs -= cost;
    const res = [];
    for (let i = 0; i < n; i++) res.push(pullOne());
    // Auto-equip into free slots
    for (const r of res) {
      if (S.active.length < D.petSlots && !S.active.includes(r.pet.id)) S.active.push(r.pet.id);
    }
    R.dirty = true; recalc();
    emit('pull', res);
    return res;
  }
  G.pull = pull;
  function togglePet(id) {
    const S = G.S;
    if (!S.pets[id]) return;
    const i = S.active.indexOf(id);
    if (i >= 0) S.active.splice(i, 1);
    else if (S.active.length < D.petSlots) S.active.push(id);
    else { S.active.shift(); S.active.push(id); }
    R.dirty = true; recalc();
    emit('pets');
  }
  G.togglePet = togglePet;

  // ---------- Quests ----------
  function progLevel() {
    const S = G.S;
    return S.maxDepth + Math.log10(S.goldRun + 10);
  }
  const QUEST_KINDS = ['clicks', 'chests', 'rarity', 'gold', 'boss', 'crit', 'combo', 'mod', 'wisp', 'kills'];
  function makeQuest(exclude) {
    const S = G.S;
    const lv = progLevel();
    let kinds = QUEST_KINDS.filter(k => !exclude.includes(k));
    if (!S.st.bossKills && S.depth === 0) kinds = kinds.filter(k => k !== 'boss');
    if (!Object.keys(D.mods).length) kinds = kinds.filter(k => k !== 'mod');
    if (S.st.wisps < 1) kinds = kinds.filter(k => k !== 'wisp' || S.st.playTime > 240);
    const k = pick(kinds);
    const q = { k, p: 0 };
    switch (k) {
      case 'clicks': q.n = Math.round((200 + lv * 40) / 10) * 10; break;
      case 'chests': q.n = Math.round(25 + lv * 4); break;
      case 'rarity': q.r = Math.min(5, 1 + Math.floor(lv / 7)); q.n = 3; break;
      case 'gold': q.n = Math.max(200, D.incomeRef * 300); break;
      case 'boss': q.n = G.randInt(1, 3); break;
      case 'crit': q.n = Math.round((30 + lv * 5) * Math.max(0.5, D.crit / 0.05)); break;
      case 'combo': q.n = Math.min(D.comboCap, Math.round(45 + lv * 8)); break;
      case 'mod': q.n = 3; break;
      case 'wisp': q.n = 1; break;
      case 'kills': q.n = Math.round((40 + lv * 6) * 30 / 100) * 100; break;
    }
    const roll = G.rng();
    if (roll < 0.15) { q.rw = 'eggs'; q.rn = 1 + (lv > 30 ? 1 : 0); }
    else if (roll < 0.5) { q.rw = 'ess'; q.rn = Math.round(4 + lv * 1.5); }
    else { q.rw = 'gold'; q.rn = 20; } // seconds of income, paid at claim time
    return q;
  }
  function fillQuests() {
    const S = G.S;
    while (S.quests.length < 3) S.quests.push(makeQuest(S.quests.map(q => q.k)));
  }
  const QUEST_COOLDOWN = 150;
  G.fillQuests = fillQuests;
  function questProgress(kind, v, isMax) {
    const qs = G.S.quests;
    for (let i = 0; i < qs.length; i++) {
      const q = qs[i];
      if (q.done || q.wait) continue;
      if (kind === 'rarity') { if (q.k === 'rarity' && v >= q.r) q.p++; }
      else if (q.k === kind) { if (isMax) q.p = Math.max(q.p, v); else q.p += v; }
      if (q.p >= q.n) { q.p = q.n; q.done = true; emit('questDone', q); }
    }
  }
  G.questProgress = questProgress;
  function questReward(q) {
    if (q.rw === 'gold') return D.incomeRef * q.rn * D.questMult;
    if (q.rw === 'ess') return q.rn * D.questMult * D.essMult;
    return q.rn;
  }
  G.questReward = questReward;
  function claimQuest(i) {
    const S = G.S, q = S.quests[i];
    if (!q || !q.done) return false;
    const v = questReward(q);
    if (q.rw === 'gold') addGold(v, 'quest');
    else if (q.rw === 'ess') addEssence(v, 'quest');
    else addEggs(v);
    S.questsDone++;
    S.quests[i] = { wait: QUEST_COOLDOWN, k: 'wait' };
    emit('questClaim', q, v);
    return true;
  }
  G.claimQuest = claimQuest;
  function rerollQuest(i) {
    const S = G.S;
    if (Date.now() < S.rerollAt || !S.quests[i] || S.quests[i].wait) return false;
    S.quests[i] = makeQuest(S.quests.map(x => x.k));
    S.rerollAt = Date.now() + 5 * 60 * 1000;
    emit('quests');
    return true;
  }
  G.rerollQuest = rerollQuest;

  // ---------- Daily ----------
  function dailyAvailable() { return G.S.daily.last !== G.todayKey(); }
  G.dailyAvailable = dailyAvailable;
  function dailyReward(day) {
    const r = G.DAILY[day % 7];
    if (r.kind === 'gold') return { kind: 'gold', v: Math.max(500, D.incomeRef * 60 * r.mins) };
    if (r.kind === 'eggs') return { kind: 'eggs', v: r.n };
    if (r.kind === 'ess') return { kind: 'ess', v: r.n };
    return { kind: 'chest', v: 1, tier: r.tier };
  }
  G.dailyReward = dailyReward;
  function claimDaily() {
    const S = G.S;
    if (!dailyAvailable()) return null;
    // a missed day pauses the streak instead of wiping it
    S.daily.streak = S.daily.last ? S.daily.streak + 1 : 0;
    S.daily.last = G.todayKey();
    const r = dailyReward(S.daily.streak);
    if (r.kind === 'gold') addGold(r.v);
    else if (r.kind === 'eggs') addEggs(r.v);
    else if (r.kind === 'ess') addEssence(r.v);
    else openChest(makeChest(r.tier, 'ghost'), 'daily');
    emit('daily', r);
    return r;
  }
  G.claimDaily = claimDaily;

  // ---------- Ascension ----------
  // Fame depends mostly on how deep this run went (bosses gate depth), with a
  // small bonus for gold, so each ascension is worth a similar, growing amount.
  function fameGain() {
    const S = G.S, d = S.maxDepth;
    // (2.3: nothing to ascend for before depth 15, so the first run is played out, not skipped)
    if (d < TUNE.ascFrom) return 0;
    const goldBonus = 1 + 0.1 * Math.max(0, Math.log10(Math.max(1, S.goldRun / 1e9)));
    return Math.floor(0.3 * d * Math.pow(1.07, d) * goldBonus * D.fameMult);
  }
  G.fameGain = fameGain;
  function ascend() {
    const S = G.S;
    const g = fameGain();
    if (g < 1) return false;
    const keepPct = 0.25 * (S.legacy.lg_keeppot || 0);
    const keep = {};
    G.POTIONS.forEach(p => keep[p.id] = Math.floor(S.pots[p.id] * keepPct));
    S.fame += g; S.fameTotal += g; S.ascensions++;
    S.lastRunEss = S.essRun;
    const fresh = newState();
    const runKeys = ['gold', 'goldRun', 'clicksRun', 'upg', 'heroes', 'nodes', 'essence', 'essRun', 'depth', 'maxDepth',
      'pots', 'chests', 'chestMeter', 'bossMeter', 'buffs', 'quests', 'scar', 'tormentRun'];
    runKeys.forEach(k => S[k] = fresh[k]);
    S.pots = Object.assign(potZero(), keep);
    const L = S.legacy;
    if (L.lg_start) S.gold = 100 * Math.pow(10, L.lg_start);
    if (L.lg_deep) S.depth = S.maxDepth = 2 * L.lg_deep;
    if (L.lg_stars) S.essence = S.lastRunEss * 0.12 * L.lg_stars;
    R.boss = null; R.bossReady = false; R.combo = 0;
    if (G.heroReset) G.heroReset(false);
    R.dirty = true; recalc();
    fillQuests();
    emit('ascend', g);
    return g;
  }
  G.ascend = ascend;

  // ---------- Offline ----------
  function applyOffline(sec) {
    if (sec < 60) return null;
    if (G.worldAway) G.worldAway();
    recalc();
    const t = Math.min(sec, D.offCap);
    const gold = D.gpsBase * t * D.offEff;
    // back after a long rest: the next boss fight hits harder
    if (sec >= 4 * 3600) G.S.rested = 1;
    addGold(gold);
    // Scouts and the golem keep finding chests while away (opened virtually).
    const rate = D.scout + (D.autoOpen ? Math.min((D.looters || 1) / D.autoOpen, 3) * 0.25 : 0);
    const n = Math.min(400, Math.floor(t * rate * D.offEff));
    let items = 0, ess = 0, extraGold = 0;
    for (let i = 0; i < n; i++) {
      const l = openChest(makeChest(rollTier(), null), 'offline');
      items += l.items.length; ess += l.ess; extraGold += l.gold;
    }
    const warden = G.heroOffline ? G.heroOffline(t) : null;
    return { sec, t, gold: gold + extraGold, chests: n, items, ess, warden, rested: !!G.S.rested };
  }
  G.applyOffline = applyOffline;

  // ---------- Main tick ----------
  function tick(dt) {
    const S = G.S;
    if (R.dirty) recalc();
    S.st.playTime += dt;
    // in town the field holds still: only the Garrison's income and the clock run
    if (R.town) { addGold(D.gps * dt, 'gps'); return; }

    // Buffs
    if (S.buffs.length) {
      for (const b of S.buffs) b.t -= dt;
      const before = S.buffs.length;
      S.buffs = S.buffs.filter(b => b.t > 0);
      if (S.buffs.length !== before) { R.dirty = true; recalc(); emit('buffEnd'); }
    }
    // Combo decay
    if (R.combo > 0) {
      R.comboT -= dt;
      if (R.comboT <= 0) R.combo = Math.max(0, R.combo - dt * Math.max(20, R.combo * 1.5));
    }
    // Idle income
    addGold(D.gps * dt, 'gps');
    // Auto clicks
    R.autoAcc += (D.autoCps + D.petCps) * dt;
    if (R.autoAcc >= 1) {
      const n = Math.floor(R.autoAcc);
      R.autoAcc -= n;
      autoClicks(n, dt);
    }
    // Scouts
    if (D.scout) S.chestMeter += D.scout * D.chestNeed * dt;
    spawnFromMeter();
    if (G.heroTick) G.heroTick(dt);
    if (G.worldTick) G.worldTick(dt);
    if (G.eventsTick) G.eventsTick(dt);
    if (G.journeyTick) G.journeyTick(dt);
    // Boss
    if (R.rift) { /* the campaign waits while a Rift is open */ }
    else if (R.boss) {
      const b = R.boss;
      if (R.boss) {
        b.t -= dt;
        if (b.inv > 0) { b.inv -= dt; b.t += dt; } // the clock holds while it changes
        // 2.3: out of time, the boss doesn't leave: it ENRAGES. A last stretch to finish it, while it hits
        // twice as often and harder by the second; then it leaves with whatever wounds it has
        if (b.t <= 0 && !b.enr) { b.t = 0; b.enr = b.lord ? TUNE.enrageLord : TUNE.enrage; b.enrT = b.enr; b.moveT = Math.min(b.moveT || 0, 1); emit('bossEnrage', b); }
        if (b.sh > 0) b.sh -= dt;
        if (G.bossHas(b, 'regen') && !(b.inv > 0)) b.hp = Math.min(b.max, b.hp + b.max * TUNE.bossRegen * dt);
        if (b.enr > 0 && !(b.inv > 0) && (b.enr -= dt) <= 0) bossFail();
        else bossMoves(b, dt);
      }
    } else if (S.bossMeter >= D.bossNeed) {
      if (!R.bossReady) { R.bossReady = true; R.bossIn = TUNE.bossCall; emit('bossReady'); }
      // Bosses come on their own: after a short countdown when the Warden can take it, or after a
      // longer wait when it can't yet (Rally builds with each try; The Hunt shortens the wait).
      // ⚔ calls it right away.

  // ================= Rendering =================
  function hexA(h) { return h; }
  function drawDef(ctx, d, ox, oy, recolor) {
    for (let y = 0; y < d.h; y++) {
      const row = d.px[y];
      for (let x = 0; x < d.w; x++) {
        const ch = row[x];
        if (ch === '.') continue;
        let col = d.pal[ch];
        if (!col) continue;
        if (recolor) col = recolor(col);
        ctx.fillStyle = col;
        ctx.fillRect(ox + x, oy + y, 1, 1);
      }
    }
  }
  function outline(ctx, w, h, color) {
    const img = ctx.getImageData(0, 0, w, h);
    const a = img.data;
    const solid = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) solid[i] = a[i * 4 + 3] > 0 ? 1 : 0;
    const [r, g, b] = G.hexToRgb(color);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (solid[i]) continue;
      if ((x > 0 && solid[i - 1]) || (x < w - 1 && solid[i + 1]) || (y > 0 && solid[i - w]) || (y < h - 1 && solid[i + w])) {
        a[i * 4] = r; a[i * 4 + 1] = g; a[i * 4 + 2] = b; a[i * 4 + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  const GOLD_RAMP = ['#5a3200', '#9a5a08', '#d8900e', '#f5b62a', '#ffd84a', '#ffec9a', '#fffbe0'];
  function toGold(col) {
    const [r, g, b] = G.hexToRgb(col);
    const l = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return GOLD_RAMP[Math.min(GOLD_RAMP.length - 1, Math.floor(l * GOLD_RAMP.length))];
  }
  function toShadow() { return '#141320'; }
  function makeCanvas(w, h) {
    if (typeof OffscreenCanvas !== 'undefined' && !SPR.forceDom) {
      try { return new OffscreenCanvas(w, h); } catch (e) { /* fall through */ }
    }
    const c = document.createElement('canvas'); c.width = w; c.height = h; return c;
  }
  SPR.makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  // get(id, {gold, dark, noOutline, outlineColor}) -> canvas (w+2)x(h+2) (outline adds 1px border)
  function get(id, o) {
    o = o || {};
    const key = id + (o.gold ? '|g' : '') + (o.dark ? '|d' : '') + (o.noOutline ? '|n' : '') + (o.oc || '');
    let c = SPR.cache[key];
    if (c) return c;
    const d = SPR.defs[id];
    if (!d) return null;
    c = SPR.makeCanvas(d.w + 2, d.h + 2);
    const ctx = c.getContext('2d');
    drawDef(ctx, d, 1, 1, o.gold ? toGold : o.dark ? toShadow : null);
    if (!o.noOutline) outline(ctx, d.w + 2, d.h + 2, o.oc || (o.dark ? '#3a3850' : OUTLINE));
    SPR.cache[key] = c;
    return c;
  }
  SPR.get = get;

  // Scaled data URL for DOM <img>
  function url(id, scale, o) {
    scale = scale || 4;
    const key = id + '@' + scale + JSON.stringify(o || {});
    if (SPR.urls[key]) return SPR.urls[key];
    const src = typeof id === 'string' ? get(id, o) : id;
    if (!src) return '';
    const c = SPR.makeCanvas(src.width * scale, src.height * scale);
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(src, 0, 0, c.width, c.height);
    const u = c.toDataURL();
    if (typeof id === 'string') SPR.urls[key] = u;
    return u;
  }
  SPR.url = url;

  function stepDrawParts(vdt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life -= vdt;

      p.vy += p.grav * vdt; p.x += p.vx * vdt; p.y += p.vy * vdt;
      lctx.globalAlpha = Math.min(1, p.life / p.max * 1.6);

  }
  function part(x, y, col, o) {
    if (parts.length > MAXP) parts.shift();

  // Title cards take turns: each card's lines appear together, the next card when this one is done
  const cardQ = [];
  let cardT = 0;
  let lastCard = null;
  function cardText(off, str, col, size, o) {
    o = o || {};
    let g = lastCard;
    if (off === 0 || !g || g.shown) {
      g = { items: [], life: 0, callout: !!o.callout, age: 0, tag: o.tag };
      // an urgent card (a boss changing phase) cuts in front and replaces whatever is up
      if (o.now) { cardQ.unshift(g); cardT = 0; for (let i = texts.length - 1; i >= 0; i--) if (texts[i].card) texts.splice(i, 1); }
      else cardQ.push(g);

  // ---------- Input ----------

  // ---------- Heroes & pets ----------
  function buildHeroes() {

    if (key === heroKey) return;

    const r = bossVis ? 36 : 30;
    return { x: Math.round(b.x + Math.cos(a) * r), y: Math.round(b.y - 2 + Math.sin(a) * r * 0.45 + Math.sin(time * 3 + i) * 1.5) };
  }

  // ---------- Boss ----------

    const bp = bossPos(), hh = bossHalf(), th = Math.PI / 2 + (b.move.wp * 2 - 1) * Math.PI * 0.55;

  }
  St.weakPoint = () => { const p = weakPos(); return p && { x: p.x * S, y: p.y * S }; };
  function hitWeak(p) { const w = weakPos(); return !!w && Math.abs(p.x - w.x) < 11 && Math.abs(p.y - w.y) < 11; }
  function bossHalf() { const c = bossVis.sprite.canvas, s = bossScale(); return { w: c.width * s / 2, h: c.height * s / 2 }; }
  function bossPos() { const b = btnPos(); return { x: b.x, y: b.y - 2 }; }

  // ---------- Hero & mobs ----------
  const mobVis = new Map();
  let btnHurtT = 0;
  // The Warden's animation state: position, facing, walk cycle and the current move
  const hero = { x: null, y: null, face: 1, walk: 0, moving: false, atk: null, cast: 0, tgt: null, tgtT: 9, hand: null, top: null };
  function heroBase() { const b = btnPos(); return { x: b.x - 30, y: b.y + 16 }; }
  function heroPos() {
    if (hero.x == null) { const p = heroBase(); hero.x = p.x; hero.y = p.y; }
    return { x: Math.round(hero.x), y: Math.round(hero.y) };
  }
  const ATTACK = { sword: ['swing', 0.24], katana: ['swing', 0.2], scythe: ['swing', 0.3], dagger: ['stab', 0.15], bow: ['shot', 0.3], staff: ['cast', 0.3], wand: ['cast', 0.22] };
  // Melee Wardens step out to meet the crowd and fall back to the Button
  function stepHero(dt) {
    const base = heroBase();
    if (hero.x == null) { hero.x = base.x; hero.y = base.y; }
    const wt = G.D.hero ? G.D.hero.wtype : 'dagger';
    let gx = base.x, gy = base.y;
    hero.tgtT += dt;
    if (MELEE[wt] && hero.tgt && hero.tgtT < 0.9 && !bossVis) {
      const dx = hero.tgt.x - base.x, dy = hero.tgt.y - base.y, d = Math.hypot(dx, dy);
      const go = clamp(d - 11, 0, 26);
      if (d > 0) { gx = base.x + dx / d * go; gy = base.y + dy / d * go; }
    }
    gy = clamp(gy, 30, H - Math.ceil(70 / S));
    const dx = gx - hero.x, dy = gy - hero.y, d = Math.hypot(dx, dy);

  // ---------- The party on the field ----------

  St.unitPoint = who => { const q = unitPos(who); return St.toScreen(q.x, q.y - 12); };
  const ROLE_COL = { tank: '#7fb8ff', heal: '#8ae07a', dps: '#ff9a5a' };
  function hpBar(x, y, k, w, col) {
    lctx.fillStyle = '#0c0b12'; lctx.fillRect(Math.round(x - w / 2) - 1, y - 1, w + 2, 4);
    lctx.fillStyle = '#3a1a1e'; lctx.fillRect(Math.round(x - w / 2), y, w, 2);
    lctx.fillStyle = k > 0.5 ? '#56d45a' : k > 0.25 ? '#ffd84a' : '#ff4f4f'; lctx.fillRect(Math.round(x - w / 2), y, Math.max(0, Math.round(w * k)), 2);

  function drawDowned(u, q) {

    lctx.strokeStyle = '#ffd84a'; lctx.lineWidth = 1; lctx.beginPath(); lctx.arc(q.x, q.y - 6, 9, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2); lctx.stroke();
    if (Math.random() < 0.08) part(q.x + rand(-4, 4), q.y - 10, '#c8c8d4', { vx: 0, vy: -8, grav: 0, life: 0.6 });
  }
  function drawAlly(i, u, q) {

    const w = u.eq.weapon, wt = w ? G.ITEM_TYPE[w.id] : null;
    shadow(q.x, q.y - 1, 12);
    if (v.heal > 0) { glow(q.x, q.y - 8, 9, '#8ae07a', v.heal * 2); v.heal -= fdt; }

    if (G.partyUnits && G.S.hero && G.S.hero.cls) for (const u of G.partyUnits()) if (u.who >= 0) { const q = allySlot(u.who); list.push({ y: q.y, draw: () => drawAlly(u.who, u, q) }); }
    if (mobVis.size > (R.mobs || []).length + 20) { const ids = new Set((R.mobs || []).map(m => m.id)); for (const k of [...mobVis.keys()]) if (!ids.has(k)) mobVis.delete(k); }
    // Button or boss
    if (bossVis && bossDmg.acc > 0 && (bossDmg.t -= dt) <= 0) {
      const bp = bossPos();
      text(bp.x + rand(-18, 18), bp.y - 26 - rand(0, 10), '-' + G.fmt(bossDmg.acc), bossDmg.crit ? '#ff7a2e' : '#ffffff', bossDmg.crit ? 5 : 4, { life: 0.7, max: 0.7, vy: -26 });
      bossDmg.acc = 0; bossDmg.crit = false; bossDmg.t = 0.16;
    }
    if (!bossVis) bossDmg.acc = 0;
    if (bossVis) {
      bossVis.t += dt;
      if (bossVis.enter > 0) bossVis.enter = Math.max(0, bossVis.enter - dt * 2.5);
      const bp = bossPos();
      list.push({ y: bp.y + 6, draw: () => drawBoss(bp) });
      bossBulletT -= dt;
      if (bossBulletT <= 0 && R.boss) {
        bossBulletT = bossVis.lord ? (R.boss.rage ? 0.45 : 0.9) : 1.4;
        const n = bossVis.lord ? 14 : 9, off = Math.random() * 6.28;
        const col = bossVis.lord ? '#ff4f7e' : '#ffe27a';
        for (let i = 0; i < n; i++) {
          const a = off + i / n * Math.PI * 2;
          bullets.push({ x: bp.x, y: bp.y - 10, vx: Math.cos(a) * 55, vy: Math.sin(a) * 38, life: 1.6, col });
        }
      }
    } else {
      list.push({ y: b.y + 6, draw: () => drawButton(b) });
    }
    // Wisp
    if (R.wisp) {
      const w = R.wisp, k = 1 - w.t / w.life;
      const dir = w.seed < 0.5 ? 1 : -1;
      const x = dir > 0 ? -10 + k * (W + 20) : W + 10 - k * (W + 20);
      const y = H * (0.25 + w.seed * 0.3) + Math.sin(time * 2.5 + w.seed * 10) * H * 0.12;
      St._wispPos = { x, y };
      list.push({ y, draw: () => {
        glow(x, y - 4, 6, '#fff3a0', 0.25 + 0.1 * Math.sin(time * 8));
        blit(SPR.get('wisp'), x, y + Math.sin(time * 6) * 1.5);
        if (Math.random() < 0.5) part(x + rand(-3, 3), y - 4, pick(['#fff3a0', '#ffd84a', '#ffffff']), { vx: rand(-8, 8), vy: rand(-8, 8), grav: 0, life: 0.6 });
      } });
    } else St._wispPos = null;

    list.sort((a, c) => a.y - c.y);
    for (const d of list) d.draw();
    drawMeteors();
    if (G.R.ward > 0) {
      const wb = btnPos(), k = Math.min(1, G.R.ward / 0.5);
      lctx.globalAlpha = (0.16 + 0.06 * Math.sin(time * 10)) * k; lctx.fillStyle = '#ffd84a';
      lctx.beginPath(); lctx.ellipse(wb.x, wb.y + 4, 52, 34, 0, 0, Math.PI * 2); lctx.fill();
      lctx.globalAlpha = 0.6 * k; lctx.strokeStyle = '#fff3a0'; lctx.lineWidth = 1; lctx.stroke(); lctx.globalAlpha = 1;
    }
    drawLootBeams();
    drawShotsInFlight();
    drawBeamsFx(vdt);
    drawRings(vdt); drawGlowFx(vdt);
    stepCoins(vdt);
    stepGems(vdt);

    // Opening chests animation
    for (let i = opening.length - 1; i >= 0; i--) {
      const o = opening[i]; o.t += dt;
      if (o.t >= o.dur) { opening.splice(i, 1); continue; }
      const a = 1 - o.t / o.dur;
      blit(SPR.get((o.bag ? 'bag_' : 'chesto_') + o.tier), o.x, o.y + 1 - (o.bag ? Math.round(o.t * 20) : 0), 1, a);
    }
    // Beams
    for (let i = beams.length - 1; i >= 0; i--) {
      const bm = beams[i]; bm.life -= dt;
      if (bm.life <= 0) { beams.splice(i, 1); continue; }
      const a = bm.life / bm.max;
      lctx.globalAlpha = 0.35 * a;
      lctx.fillStyle = bm.col;
      lctx.fillRect(Math.round(bm.x - bm.w / 2), 0, bm.w, Math.round(bm.y - 2));
      lctx.globalAlpha = 0.6 * a;
      lctx.fillRect(Math.round(bm.x - 1), 0, 2, Math.round(bm.y - 2));
      lctx.globalAlpha = 1;
    }
    // Shots
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i]; s.t += vdt;
      if (s.t >= s.dur) {
        shots.splice(i, 1);
        if (!s.key) part(s.tx, s.ty, s.col, { vx: rand(-20, 20), vy: rand(-20, 5), life: 0.2, grav: 0 });
        if (s.boom) { ring(s.boom.x, s.boom.y, s.boom.rx, s.boom.ry, s.boom.col, 0.2); burst(s.boom.x, s.boom.y - 2, [s.boom.col, '#ffffff'], 4, 50, { life: 0.25 }); }
        continue;
      }
      const k = s.t / s.dur;
      const arc = s.flat ? 0 : 6;
      const x = s.sx + (s.tx - s.sx) * k, y = s.sy + (s.ty - s.sy) * k - Math.sin(k * Math.PI) * arc;
      if (s.arrow) { // a shaft with a head, pointing where it flies
        const d = Math.hypot(s.tx - s.sx, s.ty - s.sy) || 1, ux = (s.tx - s.sx) / d, uy = (s.ty - s.sy) / d;
        lctx.fillStyle = '#c8a870';
        for (let j = 1; j <= 4; j++) lctx.fillRect(Math.round(x - ux * j), Math.round(y - uy * j), 1, 1);
        lctx.fillStyle = '#f0ead8'; lctx.fillRect(Math.round(x - ux * 5), Math.round(y - uy * 5), 1, 1);
        lctx.fillStyle = s.col; lctx.fillRect(Math.round(x), Math.round(y), 1, 1);
        continue;
      }
      lctx.fillStyle = s.col;
      lctx.fillRect(Math.round(x), Math.round(y), s.big ? 3 : 2, s.big ? 3 : 2);
      lctx.globalAlpha = 0.5;
      const px = s.sx + (s.tx - s.sx) * Math.max(0, k - 0.12), py = s.sy + (s.ty - s.sy) * Math.max(0, k - 0.12) - Math.sin(Math.max(0, k - 0.12) * Math.PI) * arc;
      lctx.fillRect(Math.round(px), Math.round(py), 1, 1);
      lctx.globalAlpha = 1;
    }
    if (shots.length > 120) shots.splice(0, shots.length - 120);
    // Boss bullets (RotMG-style rings)
    for (let i = bullets.length - 1; i >= 0; i--) {
      const bl = bullets[i]; bl.life -= dt;
      bl.x += bl.vx * dt; bl.y += bl.vy * dt;
      if (bl.life <= 0 || bl.x < -4 || bl.x > W + 4 || bl.y < -4 || bl.y > H + 4) { bullets.splice(i, 1); continue; }
      lctx.fillStyle = '#0c0b12'; lctx.fillRect(Math.round(bl.x) - 2, Math.round(bl.y) - 1, 4, 2); lctx.fillRect(Math.round(bl.x) - 1, Math.round(bl.y) - 2, 2, 4);
      lctx.fillStyle = bl.col; lctx.fillRect(Math.round(bl.x) - 1, Math.round(bl.y) - 1, 2, 2);
    }
    // Lightning
    for (let i = bolts.length - 1; i >= 0; i--) {
      const bo = bolts[i]; bo.life -= dt;
      if (bo.life <= 0) { bolts.splice(i, 1); continue; }
      if (bo.wide) { // ink edges, a coloured body and a white core, so it reads on sand too
        lctx.fillStyle = '#0c0b12';
        for (let j = 0; j < bo.pts.length - 1; j++) { line(bo.pts[j][0] - 1, bo.pts[j][1], bo.pts[j + 1][0] - 1, bo.pts[j + 1][1]); line(bo.pts[j][0] + 1, bo.pts[j][1], bo.pts[j + 1][0] + 1, bo.pts[j + 1][1]); }
        lctx.fillStyle = bo.cols[1];
        for (let j = 0; j < bo.pts.length - 1; j++) line(bo.pts[j][0] + (j % 2 ? 1 : -1) * 0, bo.pts[j][1], bo.pts[j + 1][0], bo.pts[j + 1][1]);
      }
      lctx.fillStyle = Math.random() < 0.5 ? '#ffffff' : bo.cols ? bo.cols[1] : '#7fe9ff';
      for (let j = 0; j < bo.pts.length - 1; j++) line(bo.pts[j][0], bo.pts[j][1], bo.pts[j + 1][0], bo.pts[j + 1][1]);
    }
    // Flyers (item pops, merge)
    for (let i = flyers.length - 1; i >= 0; i--) {
      const f = flyers[i]; f.t += dt;
      if (f.t >= f.dur) { flyers.splice(i, 1); continue; }
      const k = f.t / f.dur;
      if (f.float) {
        const y = f.y + f.vy * f.t * (1 - k * 0.5);
        const a = k > 0.7 ? (1 - k) / 0.3 : 1;
        if (f.r >= 3) glow(f.x, y - 5, 5, rarityCol(f.r), 0.3 * a);
        blit(SPR.get(f.spr), f.x, y, 1, a);
      } else {
        blit(SPR.get(f.spr) || SPR.get('chest_0'), f.x + (f.tx - f.x) * k, f.y + (f.ty - f.y) * k, 1, 1 - k * 0.5);
      }
    }
    // Particles
    stepDrawParts(vdt);
    drawGibs(false);

    // Buff tint
    if (G.hasBuff('frenzy')) { lctx.globalAlpha = 0.07 + 0.03 * Math.sin(time * 6); lctx.fillStyle = '#ffd84a'; lctx.fillRect(0, 0, W, H); lctx.globalAlpha = 1; }
    if (G.hasBuff('storm')) { lctx.globalAlpha = 0.06 + 0.04 * Math.sin(time * 14); lctx.fillStyle = '#7fe9ff'; lctx.fillRect(0, 0, W, H); lctx.globalAlpha = 1; }

    // ---- Blit to display ----
    let ox = 0, oy = 0;
    if (shake > 0) { ox = Math.round(rand(-shake, shake)); oy = Math.round(rand(-shake, shake)); shake = Math.max(0, shake - dt * 30); }
    if (kick > 0) { oy += 1; kick = 0; } // a one-frame downward kick on every click
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#0c0b12';
    ctx.fillRect(0, 0, cv.width, cv.height);
    const k = S * DPR;
    ctx.drawImage(low, ox * k, oy * k, W * k, H * k);
    // Vignette
    const vg = ctx.createRadialGradient(cv.width / 2, cv.height * 0.55, Math.min(cv.width, cv.height) * 0.35, cv.width / 2, cv.height * 0.55, Math.max(cv.width, cv.height) * 0.75);
    vg.addColorStop(0, 'rgba(8,6,14,0)');
    vg.addColorStop(1, 'rgba(8,6,14,0.62)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, cv.width, cv.height);
    // hurt: the edges run red, and pulse while the Button is low
    const lowK = G.S.hero && G.S.hero.cls && !(G.R.btnDown > 0) && G.D.heroHp ? clamp(1 - G.S.hero.hp / (G.D.heroHp * 0.3), 0, 1) : 0;
    const red = Math.min(0.6, hurtFx * 0.6 + lowK * (0.16 + 0.12 * Math.sin(time * 7)) + (G.R.btnDown > 0 ? 0.22 : 0));
    if (red > 0.01) {
      const rg = ctx.createRadialGradient(cv.width / 2, cv.height * 0.55, Math.min(cv.width, cv.height) * 0.3, cv.width / 2, cv.height * 0.55, Math.max(cv.width, cv.height) * 0.72);
      rg.addColorStop(0, 'rgba(255,30,40,0)'); rg.addColorStop(1, 'rgba(255,30,40,' + red.toFixed(3) + ')');
      ctx.fillStyle = rg; ctx.fillRect(0, 0, cv.width, cv.height);
    }
    if (flash > 0) {
      ctx.globalAlpha = Math.min(0.85, flash);
      ctx.fillStyle = flashCol; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.globalAlpha = 1; flash = Math.max(0, flash - dt * 1.8);
    }
    // ---- Hi-res layer: text & bars ----
    ctx.setTransform(k, 0, 0, k, ox * k, oy * k);
    drawNames();
    drawEventNames();
    drawLabels();
    drawTexts(dt);
    drawJackpotText();
    drawTapHints();
    drawStreak();
    if (R.rift) { /* the Rift's bar and clock live in the HUD row under the field */ }
    else if (bossVis && R.boss) { drawBossBar(); drawMoveName(); }
    else if (R.bossReady && !R.inv) drawReady(b);
    if (hoverChest) drawChestTip(hoverChest);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  };

  function line(x0, y0, x1, y1) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy, guard = 0;
    while (guard++ < 400) {
      lctx.fillRect(x0, y0, 1, 1);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  // The five zones of a land: dawn, midday, dusk, night, and the lord's own ground. Each has its
  // own grade of light, its own scatter of the land's decor, and (in drawZoneFx) its own weather.
  const ZONE_LOOK = [
    { grade: '#ffb070', ga: 0.3, mode: 'soft-light', decor: 1, keep: [0, 1, 2, 3] },
    { grade: null, ga: 0, mode: 'source-over', decor: 0.7, keep: [0, 2] },
    { grade: '#ff7a3a', ga: 0.2, mode: 'multiply', decor: 1.3, keep: [1, 3] },
    { grade: '#2a3470', ga: 0.55, mode: 'multiply', decor: 0.9, keep: [0, 1, 2, 3] },
    { grade: '#6a1030', ga: 0.45, mode: 'multiply', decor: 0.55, keep: [2, 3] },
  ];
  function buildGround(realmId, zone) {
    const Z = ZONE_LOOK[zone || 0] || ZONE_LOOK[1];
    const g = SPR.ground(realmId, W, H, 7 + realmId.length * 13 + (zone || 0) * 101);
    const c = SPR.makeCanvas(W, H), x = c.getContext('2d');
    x.drawImage(g, 0, 0);
    // scatter decor away from the centre: each zone keeps its own share of the land's pieces
    const cfg = SPR.REALM_GROUND[realmId];
    const pool = cfg.decor.filter((_, i) => Z.keep.includes(i % 4));
    const decor = pool.length ? pool : cfg.decor;
    const rnd = G.seeded(99 + realmId.length + (zone || 0) * 31);
    const b = btnPos();
    const n = Math.round(W * H / 900 * Z.decor);
    for (let i = 0; i < n; i++) {
      const px = Math.round(rnd() * W), py = Math.round(rnd() * H);
      const dx = (px - b.x) / (W * 0.33), dy = (py - b.y) / (H * 0.36);
      if (dx * dx + dy * dy < 1 || py < 14) continue;
      const spr = SPR.get(decor[Math.floor(rnd() * decor.length)]);
      x.fillStyle = 'rgba(0,0,0,0.25)'; x.fillRect(px - 3, py, 6, 1);
      x.drawImage(spr, Math.round(px - spr.width / 2), py - spr.height + 1);
    }
    // the zone's light
    if (Z.grade) { x.globalCompositeOperation = Z.mode; x.globalAlpha = Z.ga; x.fillStyle = Z.grade; x.fillRect(0, 0, W, H); x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1; }
    return c;
  }
  // weather and light that move: mist at dawn, leaves at dusk, fireflies and a lit circle at night,
  // embers and a red sky on the lord's ground; and a dip to black between zones
  let zoneFade = 0;
  function drawZoneFx(dt) {
    if (G.R.rift) return;
    const z = G.zoneOf(G.depthNow ? G.depthNow() : G.S.depth), b = btnPos();
    if (z === 0) {
      // low sun from the east: warm light across the field
      const lg = lctx.createLinearGradient(0, 0, W * 0.8, H);
      lg.addColorStop(0, 'rgba(255,196,120,0.26)'); lg.addColorStop(0.55, 'rgba(255,196,120,0.05)'); lg.addColorStop(1, 'rgba(255,196,120,0)');
      lctx.fillStyle = lg; lctx.fillRect(0, 0, W, H);
    }
    if (z === 1) {
      // midday: clouds drift over and drag their shadows across the ground
      lctx.fillStyle = '#000000';
      for (let i = 0; i < 3; i++) {
        const cx = ((time * (6 + i * 2) + i * W * 0.45) % (W + 160)) - 80, cy = H * (0.2 + i * 0.3);
        lctx.globalAlpha = 0.07; lctx.beginPath(); lctx.ellipse(cx | 0, cy | 0, 70 + i * 14, 26 + i * 6, 0, 0, 6.3); lctx.fill();
      }
      lctx.globalAlpha = 1;
    }
    if (z === 0) { lctx.fillStyle = '#ffffff'; for (let i = 0; i < 3; i++) { lctx.globalAlpha = 0.05; const y = (H * (0.3 + i * 0.25) + Math.sin(time * 0.3 + i) * 8) | 0; lctx.fillRect(0, y, W, 6 + i * 3); } lctx.globalAlpha = 1; }
    if (z === 2 && Math.random() < 0.35) part(W + 4, rand(0, H), pick(['#c86a2a', '#e8a040', '#a04a1a']), { vx: -rand(20, 40), vy: rand(4, 12), grav: 0, life: rand(2, 4) });
    if (z === 3) {
      // the night closes in, the Button lights the ground round it
      const rg = lctx.createRadialGradient(b.x, b.y, 30, b.x, b.y, Math.max(W, H) * 0.6);
      rg.addColorStop(0, 'rgba(10,12,40,0)'); rg.addColorStop(1, 'rgba(6,8,26,0.5)');
      lctx.fillStyle = rg; lctx.fillRect(0, 0, W, H);
      if (Math.random() < 0.3) part(rand(0, W), rand(20, H), pick(['#d8ff7a', '#fff3a0']), { vx: rand(-4, 4), vy: rand(-4, 4), grav: 0, life: rand(1, 2.5) });
    }
    if (z === 4) {
      lctx.globalAlpha = 0.06 + 0.03 * Math.sin(time * 1.5); lctx.fillStyle = '#ff2a4a'; lctx.fillRect(0, 0, W, H); lctx.globalAlpha = 1;
      if (Math.random() < 0.5) part(rand(0, W), H + 2, pick(['#ff7a2e', '#ff3b3b', '#ffd84a']), { vx: rand(-6, 6), vy: -rand(18, 40), grav: 0, life: rand(1.5, 3) });
    }
    if (zoneFade > 0) { lctx.globalAlpha = Math.min(1, zoneFade); lctx.fillStyle = '#0c0b12'; lctx.fillRect(0, 0, W, H); lctx.globalAlpha = 1; zoneFade = Math.max(0, zoneFade - dt * 1.6); }
  }
  function drawWater() {
    const cfg = SPR.REALM_GROUND.shore;
    const rows = 12;
    for (let y = 0; y < rows; y++) for (let x = 0; x < W; x += 1) {
      const wave = Math.sin(x * 0.3 + time * 2 + y * 0.8);
      const edge = rows - 2 + Math.round(Math.sin(x * 0.15 + time) * 1.5);
      if (y > edge) continue;
      let col = cfg.water[0];
      if (wave > 0.7) col = cfg.water[1];
      if (wave > 0.95 && (x + y) % 3 === 0) col = cfg.water[2];
      if (y === edge) col = '#e8f4ff';
      lctx.fillStyle = col; lctx.fillRect(x, y, 1, 1);
    }
  }

  // PoE-style drop: a thud of dust, a beam for the good stuff, a name tag
  function landed(c, v) {
    burst(v.x, v.y - 1, ['#c8b89a', '#8a7a60'], 5, 30, { grav: 60, life: 0.35 });
    v.hit = 0.08;
    if (c.tier >= 3) beams.push({ x: v.x, y: v.y, col: rarityCol(c.tier), life: 1.4 + c.tier * 0.2, max: 1.4 + c.tier * 0.2, w: c.tier >= 5 ? 7 : 5 });
    if (c.tier >= 2 || c.mod) text(v.x, v.y - 16, G.L(G.RARITIES[c.tier].name) + (c.mod ? ' · ' + G.L(G.MOD_BY_ID[c.mod].name) : ''), c.mod ? G.MOD_BY_ID[c.mod].color : rarityCol(c.tier), 3, { vy: -6, life: 1.6, max: 1.6 });
    if (c.tier >= 5) { St.shake(3); St.flash(0.2, rarityCol(c.tier)); }
    if (G.Audio && G.Audio.drop) G.Audio.drop(c.tier);
  }
  // ---------- The Looters ----------
  const lootVis = [];
  function stepLooters(dt, list) {
    const R = G.R, L = R.looters || [];
    lootVis.length = Math.min(lootVis.length, L.length);
    const b = btnPos();
    L.forEach((l, i) => {
      const home = { x: b.x + 22 + (i % 3) * 9, y: b.y + 22 + Math.floor(i / 3) * 7 };
      let v = lootVis[i];
      if (!v) v = lootVis[i] = { x: home.x, y: home.y, face: 1, walk: 0, lift: 0 };
      const cv = l.tgt != null ? vis.get(l.tgt) : null;
      const tgt = cv && !cv.arc ? { x: cv.x - 5, y: cv.y + 1 } : home;
      const dx = tgt.x - v.x, dy = tgt.y - v.y, d = Math.hypot(dx, dy);
      // it arrives just as its time is up, however far the chest is
      const left = cv ? Math.max(0.08, (G.D.autoOpen || 1) - l.acc) : 0.6;
      const sp = Math.min(400, Math.max(28, d / left));
      if (d > 0.5) { const k = Math.min(1, sp * dt / d); v.x += dx * k; v.y += dy * k; v.face = dx >= 0 ? 1 : -1; v.walk += dt * (6 + sp / 12); }
      if (v.lift > 0) v.lift -= dt;
      const moving = d > 1.5;
      list.push({ y: v.y, draw: () => drawLooter(v, moving) });
    });
  }
  function drawLooter(v, moving) {
    const id = v.lift > 0 ? 'looter_2' : moving ? 'looter_' + (Math.floor(v.walk) % 2) : 'looter_0';
    const spr = SPR.defs[id] ? SPR.get(id) : SPR.get('ic_key');
    const x = Math.round(v.x), y = Math.round(v.y) - (moving && Math.floor(v.walk * 2) % 2 ? 1 : 0);
    shadow(x, y - 1, 7);
    if (v.face < 0) { lctx.save(); lctx.translate(x, 0); lctx.scale(-1, 1); blit(spr, 0, y); lctx.restore(); } else blit(spr, x, y);
    if (moving && Math.random() < 0.2) part(x - v.face * 3, y - 1, '#c8b89a', { vx: -v.face * 10, vy: -6, grav: 20, life: 0.25 });

  function drawChest(c, v) {

  const FONT = '"Press Start 2P", "BTTN Body", monospace';
  // Press Start 2P is only crisp on an 8px device grid, so snap logical sizes to it.

  function drawTexts(dt) {

  let hudBottomH = 0, hudBottomT = 0;

  // Constellation
  renderers.stars = function (body) {
    const S = G.S;
    const width = Math.max(260, body.clientWidth - 24);
    const cell = Math.floor(Math.min(48, (width - 8) / 11));
    const cellY = Math.round(cell * 1.12);
    const mw = cell * 11 + 8, mh = cellY * 12 + 12;
    const pos = n => ({ x: 4 + (n.x + 5 + 0.5) * cell, y: 6 + (n.y + 5 + 0.5) * cellY });
    const nodeSize = Math.max(22, Math.round(cell * 0.72));
    let lines = '';
    for (const n of G.NODES) for (const r of n.req) {
      const a = pos(G.NODE_BY_ID[r]), b = pos(n);
      lines += `<line data-a="${r}" data-b="${n.id}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke-width="2"/>`;
    }
    body.innerHTML = `
      <p class="note">${esc(t('starsHint'))}</p>
      <div class="detail" data-detail></div>
      <div class="starmap" style="width:${mw}px;height:${mh}px">
        <svg viewBox="0 0 ${mw} ${mh}" aria-hidden="true">${lines}</svg>
        ${G.NODES.map(n => { const p = pos(n); const sz = n.max === 1 && n.cost >= 150 ? nodeSize + 6 : nodeSize; return `<button class="node${sz > nodeSize ? ' big' : ''}" data-n="${n.id}" style="left:${p.x}px;top:${p.y}px;width:${sz}px;height:${sz}px;--c:${G.BRANCH_COLORS[n.br]}" aria-label="${esc(L(n.name))}"><i></i></button>`; }).join('')}
      </div>`;
    refs.nodes = $$('.node', body).map(el => ({ el, n: G.NODE_BY_ID[el.dataset.n], lbl: el.querySelector('i') }));
    refs.lines = $$('line', body);
    refs.detail = body.querySelector('[data-detail]');
    body.querySelector('.starmap').addEventListener('click', e => {
      const b = e.target.closest('.node'); if (!b) return;
      // a second click buys with a mouse; on touch screens only the Learn button does, so nothing is bought unseen
      if (selNode === b.dataset.n && !matchMedia('(pointer: coarse)').matches) { if (!G.buyNode(selNode)) G.Audio.error(); }
      selNode = b.dataset.n;
      renderDetail(true);
      if (refs.detail) refs.detail.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      UI.update(true);
    });
    renderDetail(true);
  };
  function renderDetail(full) {
    const n = G.NODE_BY_ID[selNode], S = G.S;

    const L_ = S.nodes[n.id] || 0, maxed = L_ >= n.max, avail = G.nodeAvailable(n);
    const c = G.nodeCost(n);
    if (full || refs.detail.dataset.n !== n.id) {
      refs.detail.dataset.n = n.id;
      refs.detail.innerHTML = `<h3 style="color:${G.BRANCH_COLORS[n.br]}">${esc(L(n.name))} <span class="lv" data-lv style="font:8px var(--font-display);color:var(--dim)"></span></h3>

        <div class="act"><span class="reward">${img('ic_ess', '', 2)}<span data-cost></span></span><button class="btn gold" data-buy>${esc(t('learn'))}</button></div>`;
      refs.detail.querySelector('[data-buy]').addEventListener('click', () => { if (!G.buyNode(selNode)) G.Audio.error(); UI.update(true); });

  function crownBoard() {

    const top = Math.max(S.bestDepth, ...list.filter(e => e.ok).flatMap(e => Object.keys(e.cr || {}).map(Number)).filter(n => n < 100000));
    for (let d = G.REALM_SIZE - 1; d <= top; d += G.REALM_SIZE) {
      const best = list.filter(e => e.cr && e.cr[d]).sort((a, b) => a.cr[d] - b.cr[d])[0];
      const mine = S.rec.crowns && S.rec.crowns[d];

    help_13: 'Chests and Looters', help_13t: 'The Horde drops little chests of coin; the chest bar brings real ones. The Treasure Hall makes room for 10, 20, 30, 50, 100, then 200 chests. Looters run and open them for you, faster with each level, and Loot Crew hires more. When the field is full, the lowest chest bursts open for half its gold.',
    help_14: 'The JACKPOT', help_14t: 'About one kill in two million. The longer since the last one, the better the odds (your odds now are in the Party tab\u2019s records). You will know it when you see it.',
    help_15: 'Your powers', help_15t: 'Three powers of the Hand, on the buttons by the Button bar or the keys Z, X and C. Smite (18 s) breaks a boss\u2019s wind-up and hits it hard. Ward (26 s) stops all damage for 3.5 s: save it for a slam or a barrage. Mend (40 s) heals the Button and the whole party and raises the fallen.',
    help_16: 'Torment', help_16t: 'Conquer a land and a level of Torment opens, up to ten. Raise it with + under the land name: the Horde and the bosses get tougher and hit harder, and you get more gold, XP, loot and fame, and rarer gear sooner. New ground clears at a set pace, so strength alone no longer rushes you through: go as hard as you can hold.',
    help_17: 'The Town', help_17t: 'Tap TOWN at the top (or press T) between fights: the field holds still while you are there. The Forge dresses the party (EQUIP BEST does it in one tap), compares items and upgrades them with shards; the Enchanter uses your orbs; the Alchemist brews the potion you choose; the Tavern recruits companions; the board, the observatory and the hatchery open your quests, the constellation and the pets.',
    help_10: 'Carnage', help_10t: 'Kill without pause: the streak climbs and so do gold and XP, up to +40%. Let it lapse for 2.5 seconds and it starts over.',
  });

  // ---------- Pointer targets ----------
  const P = {
    button: () => G.Stage.buttonPoint(),
    chest: () => { const cs = G.S.chests; if (!cs.length) return null; const c = cs.reduce((a, b) => (b.tier > a.tier ? b : a), cs[0]); return G.Stage.chestPoint(c); },
    mob: () => { const ms = (G.R.mobs || []).slice().sort((a, b) => b.p - a.p); return ms.length ? G.Stage.mobPoint(ms[0]) : null; },
    wisp: () => G.Stage.wispPoint(),
    el: sel => { const e = typeof sel === 'string' ? $(sel) : sel; if (!e || !e.offsetParent) return null; const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top - 2, el: e }; },
    tab: id => P.el(`.tab[data-tab="${id}"]`),
    inTab: (id, sel) => (G.UI.tab() === id ? P.el(sel) : P.tab(id)),
  };
  const val = (f, S) => (typeof f === 'function' ? f(S) : f);

  // ---------- Guided steps ----------
  const STEPS = [
    { id: 'click', text: 'tu_click', point: P.button, done: S => S.clicks >= 12 },
    { id: 'chest', text: S => (S.chests.length ? 'tu_chest' : 'tu_chestWait'), point: S => (S.chests.length ? P.chest() : P.button()), done: S => S.st.chests >= 1 },
    { id: 'gear', text: 'tu_gear', point: () => P.tab('hero'), done: () => G.UI.tab() === 'hero' },
    { id: 'doll', text: 'tu_doll', point: () => P.inTab('hero', '.doll'), manual: true },
    { id: 'upg', text: S => (S.gold >= 15 || S.upg.finger ? 'tu_upg' : 'tu_upgWait'), point: S => (S.gold >= 15 ? P.inTab('upg', '.row[data-u="finger"]') : P.button()), done: S => (S.upg.finger || 0) >= 1 },
    { id: 'mobs', text: 'tu_mobs', point: () => P.mob() || P.button(), minT: 7000, done: S => S.hero.kills - (seen().tutK || 0) >= 40 },
    { id: 'garrison', text: S => (S.gold >= 50 ? 'tu_garrison' : 'tu_garrisonWait'), point: S => (S.gold >= 50 ? P.inTab('heroes', '.row[data-h="rogue"]') : P.button()), done: S => (S.heroes.rogue || 0) >= 1 },
    { id: 'boss', text: () => (G.R.boss ? 'tu_bossFight' : G.R.bossReady ? 'tu_bossReady' : 'tu_boss'),
      point: () => (G.R.boss ? P.button() : G.R.bossReady ? (P.el('#btnFight') || P.button()) : P.el('#bossRow')), done: S => S.st.bossKills >= 1 },
    { id: 'pets', text: 'tu_pets', point: () => P.inTab('pets', '[data-pull="1"]'), done: S => Object.keys(S.pets).length >= 1,
      skip: S => S.eggs < 1 && !Object.keys(S.pets).length },
    { id: 'final', text: 'tu_final', point: () => P.tab('ladder'), manual: true },
  ];

  // ---------- One-time tips (after the tutorial) ----------
  const TIPS = [
    { id: 'wisp', when: () => G.R.wisp, point: P.wisp, text: 'tip_wisp', until: () => !G.R.wisp },
    { id: 'mod', when: S => S.chests.some(c => c.mod), point: () => { const c = G.S.chests.find(x => x.mod); return c && G.Stage.chestPoint(c); },
      text: () => { const c = G.S.chests.find(x => x.mod); const m = c && G.MOD_BY_ID[c.mod]; return m ? t('tip_mod', G.L(m.name), G.L(m.desc)) : ''; }, raw: true, until: S => !S.chests.some(c => c.mod) },
    { id: 'bossReady', when: () => G.R.bossReady && !G.R.boss, point: () => P.el('#btnFight'), text: 'tip_bossReady', until: () => !G.R.bossReady },
    { id: 'ess', when: S => S.essence >= 1 && !Object.keys(S.nodes).length, point: () => P.inTab('stars', '[data-detail] [data-buy]'), text: 'tip_ess', until: S => Object.keys(S.nodes).length > 0 },
    { id: 'ability', when: S => S.hero.eq.ability, point: () => P.el('#btnAbil'), text: 'tip_ability' },
    { id: 'shards', when: S => S.hero.shards >= 40, point: () => P.tab('hero'), text: 'tip_shards', until: () => G.UI.tab() === 'hero' },
    { id: 'asc', when: () => G.fameGain() >= 1, point: () => P.tab('asc'), text: 'tip_asc', until: () => G.UI.tab() === 'asc' },
    { id: 'loot', when: () => (G.R.ground || []).some(e => e.t > 0.6 && (e.k !== 'gear' || e.r >= 1)), point: () => { const e = (G.R.ground || []).find(x => x.t > 0.6 && (x.k !== 'gear' || x.r >= 1)); return e && G.Stage.lootPoint(e); }, text: 'tip_loot', until: () => !(G.R.ground || []).length },
    { id: 'hoard', when: () => (G.R.mobs || []).some(m => m.kind === 'hoard' && !m.gob), point: () => { const m = G.R.mobs.find(x => x.kind === 'hoard' && !x.gob); return m && G.Stage.mobPoint(m); }, text: 'tip_hoard', until: () => !(G.R.mobs || []).some(m => m.kind === 'hoard' && !m.gob) },
    { id: 'shrine', when: () => G.R.shrine, point: () => G.Stage.shrinePoint(), text: 'tip_shrine', until: () => !G.R.shrine },
    { id: 'powers', when: () => G.R.boss && G.R.boss.t < G.R.boss.T - 2, point: () => P.el('#powers'), text: 'tip_powers', until: () => !G.R.boss },
    { id: 'move', when: () => G.R.boss && G.R.boss.move, point: () => G.Stage.weakPoint && G.Stage.weakPoint() && (() => { const w = G.Stage.weakPoint(), r = document.querySelector('#stage').getBoundingClientRect(); return { x: r.left + w.x, y: r.top + w.y - 10 }; })(), text: 'tip_move', until: () => !(G.R.boss && G.R.boss.move) },
    { id: 'town', when: () => G.UI._up && G.townOk() && !G.R.town, point: () => P.el('#btnTown'), text: 'tip_town', until: () => !!G.R.town },
    { id: 'torment', when: () => G.tormentMax() >= 1 && !G.R.boss, point: () => P.el('#torment'), text: 'tip_torment' },
    { id: 'orb', when: S => G.ORB_IDS.some(k => S.hero.orbs[k] > 0), point: () => P.tab('hero'), text: 'tip_orb', until: () => G.UI.tab() === 'hero' },
    { id: 'rift', when: () => G.riftOpenable() && !G.R.boss, point: () => P.el('#btnRift') || P.tab('rift'), text: 'tip_rift', until: () => G.UI.tab() === 'rift' || !!G.R.rift },
    { id: 'spitter', when: () => (G.R.mobs || []).some(m => m.kind === 'spitter' && m.spit), point: () => { const m = G.R.mobs.find(x => x.kind === 'spitter' && x.p >= G.TUNE.spitStop); return m && G.Stage.mobPoint(m); }, text: 'tip_spitter', until: () => !(G.R.mobs || []).some(m => m.kind === 'spitter') },
    { id: 'bomber', when: () => (G.R.mobs || []).some(m => m.kind === 'bomber' && m.p > 0.3), point: () => { const m = G.R.mobs.find(x => x.kind === 'bomber' && x.p > 0.3); return m && G.Stage.mobPoint(m); }, text: 'tip_bomber', until: () => !(G.R.mobs || []).some(m => m.kind === 'bomber') },
    { id: 'map', when: S => S.depth >= 1 && !G.R.boss, point: () => { const r = document.querySelector('#realmBox').getBoundingClientRect(); return { x: r.right + 14, y: Math.max(50, r.bottom) }; }, text: 'tip_map', until: () => !!G.UI.mapSeen },
    { id: 'carnage', when: () => G.carnage && G.carnage().tier >= 1, point: null, text: 'tip_carnage' },
    { id: 'wall', when: S => S.scar && S.scar.n >= 3 && G.fameGain() >= 1, point: () => P.tab('asc'), text: 'tip_wall', until: () => G.UI.tab() === 'asc' },
  ];

  let tip = null, tipT = 0, lastHl = null, shownT = 0, nextTipAt = 0;
  const TIP_GAP = 40000; // after the tutorial, one tip at a time with a breather between them
  const stepAt = { i: -1, t: 0 };
  const EVENT_TIPS = { hoard: 1, loot: 1, shrine: 1, move: 1, spitter: 1, bomber: 1, powers: 1 };

  function seen() { const S = G.S; S.seen = S.seen || {}; S.seen.tips = S.seen.tips || {}; return S.seen; }
  const veteran = S => S.clicks > 60 || S.ascensions > 0 || S.st.bossKills > 0 || S.maxDepth > 0 || S.goldTotal > 5000;
  function active() { return typeof G.S.tut === 'number' && G.S.tut >= 0 && G.S.tut < STEPS.length; }

  Tut.init = function () {
    const S = G.S;
    // Players who were already playing before onboarding existed skip the intro and tutorial
    if (S.tut === 0 && veteran(S)) S.tut = -1;
    $('#btnHelp').addEventListener('click', Tut.help);
    $('#coach').addEventListener('click', e => {
      // the bubble can appear under a finger that is busy clicking: ignore taps for a moment
      if (performance.now() - shownT < 500) return;
      if (e.target.closest('[data-skip]')) { G.S.tut = -1; hide(); return; }
      if (e.target.closest('[data-ok]')) {
        if (tip) { finishTip(); return; }
        if (active() && STEPS[S.tut] && STEPS[G.S.tut].manual) complete();
      }
    });
    G.on('buttonBreak', () => { if (!active() && !seen().tips.break && !G.R.rift) showTip({ id: 'break', text: 'tip_break' }); });
    G.on('potion', () => { if (!active() && !seen().tips.potion) showTip({ id: 'potion', text: 'tip_potion' }); });
    window.addEventListener('resize', () => place());
    Tut.maybeIntro();
    // A returning player on a new device: the cloud prompt goes first, the intro only if they keep this fresh save
    G.on('cloudNewer', () => { if (closeIntro) closeIntro(true); });
  };
  let closeIntro = null;
  Tut.maybeIntro = function () {
    const S = G.S;
    if (!seen().intro && !veteran(S) && !closeIntro) Tut.intro();
  };

  function complete() {
    const S = G.S, i = S.tut;
    const paid = seen().tutPaid = seen().tutPaid || {};
    const first = !paid[STEPS[i].id];
    paid[STEPS[i].id] = 1;
    const reward = i === STEPS.length - 1 ? null : Math.max(25, Math.round(G.D.incomeRef * 20));
    if (!first) { /* replaying the tutorial pays nothing */ }
    else if (reward) { G.addGold(reward, 'tutorial'); G.UI.toast(esc(t('tu_reward', G.fmt(reward) + ' ' + t('gold').toLowerCase())), 'ach', 'ic_coin'); }
    else { G.S.eggs += 1; G.UI.toast(esc(t('tu_reward', '1 ' + t('eggs').toLowerCase())), 'ach', 'ic_egg'); }
    S.tut = i + 1;
    while (active() && STEPS[S.tut].skip && STEPS[S.tut].skip(S)) S.tut++;
    // the welcome pack kills plenty before this step comes up, so count from here
    if (active() && STEPS[S.tut].id === 'mobs') seen().tutK = S.hero.kills;
    if (!active()) S.tut = -1;
    if (G.Audio) G.Audio.achievement();
  }

  // Called ~8 times a second from UI.update
  Tut.update = function () {
    const S = G.S;
    const busy = !$('#intro').hidden || !$('#modal').hidden || !$('#perks').hidden; // a level-up choice is on screen
    if (!S || !$('#coach') || busy) { hidePointer(); if (busy) $('#coach').hidden = true; stepAt.t += 120; return; }
    if (!S.hero || !S.hero.cls) { hide(); return; }
    // tips for things that come and go (a Hoarder, loot, a shrine, a boss move) may cut into the tutorial
    if (tip) {
      tipT -= 0.12;
      if (tipT <= 0 || (tip.until && tip.until(S))) { finishTip(); return; }
      point(tip.point ? tip.point() : null);
      return;
    }
    if (active()) {
      const st = STEPS[S.tut];
      if (stepAt.i !== S.tut) { stepAt.i = S.tut; stepAt.t = performance.now(); }
      const target = val(st.point, S);
      const inPanel = !!(target && target.el && target.el.closest('#panel'));
      const ev = !inPanel && TIPS.find(tp => EVENT_TIPS[tp.id] && !seen().tips[tp.id] && tp.when(S));
      if (ev) { showTip(ev); return; }
      if (st.skip && st.skip(S)) { S.tut++; if (!active()) S.tut = -1; return; }
      // a step that finishes on its own still stays up long enough to be read
      if (!st.manual && st.done(S) && performance.now() - stepAt.t > (st.minT || 3500)) { complete(); return; }
      render(st.id, t(val(st.text, S)), t('tu_step', S.tut + 1, STEPS.length), st.manual);
      point(val(st.point, S));
      return;
    }
    if (G.Stage.busyCelebrating && G.Stage.busyCelebrating()) return; // don't talk over a big drop
    // the wall tip comes back for each new wall
    if (S.scar && S.scar.n >= 3 && seen().tips.wall && seen().wallD !== S.scar.d) { delete seen().tips.wall; seen().wallD = S.scar.d; }
    const rest = performance.now() < nextTipAt;
    for (const tp of TIPS) {
      if (seen().tips[tp.id]) continue;
      // tips about something on screen right now can't wait; the rest keep their distance
      if (rest && !EVENT_TIPS[tp.id]) continue;
      if (tp.when(S)) { showTip(tp); return; }
    }
    hide();
  };

  function showTip(tp) {
    tip = tp; tipT = 9;
    const text = tp.raw ? tp.text() : t(val(tp.text, G.S));
    if (!text) { finishTip(); return; }
    render('tip:' + tp.id, text, '', true);
    point(tp.point ? tp.point() : null);
  }
  function finishTip() { if (tip) { seen().tips[tip.id] = 1; nextTipAt = performance.now() + TIP_GAP; } tip = null; hide(); }

  // ---------- Coach bubble & pointer ----------
  let lastKey = '';
  function render(key, text, step, manual) {
    const c = $('#coach');
    const k = key + text + step + manual;
    if (k !== lastKey) {
      lastKey = k; shownT = performance.now();
      c.innerHTML = `<div class="guide">${img('p_buttonling', 5)}</div>
        <div class="say"><b>${esc(t('tu_guide'))}</b>${step ? `<small>${esc(step)}</small>` : ''}<p>${esc(text)}</p>
          <div class="acts">${manual ? `<button class="btn gold" data-ok>${esc(t('tu_ok'))}</button>` : ''}${active() ? `<button class="linkBtn" data-skip>${esc(t('tu_skip'))}</button>` : ''}</div></div>`;
      c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
    }
    c.hidden = false;
    place();
  }
  // The bubble sits above the meters by default and moves out of the way when
  // the pointer's target would be underneath it (small screens, top-of-stage targets).
  let aim = null, placedY = null, aimEl = null;
  function place() {
    const c = $('#coach'), w = $('#stageWrap');
    if (!c || c.hidden || !w) return;
    const r = w.getBoundingClientRect();
    const width = Math.min(r.width - 20, 460);
    c.style.width = width + 'px';
    c.style.left = (r.left + (r.width - width) / 2) + 'px';
    const meters = document.querySelector('.hud.bottom');
    const bottom = meters ? meters.getBoundingClientRect().top : r.bottom;
    const h = c.offsetHeight;
    const spots = [Math.max(r.top + 50, bottom - h - 10), r.top + 50, window.innerHeight - h - 10];
    // keep off what is being pointed at, and off the Button and its boss skull where the player keeps tapping
    const bp = G.Stage.buttonPoint(), sc = G.Stage.toScreen(1, 0).x - G.Stage.toScreen(0, 0).x;
    const btn = { top: bp.y - 30 * sc, bottom: bp.y + 40 * sc };
    const off = (a, y) => !a || y >= a.bottom || y + h <= a.top;
    const clear = y => off(aim, y) && off(btn, y);
    let y = placedY !== null && spots.includes(placedY) && clear(placedY) ? placedY : spots.find(clear);
    if (y === undefined) y = spots.find(y2 => off(aim, y2));
    // what it points at is in the panel: keep the panel clear, even if the bubble has to cover part of the stage
    if (aimEl && aimEl.closest('#panel') && y === spots[2]) y = spots.slice(0, 2).find(y2 => off(btn, y2)) || spots[0];
    if (y === undefined) y = spots[0];
    if (y !== placedY) shownT = performance.now();
    placedY = y;
    c.style.top = y + 'px';
  }
  function point(p) {
    const el = $('#pointer');
    if (lastHl && (!p || p.el !== lastHl)) { lastHl.classList.remove('tut-hl'); lastHl = null; }
    if (!p) { el.hidden = true; aim = null; aimEl = null; place(); return; }
    if (p.el && !lastHl) {
      lastHl = p.el; lastHl.classList.add('tut-hl');
      const body = p.el.closest('.tabBody');
      if (body) { const br = body.getBoundingClientRect(), er = p.el.getBoundingClientRect(); if (er.top < br.top || er.bottom > br.bottom) p.el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    }
    if (!el.firstChild) el.innerHTML = img('ic_arrow', 5);
    el.hidden = false;
    el.style.transform = `translate(${Math.round(p.x - 25)}px, ${Math.round(p.y - 50)}px)`;
    // Arrow plus the thing it points at
    aim = { top: p.y - 58, bottom: p.y + 44 }; aimEl = p.el || null;
    if (p.el) { const er = p.el.getBoundingClientRect(); aim.top = Math.min(aim.top, er.top); aim.bottom = Math.max(aim.bottom, er.bottom); }
    place();
  }
  function hidePointer() { const el = $('#pointer'); if (el) el.hidden = true; if (lastHl) { lastHl.classList.remove('tut-hl'); lastHl = null; } }
  function hide() { const c = $('#coach'); if (c) c.hidden = true; lastKey = ''; placedY = null; aim = null; hidePointer(); }

  // ---------- Intro ----------
  Tut.intro = function () {
    const box = $('#intro');
    const skins = ['#e8413c'];
    const btn = G.SPR.url(G.SPR.button(skins[0], false, 0), 6);
    const slides = [
      { a: 'in_1', b: 'in_1b', art: `<div class="introTitle">${'BTTN'.split('').map((ch, i) => `<span style="animation-delay:${0.15 * i}s">${ch}</span>`).join('')}</div><img class="dropBtn" src="${btn}" alt="">` },
      { a: 'in_2', b: 'in_2b', art: `<div class="march"><span class="mL">${sm('f_crab')}${img('b_goblin', 4)}${sm('f_goblin')}</span><img class="midBtn" src="${G.SPR.url(G.SPR.button('#e8413c', false, 0), 4)}" alt=""><span class="mR">${sm('f_bat')}${img('b_imp', 4)}${sm('f_eye')}</span></div>` },
      { a: 'in_3', b: 'in_3b', art: `<div class="row3">${G.CLASSES.map((c, i) => `<span class="popIn" style="animation-delay:${0.2 * i}s">${img(c.spr, 8)}</span>`).join('')}</div>
          <div class="row3 small">${['bag_3', 'it_steel_sword', 'chest_4', 'it_golden_plate', 'bag_6'].map((id, i) => `<span class="popIn" style="animation-delay:${0.9 + 0.15 * i}s">${img(id, 5)}</span>`).join('')}</div>` },
      { a: 'in_4', b: 'in_4b', art: `<div class="handArt"><img class="zap l" src="${G.SPR.url('ic_bolt', 5)}" alt=""><img class="finger" src="${G.SPR.url('ic_finger', 8)}" alt=""><img class="btn2" src="${btn}" alt=""><img class="zap r" src="${G.SPR.url('ic_bolt', 5)}" alt=""></div>`, last: true },
    ];
    let i = 0, timer = null;
    const show = () => {
      const s = slides[i];
      box.innerHTML = `<div class="introInner">
        <div class="art">${s.art}</div>
        <h2 class="type" data-full="${esc(t(s.a))}"></h2>
        <p class="fadeIn">${esc(t(s.b))}</p>
        <div class="dots">${slides.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
        <div class="acts"><button class="linkBtn" data-skip>${esc(t('in_skip'))}</button><button class="btn gold" data-next>${esc(t(s.last ? 'in_play' : 'in_next'))}</button></div>
      </div>`;
      typeText(box.querySelector('.type'));
      if (G.Audio) G.Audio.coin && G.Audio.coin();
    };
    // `quiet` closes the intro without marking it seen (the cloud-save prompt took over)
    const end = quiet => {
      clearTimeout(timer);
      closeIntro = null;
      box.classList.add('out');
      setTimeout(() => { box.hidden = true; box.classList.remove('out'); box.innerHTML = ''; }, 450);
      if (quiet) return;
      seen().intro = 1;
      G.save && G.save();
      setTimeout(() => G.UI.pickClass(), 500);
    };
    closeIntro = end;
    const next = () => { G.Audio && G.Audio.unlock(); if (i < slides.length - 1) { i++; show(); } else end(false); };
    box.onclick = e => {
      if (e.target.closest('[data-skip]')) { end(false); return; }
      if (e.target.closest('[data-next]')) { next(); return; }
      const h = box.querySelector('.type');
      if (h && h.dataset.done !== '1') { h.textContent = h.dataset.full; h.dataset.done = '1'; } else next();
    };
    box.hidden = false;
    show();
  };
  function typeText(h) {
    if (!h) return;
    const full = h.dataset.full;
    let n = 0;
    const step = () => {
      if (!h.isConnected || h.dataset.done === '1') return;
      n += 2;
      h.textContent = full.slice(0, n);
      if (n < full.length) setTimeout(step, 28); else h.dataset.done = '1';
    };
    step();
  }

  Tut.help = function () {
    const rows = [['ic_coin', 1], ['ic_chest', 2], ['ic_sword', 3], ['h_priest', 11], ['ic_skull', 4], ['ic_town', 17], ['ic_bolt', 15], ['ic_skull', 16], ['ev_meteors', 12], ['ic_vault', 13], ['h_rogue', 5], ['ic_star', 6], ['ic_tomb', 7], ['ic_crown', 8], ['f_crab', 9], ['ic_skull', 10], ['ic_jackpot', 14]];
    const html = `<div class="helpList">${rows.map(([ic, n]) => `<div class="helpRow">${img(ic, 3)}<div><b>${esc(t('help_' + n))}</b><p>${esc(t('help_' + n + 't'))}</p></div></div>`).join('')}</div>

      { label: t('help_intro'), fn: () => Tut.intro() },

/* js/main.js */
// BTTN — boot, main loop, saving, offline progress and live-reload snapshots.
(function (G) {
  'use strict';
  const KEY = 'bttn-save-v1';
  const get = () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
  const put = v => { try { localStorage.setItem(KEY, v); return true; } catch (e) { return false; } };

  G.save = function () { const s = G.serialize(); put(s); return s; };
  G.exportSave = () => btoa(unescape(encodeURIComponent(G.serialize())));
  G.importSave = function (code) {
    try {
      let json = code.trim();
      if (json[0] !== '{') json = decodeURIComponent(escape(atob(json)));
      G.deserialize(json);
      G.fillQuests(); G.save(); G.emit('ascend', 0);
      return true;
    } catch (e) { return false; }
  };
  G.hardReset = function () {
    G.S = G.newState();
    G.R.boss = null; G.R.bossReady = false; G.R.combo = 0; G.R.wisp = null;
    if (G.worldClear) G.worldClear();
    if (G.R.mobs) G.R.mobs.length = 0; if (G.R.shots) G.R.shots.length = 0;
    G.recalc(); G.fillQuests(); G.save();
    G.emit('ascend', 0);
  };

  let last = 0, uiT = 0, saveT = 15;
  // A render or UI error must never stop the game: the next frame is always booked first
  let frameErr = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    try { step(now); } catch (e) { if (frameErr++ < 3) console.error(e); }
  }
  function step(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 60) {
      const r = G.applyOffline(dt);
      G.UI.offline(r);
      dt = 0;
    } else if (dt > 1) {
      // Tab was in the background briefly: catch up at full speed in small steps.
      let left = dt;
      while (left > 0) { const s = Math.min(0.5, left); G.tick(s); left -= s; }
      dt = 0;
    }
    dt = Math.min(dt, 0.1);
    G.tick(dt);
    G.Stage.frame(dt);
    uiT -= dt;
    if (uiT <= 0) { uiT = 0.12; G.UI.update(); }
    saveT -= dt;
    if (saveT <= 0) { saveT = 15; G.save(); if (G.Net) G.Net.tick(); }
  }

  function boot(data) {
    let loaded = false;
    const raw = (data && data.save) || get();
    if (raw) { try { G.deserialize(raw); loaded = true; } catch (e) { G.S = G.newState(); } }
    delete G.S.set.lang; // older saves carried a language choice
    G.recalc();
    G.fillQuests();
    let offline = null;
    if (loaded && !(data && data.save)) offline = G.applyOffline((Date.now() - G.S.lastSave) / 1000);
    G.Stage.init(document.getElementById('stage'));
    G.UI.init();
    if (offline) G.UI.offline(offline);
    if (G.Net) G.Net.start();
    window.addEventListener('resize', () => { G.Stage.resize(); if (document.querySelector('.starmap')) G.UI.render(); });
    // loot still on the ground goes into the bag before the tab goes away
    const gather = () => { if (G.pickupAll) G.pickupAll(); };
    document.addEventListener('visibilitychange', () => { if (document.hidden) { gather(); G.save(); if (G.Net) G.Net.tick(true); } });
    window.addEventListener('pagehide', () => { gather(); G.save(); });
    const hot = window.claude && window.claude.hot;
    if (hot && hot.snapshot) { try { hot.snapshot(() => ({ save: G.serialize() })); } catch (e) { /* optional */ } }
    last = performance.now();
    requestAnimationFrame(frame);
  }

  const hot = window.claude && window.claude.hot;
  const start = () => {
    if (hot && hot.ready) hot.ready(boot);
    else boot((hot && hot.data) || {});
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})(globalThis.G = globalThis.G || {});
