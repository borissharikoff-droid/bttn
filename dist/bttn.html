:root {
  --bg: #0e0c15;
  --panel: #1d1b26;
  --panel2: #262331;
  --slot: #332f40;
  --slot-hi: #403b50;
  --line: #474258;
  --line-hi: #6d6784;
  --ink: #0a0910;
  --text: #f1ece0;
  --dim: #a9a2b9;
  --faint: #6f6883;
  --gold: #ffd84a;
  --gold-dk: #c98f10;
  --ess: #b76eff;
  --fame: #ffa033;
  --egg: #f4ecd8;
  --hp: #e84a4a;
  --mp: #4c86ff;
  --xp: #56d45a;
  --good: #56d45a;
  --bad: #ff5a5a;
  --r0: #c7b299; --r1: #63d85b; --r2: #4fa8ff; --r3: #b36bff; --r4: #ffa033; --r5: #ff4f7e; --r6: #ffffff;
  --font-display: "Press Start 2P", "BTTN Body", ui-monospace, monospace;
  --font-body: "BTTN Body", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.35 var(--font-body);
  -webkit-font-smoothing: none; font-smooth: never;
  overflow: hidden; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
img, canvas { image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

#app { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: 100%; }

/* ---------- Stage ---------- */
#stageWrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--ink); }
#stage { display: block; position: absolute; inset: 0; touch-action: none; }
.hud { position: absolute; left: 0; right: 0; pointer-events: none; display: flex; gap: 8px; padding: 10px 12px; align-items: flex-start; }
.hud.top { top: 10px; justify-content: space-between; }
.hud.bottom { bottom: 0; flex-direction: column; align-items: stretch; gap: 6px; }
.hud .pill { pointer-events: auto; }
.realm { font: 8px/1.6 var(--font-display); letter-spacing: 0.04em; text-shadow: 2px 2px 0 var(--ink); }
.realm b { color: var(--gold); font-weight: normal; }
.realm small { display: block; font: 15px/1.2 var(--font-body); color: var(--dim); letter-spacing: 0; }
.hudBtns { display: flex; gap: 6px; pointer-events: auto; }
.iconBtn {
  width: 34px; height: 34px; padding: 0; display: grid; place-items: center; cursor: pointer;
  background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line), 0 2px 0 var(--ink);
}
.iconBtn img { width: 20px; height: 20px; }
.iconBtn.off { opacity: 0.45; }
.iconBtn:focus-visible, .btn:focus-visible, .tab:focus-visible, .row:focus-visible, .slot:focus-visible, .node:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.meter { position: relative; height: 16px; background: var(--ink); border: 2px solid var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--xp); box-shadow: inset 0 3px 0 rgba(255,255,255,.25), inset 0 -3px 0 rgba(0,0,0,.25); transition: width .12s linear; }
.meter.combo > i { background: var(--mp); }
.meter.combo.hot > i { background: #ff7ae6; }
.meter.boss > i { background: var(--fame); }
.meter.hp > i { background: var(--hp); }
.meter > span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 8px/1 var(--font-display); text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink); white-space: nowrap; }
.bossRow { display: flex; gap: 8px; align-items: center; }
.bossRow .meter { flex: 1; }
.buffs { display: flex; gap: 6px; flex-wrap: wrap; }
.buff { font: 8px/1 var(--font-display); padding: 5px 7px; background: rgba(10,9,16,.8); border: 2px solid var(--gold); color: var(--gold); }
.buff.storm { border-color: #7fe9ff; color: #7fe9ff; }

#toasts { position: absolute; top: 54px; right: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; z-index: 5; width: min(70%, 320px); }
.toast { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--panel); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line-hi), 0 3px 0 var(--ink); font-size: 15px; line-height: 1.2; animation: toastIn .18s ease-out; max-width: 100%; }
.toast img { width: 24px; height: 24px; flex: none; }
.toast b { color: var(--gold); font-weight: 600; }
.toast.ach { box-shadow: inset 0 0 0 2px var(--gold), 0 3px 0 var(--ink); }
.toast.out { animation: toastOut .25s ease-in forwards; }
@keyframes toastIn { from { transform: translateY(-8px); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(-8px); opacity: 0; } }

/* Big loot banner */
#banner { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 6; }
#banner .inner { text-align: center; animation: bannerIn .5s cubic-bezier(.2,1.6,.4,1); }
#banner h2 { margin: 0 0 10px; font: 16px/1.4 var(--font-display); letter-spacing: 0.08em; text-shadow: 3px 3px 0 var(--ink); }
#banner .ico { width: 96px; height: 96px; filter: drop-shadow(0 0 18px currentColor); animation: spin 2.4s linear infinite; }
#banner p { margin: 8px 0 0; font: 20px/1.2 var(--font-body); text-shadow: 2px 2px 0 var(--ink); }
#banner.out .inner { animation: toastOut .4s ease-in forwards; }
@keyframes bannerIn { from { transform: scale(.3); opacity: 0; } }
@keyframes spin { 0%,100% { transform: rotate(-8deg) scale(1); } 50% { transform: rotate(8deg) scale(1.08); } }

/* ---------- Panel ---------- */
#panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 3px solid var(--ink); box-shadow: inset 2px 0 0 var(--line); }
.res { padding: 12px 14px 10px; background: var(--panel2); border-bottom: 3px solid var(--ink); box-shadow: inset 0 -2px 0 var(--line); display: grid; gap: 8px; }
.goldLine { display: flex; align-items: center; gap: 10px; }
.goldLine img { width: 32px; height: 32px; }
.goldNum { font: 24px/1 var(--font-display); color: var(--gold); text-shadow: 3px 3px 0 var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rates { display: flex; gap: 12px; flex-wrap: wrap; color: var(--dim); font-size: 15px; }
.rates b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.subRes { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px 3px 4px; background: var(--slot); border: 2px solid var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
.chip img { width: 18px; height: 18px; }
.chip.ess b { color: var(--ess); } .chip.egg b { color: var(--egg); } .chip.fame b { color: var(--fame); }
.chip b { font-weight: 600; }

.tabs { display: flex; gap: 4px; padding: 8px 10px; overflow-x: auto; scrollbar-width: none; border-bottom: 3px solid var(--ink); background: var(--panel); flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; flex: none; width: 40px; height: 40px; padding: 0; display: grid; place-items: center; cursor: pointer;
  background: var(--slot); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
.tab img { width: 24px; height: 24px; }
.tab.on { background: var(--slot-hi); box-shadow: inset 0 0 0 2px var(--gold); }
.tab.locked { opacity: 0.3; cursor: default; }
.tab.afford::after { content: ''; position: absolute; left: 3px; bottom: 3px; width: 6px; height: 6px; background: var(--gold); box-shadow: 1px 1px 0 var(--ink); }
.tab .dot { position: absolute; top: -4px; right: -4px; width: 10px; height: 10px; background: var(--bad); border: 2px solid var(--ink); }
.tabTitle { padding: 10px 14px 0; font: 8px/1.6 var(--font-display); color: var(--gold); letter-spacing: 0.04em; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tabTitle small { font: 15px/1.2 var(--font-body); color: var(--dim); letter-spacing: 0; }
.tabBody { flex: 1; overflow-y: auto; padding: 8px 10px 16px; min-height: 0; overscroll-behavior: contain; }
.tabBody::-webkit-scrollbar { width: 10px; } .tabBody::-webkit-scrollbar-thumb { background: var(--line); border: 2px solid var(--panel); }
.note { color: var(--dim); font-size: 15px; margin: 4px 4px 10px; max-width: 60ch; }
.sect { margin: 14px 4px 8px; font: 8px/1.6 var(--font-display); color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; }

.list { display: grid; gap: 6px; }
.row {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left;
  padding: 7px 9px; cursor: pointer; background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line);
}
.row:hover { background: var(--slot); }
.row:active { transform: translateY(1px); }
.row.cant { cursor: default; }
.row.cant .cost { color: var(--bad); }
.row.maxed { opacity: .7; cursor: default; }
.row.maxed .cost { color: var(--good); }
.row.can { box-shadow: inset 0 0 0 2px var(--line-hi); }
.row.can .cost { color: var(--gold); }
.row .ico { width: 44px; height: 44px; display: grid; place-items: center; background: var(--slot); border: 2px solid var(--ink); }
.row .ico img { width: 40px; height: 40px; }
.row .info { min-width: 0; }
.row .name { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 15px; color: #fff; }
.row .lv { font: 8px/1 var(--font-display); color: var(--dim); }
.row .desc { color: var(--dim); font-size: 15px; line-height: 1.25; }
.row .cost { display: flex; align-items: center; gap: 5px; font: 8px/1 var(--font-display); white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .cost img { width: 16px; height: 16px; }
.row .bar { height: 4px; margin-top: 5px; background: var(--ink); }
.row .bar i { display: block; height: 100%; width: 0; background: var(--gold); }
.row.shake { animation: shake .25s; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.row .count { font: 8px/1 var(--font-display); color: var(--text); }
.row.locked { opacity: .55; cursor: default; }
.row.locked .ico img { filter: brightness(0) opacity(.55); }

.seg { display: inline-flex; border: 2px solid var(--ink); }
.seg button { padding: 5px 8px; background: var(--slot); border: 0; border-right: 2px solid var(--ink); cursor: pointer; font: 8px/1 var(--font-display); color: var(--dim); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--slot-hi); color: var(--gold); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; cursor: pointer;
  background: #3a3550; border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line-hi), 0 3px 0 var(--ink); font: 8px/1.2 var(--font-display); color: var(--text); letter-spacing: 0.03em; }
.btn:hover { background: #46406a; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--line-hi), 0 1px 0 var(--ink); }
.btn img { width: 16px; height: 16px; }
.btn.gold { background: #8a5a10; box-shadow: inset 0 0 0 2px var(--gold), 0 3px 0 var(--ink); color: #fff6d0; }
.btn.gold:hover { background: #a86e14; }
.btn.red { background: #6a1f2a; box-shadow: inset 0 0 0 2px #ff6a6a, 0 3px 0 var(--ink); }
.btn.fight { pointer-events: auto; background: #7a2a14; box-shadow: inset 0 0 0 2px var(--fame), 0 3px 0 var(--ink); animation: pulse 0.9s ease-in-out infinite; padding: 6px 10px; }
.btn[disabled] { opacity: .45; cursor: default; transform: none; }
@keyframes pulse { 50% { filter: brightness(1.3); } }

/* Potion stat grid (RotMG-style character stats) */
.statGrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 0 0 6px; }
.stat { display: flex; align-items: center; gap: 4px; padding: 4px; background: var(--panel2); border: 2px solid var(--ink); font-variant-numeric: tabular-nums; }
.stat img { width: 20px; height: 20px; }
.stat b { font: 8px/1 var(--font-display); color: var(--dim); }
.stat span { font-size: 15px; margin-left: auto; }
.stat.full span { color: var(--gold); }

/* Constellation */
.starmap { position: relative; margin: 4px auto 8px; background: radial-gradient(ellipse at center, #1c1830 0%, #0b0a12 75%); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); overflow: hidden; }
.starmap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; transform: translate(-50%, -50%); width: 34px; height: 34px; padding: 0; cursor: pointer; display: grid; place-items: center;
  background: #15131e; border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); font: 8px/1 var(--font-display); color: var(--dim); }
.node::before { content: ''; width: 40%; height: 40%; background: currentColor; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
.node i { position: absolute; bottom: -6px; right: -8px; font-style: normal; font-size: 8px; line-height: 1; padding: 2px 2px 1px; background: var(--ink); color: var(--dim); white-space: nowrap; }
.node.avail { color: var(--c); box-shadow: inset 0 0 0 2px var(--c); }
.node.owned { color: var(--c); background: #231f33; box-shadow: inset 0 0 0 2px var(--c), 0 0 10px var(--c); }
.node.maxed { background: var(--c); color: var(--ink); }
.node.maxed i { color: var(--c); }
.node.locked { opacity: .35; }
.node.sel { outline: 2px solid #fff; outline-offset: 2px; }
.detail { padding: 10px 12px; background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); display: grid; gap: 6px; }
.detail h3 { margin: 0; font-size: 20px; font-weight: 600; }
.detail p { margin: 0; color: var(--dim); font-size: 15px; }
.detail .act { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }

/* Collection slots */
.rarRow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; margin-bottom: 4px; }
.rarLabel { margin: 10px 4px 5px; font: 8px/1 var(--font-display); letter-spacing: .06em; display: flex; justify-content: space-between; }
.slot { position: relative; aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; cursor: pointer; padding: 0;
  background: var(--slot); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line), inset 0 -4px 0 rgba(0,0,0,.25); }
.slot img { width: 70%; height: 70%; }
.slot.none img { filter: brightness(0) opacity(.5); }
.slot .n { position: absolute; right: 3px; bottom: 2px; font: 8px/1 var(--font-display); text-shadow: 1px 1px 0 var(--ink); }
.slot .stars { position: absolute; left: 3px; top: 3px; display: flex; gap: 1px; }
.slot .stars i { width: 4px; height: 4px; background: var(--gold); box-shadow: 1px 1px 0 var(--ink); }
.slot.sel { box-shadow: inset 0 0 0 2px #fff; }
.slot.r6:not(.none) { animation: shimmer 2.5s linear infinite; }
@keyframes shimmer { 50% { box-shadow: inset 0 0 0 2px #fff, 0 0 10px #bfe8ff; } }
.bonusList { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; font-size: 15px; color: var(--dim); margin: 4px 4px 10px; }
.bonusList b { color: var(--good); font-weight: 600; }
.modList { display: grid; gap: 4px; }
.modItem { display: flex; gap: 8px; align-items: baseline; font-size: 15px; }
.modItem b { font-weight: 600; min-width: 9em; }
.modItem span { color: var(--dim); }
.modItem.off { opacity: .45; }
.tierCounts { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font: 8px/1.4 var(--font-display); text-align: center; }
.tierCounts div { padding: 6px 2px; background: var(--panel2); border: 2px solid var(--ink); }

/* Pets */
.hatch { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; background: linear-gradient(180deg, #2a2438, #1d1a28); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line-hi); }
.hatch .egg { width: 96px; height: 96px; animation: wobble 1.8s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes wobble { 0%,70%,100% { transform: rotate(0); } 78% { transform: rotate(-8deg); } 86% { transform: rotate(7deg); } 93% { transform: rotate(-3deg); } }
.hatch .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.hatch small { display: block; color: var(--dim); font-size: 15px; margin-top: 6px; }
.petGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pet { position: relative; display: grid; justify-items: center; gap: 2px; padding: 8px 4px 6px; cursor: pointer; text-align: center;
  background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
.pet img { width: 48px; height: 48px; }
.pet b { font-size: 15px; font-weight: 600; }
.pet small { font-size: 15px; color: var(--dim); line-height: 1.2; }
.pet .lv { font: 8px/1 var(--font-display); color: var(--dim); }
.pet.on { box-shadow: inset 0 0 0 2px var(--good); background: #22302a; }
.pet.none { opacity: .45; cursor: default; }
.pet.none img { filter: brightness(0) opacity(.6); }
.pet.gold { box-shadow: inset 0 0 0 2px var(--gold); }
.pet.on.gold { box-shadow: inset 0 0 0 2px var(--gold), 0 0 0 2px var(--good); }
.pet .tag { position: absolute; top: 4px; right: 4px; font: 8px/1 var(--font-display); padding: 3px; background: var(--good); color: var(--ink); }

/* Quests */
.quest { padding: 10px 12px; background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); display: grid; gap: 7px; }
.quest.done { box-shadow: inset 0 0 0 2px var(--gold); }
.quest .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.quest .top b { font-weight: 600; font-size: 15px; }
.reward { display: inline-flex; align-items: center; gap: 4px; font: 8px/1 var(--font-display); white-space: nowrap; }
.reward img { width: 16px; height: 16px; }
.pbar { position: relative; height: 14px; background: var(--ink); border: 2px solid var(--ink); }
.pbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--xp); }
.pbar span { position: absolute; inset: 0; display: grid; place-items: center; font: 8px/1 var(--font-display); text-shadow: 1px 1px 0 var(--ink); }
.quest.wait { opacity: .6; text-align: center; color: var(--dim); font-size: 15px; }
.dailyDays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dailyDays div { padding: 6px 2px; text-align: center; background: var(--slot); border: 2px solid var(--ink); font: 8px/1.4 var(--font-display); color: var(--dim); }
.dailyDays div.past { color: var(--good); }
.dailyDays div.now { box-shadow: inset 0 0 0 2px var(--gold); color: var(--gold); }
.dailyDays img { width: 20px; height: 20px; display: block; margin: 2px auto; }

/* Achievements */
.achGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.ach { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px 8px; background: var(--panel2); border: 2px solid var(--ink); }
.ach img { width: 28px; height: 28px; }
.ach b { display: block; font-size: 15px; font-weight: 600; line-height: 1.15; }
.ach small { color: var(--dim); font-size: 15px; line-height: 1.2; display: block; }
.ach.no { opacity: .45; }
.ach.no img { filter: grayscale(1) brightness(.6); }
.skinRow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.skin { display: grid; justify-items: center; gap: 4px; padding: 8px 4px; cursor: pointer; background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); font-size: 15px; }
.skin canvas, .skin img { width: 58px; height: auto; }
.skin.on { box-shadow: inset 0 0 0 2px var(--gold); }
.skin.no { opacity: .4; cursor: default; }
.statList { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 15px; margin: 0 4px; }
.statList span { color: var(--dim); }
.statList b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

/* Ascension */
.ascBox { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 14px; background: linear-gradient(180deg, #2a2238, #16131f); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line-hi); }
.ascBox img { width: 80px; height: 72px; }
.ascBox .big { font: 16px/1.2 var(--font-display); color: var(--fame); text-shadow: 3px 3px 0 var(--ink); }
.ascBox p { margin: 0; color: var(--dim); font-size: 15px; max-width: 46ch; }

/* Settings */
.setList { display: grid; gap: 8px; }
.setRow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; background: var(--panel2); border: 2px solid var(--ink); font-size: 15px; }
.toggle { width: 48px; height: 26px; position: relative; cursor: pointer; background: var(--ink); border: 2px solid var(--line); padding: 0; flex: none; }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: var(--faint); transition: left .12s; }
.toggle.on { border-color: var(--good); }
.toggle.on::after { left: 24px; background: var(--good); }
input[type=range] { accent-color: var(--gold); width: 140px; }
textarea { width: 100%; min-height: 84px; resize: vertical; background: var(--ink); color: var(--text); border: 2px solid var(--line); padding: 8px; font: 12px/1.3 ui-monospace, monospace; -webkit-user-select: text; user-select: text; }

/* Modal */
#modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(6,5,10,.72); padding: 16px; }
#modal .box { width: min(460px, 100%); max-height: 90%; overflow-y: auto; padding: 18px; background: var(--panel); border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line-hi), 0 6px 0 var(--ink); display: grid; gap: 12px; animation: toastIn .2s ease-out; }
#modal h2 { margin: 0; font: 16px/1.5 var(--font-display); color: var(--gold); text-align: center; }
#modal p { margin: 0; color: var(--dim); text-align: center; }
#modal .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.sumList { display: grid; gap: 6px; }
.sumList div { display: flex; align-items: center; gap: 8px; justify-content: center; font: 8px/1 var(--font-display); }
.sumList img { width: 22px; height: 22px; }
.pullGrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pullCard { display: grid; justify-items: center; gap: 2px; padding: 8px 2px; background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--c, var(--line)); font-size: 15px; text-align: center; opacity: 0; animation: reveal .35s ease-out forwards; }
.pullCard img { width: 40px; height: 40px; }
.pullCard em { font: 8px/1 var(--font-display); font-style: normal; color: var(--gold); }
@keyframes reveal { from { transform: scale(.4) rotate(-10deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* Character */
.hpRow { display: flex; gap: 8px; align-items: stretch; }
.hpRow .meter { flex: 1; align-self: center; }
.meter.hpm > i { background: var(--good); }
.meter.hpm.low > i { background: var(--hp); }
.abil { position: relative; width: 44px; height: 44px; padding: 0; margin-top: -26px; cursor: pointer; pointer-events: auto; overflow: hidden;
  background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line-hi), 0 3px 0 var(--ink); display: grid; place-items: center; }
.abil img { width: 30px; height: 30px; position: relative; z-index: 1; }
.abil i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(10,9,16,.7); z-index: 2; }
.abil.ready { box-shadow: inset 0 0 0 2px var(--gold), 0 3px 0 var(--ink); animation: pulse 1.1s ease-in-out infinite; }
.charCard { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px; background: linear-gradient(180deg, #2a2438, #1d1a28); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line-hi); }
#xpBar { position: absolute; left: 0; right: 0; top: 0; height: 10px; background: #0c0b12; z-index: 4; pointer-events: none; }
#xpBar i { position: absolute; left: 0; top: 0; bottom: 2px; width: 0; background: linear-gradient(#a8dcff, #4f8cff 55%, #2c5ac8); box-shadow: 0 0 6px #4f8cff; transition: width .25s ease-out; }
#xpBar span { position: absolute; right: 8px; top: 1px; font: 8px/8px var(--font-display); color: #ffffff; text-shadow: 1px 1px 0 #0c0b12; }
#xpBar.up i { animation: xpUp .6s ease-out; }
@keyframes xpUp { 0% { background: #ffffff; } }
#perks { position: absolute; left: 50%; bottom: 112px; transform: translateX(-50%); z-index: 12; width: min(94%, 480px); display: flex; flex-direction: column; align-items: center; gap: 6px; }
#perks h3 { margin: 0; font: 16px/1.2 var(--font-display); color: #a8dcff; text-shadow: 2px 2px 0 var(--ink); text-align: center; animation: popIn .35s cubic-bezier(.3,1.7,.5,1) both; }
#perks .cards { display: flex; gap: 8px; width: 100%; }

.handArt .zap.l { left: -58px; } .handArt .zap.r { right: -58px; animation-delay: .4s; }
@keyframes zapF { 50% { opacity: 0; } }

  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }

<script>
/* js/util.js */
// BTTN — shared helpers. Every file attaches to the global G namespace so the
// game runs from file://, as a single inlined page, and inside a Node sim.
(function (G) {
  'use strict';

  const SUFFIXES = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc',
    'UDc', 'DDc', 'TDc', 'QaDc', 'QiDc', 'SxDc', 'SpDc', 'OcDc', 'NoDc', 'Vg'];

  // Compact number: 999, 1.23K, 45.6M, 7.89e75
  function fmt(n, small) {
    if (n === undefined || n === null || Number.isNaN(n)) return '0';
    if (!Number.isFinite(n)) return '∞';
    const neg = n < 0; if (neg) n = -n;
    let s;
    if (n < 1000) {
      if (small && n < 10 && n % 1 !== 0) s = (Math.floor(n * 10) / 10).toString();
      else if (small && n < 100 && n % 1 !== 0) s = (Math.floor(n * 10) / 10).toFixed(1);
      else s = Math.floor(n).toString();
    } else {
      const e = Math.floor(Math.log10(n) / 3);
      if (e < SUFFIXES.length) {
        const v = n / Math.pow(1000, e);
        const d = v < 10 ? 2 : v < 100 ? 1 : 0;
        s = (Math.floor(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d) + SUFFIXES[e];
      } else {
        const ex = Math.floor(Math.log10(n));
        s = (n / Math.pow(10, ex)).toFixed(2) + 'e' + ex;
      }
    }
    return (neg ? '-' : '') + s;
  }

  function fmtPct(x) { // 0.25 -> +25%
    const v = x * 100;
    return (v >= 0 ? '+' : '') + (Math.abs(v) < 10 && v % 1 ? v.toFixed(1) : Math.round(v)) + '%';
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600),
      m = Math.floor(sec % 3600 / 60), s = sec % 60;
    if (d) return d + 'd ' + h + 'h';
    if (h) return h + 'h ' + m + 'm';
    if (m) return m + 'm ' + s + 's';
    return s + 's';
  }

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  // All game randomness goes through G.rng so a run can be replayed from a seed
  // (G.useSeed) — the base for a cheat-resistant ladder. Visual effects may
  // keep using Math.random.
  G.rng = Math.random;
  const rnd = () => G.rng();
  const rand = (a = 0, b = 1) => a + rnd() * (b - a);
  const randInt = (a, b) => Math.floor(a + rnd() * (b - a + 1));
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const chance = p => rnd() < p;

  function weighted(weights) { // returns index
    let total = 0;
    for (let i = 0; i < weights.length; i++) total += weights[i];
    let r = rnd() * total;
    for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r < 0) return i; }
    return weights.length - 1;
  }

  // Deterministic RNG for level decoration so a biome always looks the same.
  function seeded(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  G.useSeed = seed => { G.rng = seed == null ? Math.random : seeded(seed); };

  function todayKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // Sum of geometric series cost: buying `n` levels starting from level L.
  function geoCost(base, growth, L, n) {
    if (n <= 0) return 0;
    if (growth === 1) return base * n;
    return base * Math.pow(growth, L) * (Math.pow(growth, n) - 1) / (growth - 1);
  }
  // How many levels are affordable with `money`.
  function geoMax(base, growth, L, money) {
    const first = base * Math.pow(growth, L);
    if (money < first) return 0;
    return Math.floor(Math.log(money * (growth - 1) / first + 1) / Math.log(growth));
  }

  const hexToRgb = h => {
    h = h.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  };
  const rgbToHex = (r, g, b) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  function shade(hex, amt) { // amt -1..1
    const [r, g, b] = hexToRgb(hex);
    if (amt >= 0) return rgbToHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
    return rgbToHex(r * (1 + amt), g * (1 + amt), b * (1 + amt));
  }

  // Tiny event bus: logic emits, stage/ui/audio listen.
  const listeners = {};
  function on(ev, fn) { (listeners[ev] = listeners[ev] || []).push(fn); }
  function emit(ev, a, b, c) {
    const l = listeners[ev]; if (!l) return;
    for (let i = 0; i < l.length; i++) l[i](a, b, c);
  }

  Object.assign(G, {
    fmt, fmtPct, fmtTime, clamp, lerp, rand, randInt, pick, chance, weighted, seeded,
    todayKey, geoCost, geoMax, hexToRgb, rgbToHex, shade, on, emit,
  });
})(globalThis.G = globalThis.G || {});

/* js/data.js */
// BTTN — all game content. Descriptions use {0}
// placeholders filled from val(level). Effects are applied in G.recalc().
(function (G) {
  'use strict';

  // ---------- Rarities ----------
  // secs: item value measured in "seconds of income" so chests stay relevant all game.
  G.RARITIES = [

      const p = petPower(st) * d.petMult;
      if (pet.fx) pet.fx(p, d);
      if (pet.cps) d.petCps += petCps(pet, st) * Math.sqrt(d.petMult);
    }
    d.crit = Math.min(0.9, d.crit);
    d.petCps *= d.spdMult; d.autoCps *= d.spdMult; d.petOpen *= d.spdMult;
    if (d.autoOpen) d.autoOpen /= d.spdMult;
    d.comboCap = Math.floor(d.comboCap);

    d.depthMult = Math.pow(TUNE.depthGold, S.depth);
    const buffGold = hasBuff('frenzy') ? 7 : 1, buffClick = hasBuff('storm') ? 77 : 1;
    d.buffGold = buffGold; d.buffClick = buffClick;

    let heroGps = 0;
    d.heroGps = {};
    for (const h of G.HEROES) {
      const n = S.heroes[h.id] || 0;
      if (!n) continue;
      const g = n * h.gps * Math.pow(2, heroMilestones(n)) * d.gpsMult * d.goldMult * d.depthMult;
      d.heroGps[h.id] = g; heroGps += g;
    }
    d.gpsBase = heroGps;
    d.gps = heroGps * buffGold;
    const clickCore = d.clickAdd * d.clickMult * d.goldMult * d.depthMult;
    d.clickBase = clickCore + d.gpsBase * d.clickGpsPct;
    d.click = (clickCore * buffGold + d.gps * d.clickGpsPct) * buffClick;
    d.incomeRef = Math.max(1, d.gps + (clickCore * buffGold + d.gps * d.clickGpsPct) * 3);
    d.effLuck = d.luck + S.depth * 0.003;
    if (G.heroFinish) G.heroFinish(d);
    Object.keys(D).forEach(k => delete D[k]);
    Object.assign(D, d);
    R.dirty = false;
  }
  G.recalc = recalc;
  G.dirty = () => { R.dirty = true; };

  // ---------- Money ----------
  function addGold(n, src) {
    if (!(n > 0)) return;
    const S = G.S;
    S.gold += n; S.goldRun += n; S.goldTotal += n;
    if (G.goldBySrc) G.goldBySrc[src || '?'] = (G.goldBySrc[src || '?'] || 0) + n;
    questProgress('gold', n);
  }
  G.addGold = addGold;
  function addEssence(n, src) {
    if (!(n > 0)) return;
    if (G.essBySrc) G.essBySrc[src || '?'] = (G.essBySrc[src || '?'] || 0) + n;
    G.S.essence += n; G.S.essRun += n;
    emit('essence', n);
  }
  G.addEssence = addEssence;
  function addEggs(n) {
    n = Math.floor(n);
    if (n <= 0) return 0;
    G.S.eggs += n;
    emit('eggs', n);
    return n;
  }
  function rollCount(expected) { // expected value -> integer with random rounding
    const f = Math.floor(expected);
    return f + (chance(expected - f) ? 1 : 0);
  }

  // ---------- Clicking ----------
  function critRoll() { return chance(D.crit); }

  function manualClick(x, y) {
    const S = G.S;
    const now = performance.now();
    const mt = R.manualTimes;
    while (mt.length && now - mt[0] > 1000) mt.shift();
    if (mt.length >= TUNE.maxManualCps) return null;
    mt.push(now);

    S.clicks++; S.clicksRun++;
    R.combo = Math.min(D.comboCap, R.combo + 1);
    R.comboT = TUNE.comboTime;
    if (R.combo > S.st.maxCombo) S.st.maxCombo = R.combo;
    const crit = critRoll();
    const mega = D.mega && S.clicks % 25 === 0;
    let gain = D.click * (1 + R.combo * D.comboPer);
    if (crit) { gain *= D.critMult; S.st.crits++; questProgress('crit', 1); }
    if (mega) { gain *= 30; S.st.megas++; }
    addGold(gain, 'click');
    const dmg = R.boss ? D.heroHit * TUNE.clickVolley : 0;
    if (G.heroVolley && !(R.stun > 0)) G.heroVolley(TUNE.clickVolley, 'click');
    S.chestMeter += D.chestProg;
    spawnFromMeter();
    questProgress('clicks', 1);
    questProgress('combo', R.combo, true);
    const ev = { gain, crit, mega, x, y, combo: R.combo, dmg };
    emit('click', ev);
    return ev;
  }
  G.manualClick = manualClick;

  // Auto clicks are aggregated: expected crit value, no combo.
  function autoClicks(n, dt) {
    if (n <= 0) return;
    const critEV = 1 + D.crit * (D.critMult - 1);
    const gain = D.click * critEV * n;
    addGold(gain, 'auto');
    const petN = n * D.petCps / Math.max(1e-9, D.autoCps + D.petCps);
    if (G.heroVolley && petN > 0) G.heroVolley(TUNE.petVolley * petN, 'pet');
    G.S.chestMeter += D.chestProg * TUNE.autoChestFactor * n;
    emit('autoClicks', n, gain);
  }

  // ---------- Chests ----------
  function rollTier() {
    const L = 1 + D.effLuck;
    const w = G.CHEST_WEIGHTS.map((b, i) => b * Math.pow(L, i * 0.5));
    return weighted(w);
  }
  function rollMod() {
    const ids = Object.keys(D.mods);
    if (!ids.length) return null;
    let p = 0.06 + D.modChance;
    if (!chance(p)) return null;
    return pick(ids);
  }
  function rollRarity(tier, rolls) {
    let best = 0;
    for (let i = 0; i < rolls; i++) {
      let r = tier;
      if (r < 6 && chance(0.12)) r++;
      if (r > best) best = r;
    }
    return best;
  }
  function pickItem(r) {
    const list = G.ITEMS_BY_RARITY[r];
    return list[weighted(list.map(i => i.w))];
  }
  function itemValue(it) {
    return D.incomeRef * G.RARITIES[it.r].secs * it.m * D.itemMult;
  }
  G.itemValue = itemValue;
  function chestValue(tier) { return D.incomeRef * G.RARITIES[tier].secs * D.itemMult; }

  function tryMerge() {
    const S = G.S;
    for (let t = 0; t < 6; t++) {
      const same = S.chests.filter(c => c.tier === t && !c.mod);
      if (same.length >= 3) {
        const parts = same.slice(0, 3);
        S.chests = S.chests.filter(c => !parts.includes(c));
        const nc = makeChest(t + 1, null);
        nc.merged = true;
        S.chests.push(nc);
        S.st.merges++;
        emit('merge', parts, nc);
        return true;
      }
    }
    return false;
  }

  function makeChest(tier, mod) {
    const S = G.S;
    const c = { id: ++S.uid, tier, mod: mod || null, age: 0 };
    if (mod === 'frozen') c.hp = 8;
    if (mod === 'blazing') c.life = TUNE.blazeLife;
    if (mod === 'mimic') { c.hp = TUNE.mimicClicks; c.awake = false; }
    return c;
  }

  function spawnChest(tier, mod, fromBoss) {
    const S = G.S;
    if (tier === undefined || tier === null) tier = rollTier();
    if (mod === undefined) mod = rollMod();
    if (mod === 'chromatic') tier = Math.min(6, tier + 1);
    if (S.chests.length >= D.slots) {
      if (!(D.merge && tryMerge())) {
        // No room: the chest is sold unopened at a discount.
        const v = chestValue(tier) * 0.3;
        addGold(v, 'spill');
        emit('spill', tier, v);
        return null;
      }
    }
    const c = makeChest(tier, mod);
    S.chests.push(c);
    if (mod) S.modsSeen[mod] = 1;
    emit('chestSpawn', c, fromBoss);
    return c;
  }
  G.spawnChest = spawnChest;

  function spawnFromMeter() {
    const S = G.S;
    let guard = 0;
    while (S.chestMeter >= D.chestNeed && guard++ < 40) {
      S.chestMeter -= D.chestNeed;
      spawnChest();
    }
    if (S.chestMeter > D.chestNeed * 40) S.chestMeter = 0;
  }

  // Opens a chest (on the field or virtual). Returns loot summary.
  function openChest(c, source, depthGuard) {
    const S = G.S;
    const idx = S.chests.indexOf(c);
    if (idx >= 0) S.chests.splice(idx, 1);
    let n = 1;
    if (c.mod === 'ghost') n = 2;
    if (c.mod === 'frozen') n = 3;
    if (c.mod === 'mimic') n = 5;
    if (D.double && chance(D.double)) n *= 2;
    const rolls = c.mod === 'chromatic' ? 3 : 1;
    const loot = { items: [], gold: 0, ess: 0, eggs: 0, pots: [], tier: c.tier, mod: c.mod, chest: c, source };
    const valMult = c.mod === 'blazing' ? 5 : 1;
    for (let i = 0; i < n; i++) {
      const it = pickItem(rollRarity(c.tier, rolls));
      const before = S.coll[it.id] || 0;
      S.coll[it.id] = before + 1;
      const v = itemValue(it) * valMult;
      loot.gold += v;
      loot.items.push({ it, v, isNew: before === 0, star: stars(before + 1) > stars(before) });
      if (it.r === 6) { S.st.divine++; }
      if (stars(before + 1) > stars(before)) R.dirty = true;
      if (G.gainGear) G.gainGear(it, c.tier);
      questProgress('rarity', it.r);
    }
    if (c.mod === 'golden') loot.gold += D.incomeRef * 8 * (c.tier + 1);
    addGold(loot.gold, 'chest');
    let e = G.RARITIES[c.tier].ess * D.essMult * (c.mod === 'void' ? 10 : 1);
    if (c.mod === 'void') e = Math.max(e, 1 * D.essMult);
    loot.ess = e; addEssence(e, 'chest' + c.tier);
    if (c.tier >= 4 && chance(0.02 * (c.tier - 3) * D.eggMult)) loot.eggs += addEggs(1);
    if (c.tier >= 4 && chance(0.02 * (c.tier - 3))) { const p = givePotion(); if (p) loot.pots.push(p); }
    S.opened[c.tier]++;
    S.st.chests++;
    if (c.mod) { S.st.modded++; questProgress('mod', 1); }
    questProgress('chests', 1);
    emit('chestOpen', loot);
    if (c.mod === 'lightning' && !depthGuard) {
      const targets = S.chests.filter(o => o.mod !== 'mimic' && o.mod !== 'frozen').slice(0, 3);
      emit('lightning', c, targets);
      targets.forEach(t => openChest(t, 'chain', true));
    }
    return loot;
  }
  G.openChest = openChest;

  // Player tapped a chest on the field.
  function clickChest(c) {
    const S = G.S;
    if (!S.chests.includes(c)) return;
    if (c.mod === 'frozen') {
      c.hp -= critRoll() ? 3 : 1;
      emit('chestHit', c);
      if (c.hp <= 0) openChest(c, 'hand');
      return;
    }
    if (c.mod === 'mimic') {
      if (!c.awake) { c.awake = true; c.life = TUNE.mimicLife; emit('mimicWake', c); return; }
      c.hp -= critRoll() ? 3 : 1;
      emit('chestHit', c);
      if (c.hp <= 0) { S.st.mimics++; if (chance(0.5 * D.eggMult)) addEggs(1); openChest(c, 'hand'); }
      return;
    }
    openChest(c, 'hand');
  }
  G.clickChest = clickChest;

  function golemPick() {
    const S = G.S;
    const list = S.chests.filter(c => c.mod !== 'mimic');
    if (!list.length) return null;
    return list.find(c => c.mod === 'blazing') || list.find(c => c.mod === 'frozen') ||
      list.reduce((a, b) => (b.tier > a.tier ? b : a), list[0]);
  }
  function golemAct() {
    const c = golemPick();
    if (!c) return false;
    emit('golem', c);
    if (c.mod === 'frozen') { c.hp -= 2; emit('chestHit', c); if (c.hp <= 0) openChest(c, 'golem'); }
    else openChest(c, 'golem');
    return true;
  }

  // ---------- Potions ----------
  function givePotion(id) {
    const S = G.S;
    const avail = G.POTIONS.filter(p => S.pots[p.id] < D.potCap);
    if (!avail.length) { addEssence(10 * D.essMult, 'potion'); emit('potionFull'); return null; }
    const p = id ? G.POTIONS.find(x => x.id === id && S.pots[x.id] < D.potCap) || pick(avail) : pick(avail);
    S.pots[p.id]++;
    R.dirty = true;
    emit('potion', p);
    return p;
  }
  G.givePotion = givePotion;

  // ---------- Bosses ----------
  function realmIndex(d) { return Math.min(G.REALMS.length - 1, Math.floor(d / G.REALM_SIZE)); }
  G.realmIndex = realmIndex;
  function isLord(d) { return d % G.REALM_SIZE === G.REALM_SIZE - 1; }
  G.isLord = isLord;
  function bossHp(d) {
    return TUNE.bossBase * Math.pow(TUNE.bossGrowth, d) * (isLord(d) ? TUNE.lordHp : 1);
  }
  G.bossHp = bossHp;
  function bossName(d) {
    const r = G.REALMS[realmIndex(d)];
    return isLord(d) ? r.lordName : r.minionName;
  }
  G.bossName = bossName;

  function startBoss() {
    const S = G.S;
    if (R.boss || !R.bossReady) return false;
    const d = S.depth;
    const lord = isLord(d);
    const hp = G.bossHp(d);
    if (G.heroBossStart) G.heroBossStart();
    R.boss = { d, lord, hp, max: hp, t: D.bossTime + (lord ? 15 : 0), T: D.bossTime + (lord ? 15 : 0),
      realm: realmIndex(d), sprite: lord ? G.REALMS[realmIndex(d)].lord : G.REALMS[realmIndex(d)].minion };
    R.bossReady = false;
    emit('bossStart', R.boss);
    return true;
  }
  G.startBoss = startBoss;

  function hitBoss(dmg) {
    const b = R.boss;
    if (!b || b.dead) return;
    b.hp -= dmg;
    if (b.hp <= 0) bossWin();
  }
  G.hitBoss = hitBoss;

  function bossWin() {
    const S = G.S, b = R.boss;
    b.dead = true;
    const d = b.d;
    const first = S.st.bossKills === 0;
    if (d === 39 && S.rec && !S.rec.madTime) S.rec.madTime = S.st.playTime;
    S.st.bossKills++;
    if (b.lord) S.st.lordKills++;
    const rew = { gold: D.incomeRef * (b.lord ? 40 : 10), ess: (2 + d * 0.3) * (b.lord ? 3 : 1) * D.essMult,
      eggs: 0, pots: [], chests: [], lord: b.lord, d };
    addGold(rew.gold, 'boss');
    addEssence(rew.ess, 'boss');
    let eggEV = (b.lord ? 1 + Math.floor(d / 15) : 0.15) * D.eggMult;
    rew.eggs = addEggs(rollCount(eggEV) + (first ? 1 : 0));
    const pots = b.lord ? 1 : (chance(0.15) ? 1 : 0);
    for (let i = 0; i < pots; i++) { const p = givePotion(); if (p) rew.pots.push(p); }
    const tier = b.lord ? Math.min(6, 1 + Math.floor(d / 8)) : Math.min(5, Math.floor(d / 8));
    const count = b.lord ? 2 : 1;
    if (G.heroBossEnd) G.heroBossEnd(true); // its swarm dies with it, still in this land
    S.depth++;
    if (S.depth > S.maxDepth) S.maxDepth = S.depth;
    if (S.depth > S.bestDepth) S.bestDepth = S.depth;
    S.bossMeter = 0;
    R.boss = null;
    R.dirty = true;
    recalc();
    for (let i = 0; i < count; i++) rew.chests.push(openChest(makeChest(tier, null), 'boss'));
    questProgress('boss', 1);
    emit('bossWin', rew, b);
    if (realmIndex(S.depth) !== realmIndex(d)) emit('realm', realmIndex(S.depth));
  }

  function bossFail() {
    const S = G.S, b = R.boss;
    R.boss = null;
    if (G.heroBossEnd) G.heroBossEnd(false);
    S.bossMeter = Math.floor(D.bossNeed * 0.5);
    emit('bossFail', b);
  }
  G.fleeBoss = () => { if (R.boss) bossFail(); };

  // ---------- Wisps ----------
  function spawnWisp() {
    R.wisp = { t: TUNE.wispLife, life: TUNE.wispLife, seed: G.rng() };
    emit('wisp', R.wisp);
  }
  function catchWisp() {
    const S = G.S;
    if (!R.wisp) return;
    R.wisp = null;
    S.st.wisps++;
    const e = G.WISP_EFFECTS[weighted(G.WISP_EFFECTS.map(x => x.w))];
    let amount = 0;
    if (e.id === 'frenzy' || e.id === 'storm') {
      S.buffs = S.buffs.filter(b => b.id !== e.id);
      S.buffs.push({ id: e.id, t: e.dur * D.buffDur, T: e.dur * D.buffDur });
      R.dirty = true;
    } else if (e.id === 'rain') {
      for (let i = 0; i < 8; i++) spawnChest();
    } else if (e.id === 'lucky') {
      amount = Math.min(S.gold * 0.15 + D.incomeRef * 30, D.incomeRef * 600);
      addGold(amount, 'wisp');
    } else if (e.id === 'egg') {
      addEggs(1);
    }
    questProgress('wisp', 1);
    emit('wispCatch', e, amount);
  }
  G.catchWisp = catchWisp;

  // ---------- Shop ----------
  function upgCost(u, L) { return u.base * Math.pow(u.growth, L); }
  G.upgCost = u => upgCost(u, G.S.upg[u.id] || 0);
  function buyUpgrade(id) {
    const S = G.S, u = G.UPGRADES.find(x => x.id === id);
    const L = S.upg[id] || 0;
    if (u.max && L >= u.max) return false;
    const c = upgCost(u, L);
    if (S.gold < c) return false;
    S.gold -= c; S.upg[id] = L + 1;
    R.dirty = true; recalc();
    emit('buy', 'upg', id);
    return true;
  }
  G.buyUpgrade = buyUpgrade;

  function heroCost(h, n, amount) { return G.geoCost(h.cost, G.HERO_GROWTH, n, amount); }
  G.heroCost = (h, amount) => heroCost(h, G.S.heroes[h.id] || 0, amount);
  G.heroMax = h => G.geoMax(h.cost, G.HERO_GROWTH, G.S.heroes[h.id] || 0, G.S.gold);
  function buyHero(id, amount) {
    const S = G.S, h = G.HEROES.find(x => x.id === id);
    const n = S.heroes[id] || 0;
    if (amount === 'max') amount = G.geoMax(h.cost, G.HERO_GROWTH, n, S.gold);
    if (amount <= 0) return false;
    const c = heroCost(h, n, amount);
    if (S.gold < c) return false;
    S.gold -= c; S.heroes[id] = n + amount;
    R.dirty = true; recalc();
    emit('buy', 'hero', id, amount);
    return true;
  }
  G.buyHero = buyHero;

  function nodeCost(nd, L) { return Math.ceil(nd.cost * Math.pow(nd.growth, L)); }
  G.nodeCost = nd => nodeCost(nd, G.S.nodes[nd.id] || 0);
  function nodeAvailable(nd) {
    if (!nd.req.length) return true;
    return nd.req.some(r => (G.S.nodes[r] || 0) > 0);
  }
  G.nodeAvailable = nodeAvailable;
  function buyNode(id) {
    const S = G.S, nd = G.NODE_BY_ID[id];
    const L = S.nodes[id] || 0;
    if (L >= nd.max || !nodeAvailable(nd)) return false;
    const c = nodeCost(nd, L);
    if (S.essence < c) return false;
    S.essence -= c; S.nodes[id] = L + 1;
    R.dirty = true; recalc();
    emit('buy', 'node', id);
    return true;
  }
  G.buyNode = buyNode;

  function legacyCost(l, L) { return Math.ceil(l.base * Math.pow(l.growth, L)); }
  G.legacyCost = l => legacyCost(l, G.S.legacy[l.id] || 0);
  function buyLegacy(id) {
    const S = G.S, l = G.LEGACY_BY_ID[id];
    const L = S.legacy[id] || 0;
    if (L >= l.max) return false;
    const c = legacyCost(l, L);
    if (S.fame < c) return false;
    S.fame -= c; S.legacy[id] = L + 1;
    R.dirty = true; recalc();
    emit('buy', 'legacy', id);
    return true;
  }
  G.buyLegacy = buyLegacy;

  // ---------- Pets / gacha ----------
  function pullOne() {
    const S = G.S;
    S.pity.l++; S.pity.d++; S.pulls++;
    let tier = weighted(G.PET_TIERS.map(t => t.rate));
    if (S.pity.d >= 120) tier = 3;
    else if (S.pity.l >= 25 && tier < 2) tier = 2;
    if (tier >= 2) S.pity.l = 0;
    if (tier === 3) S.pity.d = 0;
    const pet = pick(G.PETS.filter(p => p.tier === tier));
    const golden = chance(D.goldenChance);
    let st = S.pets[pet.id];
    const isNew = !st;
    const newGold = golden && (!st || !st.gold);
    if (!st) st = S.pets[pet.id] = { lvl: 1, n: 1, gold: golden };
    else { st.n++; st.lvl = Math.min(G.PET_MAX_LEVEL, st.lvl + 1); if (golden) st.gold = true; }
    return { pet, golden, isNew, newGold, lvl: st.lvl };
  }
  function pull(n) {
    const S = G.S;
    const cost = n >= 10 ? 9 : n;
    if (S.eggs < cost) return null;
    S.eggs -= cost;
    const res = [];
    for (let i = 0; i < n; i++) res.push(pullOne());
    // Auto-equip into free slots
    for (const r of res) {
      if (S.active.length < D.petSlots && !S.active.includes(r.pet.id)) S.active.push(r.pet.id);
    }
    R.dirty = true; recalc();
    emit('pull', res);
    return res;
  }
  G.pull = pull;
  function togglePet(id) {
    const S = G.S;
    if (!S.pets[id]) return;
    const i = S.active.indexOf(id);
    if (i >= 0) S.active.splice(i, 1);
    else if (S.active.length < D.petSlots) S.active.push(id);
    else { S.active.shift(); S.active.push(id); }
    R.dirty = true; recalc();
    emit('pets');
  }
  G.togglePet = togglePet;

  // ---------- Quests ----------
  function progLevel() {
    const S = G.S;
    return S.maxDepth + Math.log10(S.goldRun + 10);
  }
  const QUEST_KINDS = ['clicks', 'chests', 'rarity', 'gold', 'boss', 'crit', 'combo', 'mod', 'wisp', 'kills'];
  function makeQuest(exclude) {
    const S = G.S;
    const lv = progLevel();
    let kinds = QUEST_KINDS.filter(k => !exclude.includes(k));
    if (!S.st.bossKills && S.depth === 0) kinds = kinds.filter(k => k !== 'boss');
    if (!Object.keys(D.mods).length) kinds = kinds.filter(k => k !== 'mod');
    if (S.st.wisps < 1) kinds = kinds.filter(k => k !== 'wisp' || S.st.playTime > 240);
    const k = pick(kinds);

    const scale = G.RMUL[g.r] * Math.pow(1.16, g.il) * enchantMul(g);
    if (slot === 'weapon') return 8 * scale;
    if (slot === 'armor') return 60 * scale * ARMOR_MUL[type];
    if (slot === 'ring') return 0.04 * G.RMUL[g.r] * enchantMul(g) * (1 + g.il * 0.02);
    return 0.02 * G.RMUL[g.r] * enchantMul(g) * (1 + g.il * 0.02);
  }
  G.mainStat = mainStat;

  // Full combat numbers for a given set of equipped items
  function combat(eq, d, who) {
    const h = who || G.S.hero;
    const cls = G.CLASS_BY_ID[h.cls] || G.CLASSES[0];
    const aff = {};
    for (const slot of G.SLOTS) {
      const g = eq[slot];
      if (g) for (const [k, v] of g.a) aff[k] = (aff[k] || 0) + v;
    }
    const w = eq.weapon;
    const wtype = w ? G.ITEM_TYPE[w.id] : 'dagger';
    const wt = G.WEAPONS[wtype];
    const lvlM = 1 + 0.05 * (h.lvl - 1);
    const own = cls.weapons.includes(wtype) ? 1.5 : 1;
    const pct = 1 + (aff.dmg || 0) + (eq.ring ? mainStat(eq.ring) : 0) + (eq.ability ? mainStat(eq.ability) : 0);
    const base = (w ? mainStat(w) : 4) * own * lvlM * pct * (d.heroMult || 1);
    const hit = base * wt.mult;
    const rate = wt.rate * (1 + (aff.spd || 0) + (cls.spd || 0)) * (d.spdMult || 1);
    const crit = Math.min(0.9, (d.crit || 0.03) + (aff.crit || 0) + cls.crit);
    const critMult = (d.critMult || 3) + (aff.critd || 0);
    const targets = wt.targets + cls.extra;
    const hp = (eq.armor ? mainStat(eq.armor) : TUNE.baseHp) * lvlM * cls.hp * (1 + (aff.hp || 0)) * (d.hpMult || 1);
    const dps = hit * rate * (1 + crit * (critMult - 1));
    const power = Math.floor(dps * (1 + 0.15 * (targets - 1)) * Math.sqrt(hp / TUNE.baseHp) * 10);
    return { aff, wtype, wt, hit, rate, crit, critMult, targets, hp, dps, power, own: own > 1 };
  }
  G.heroCombat = combat;

  function powerWith(slot, g) {
    const eq = Object.assign({}, G.S.hero.eq);
    eq[slot] = g;
    return combat(eq, G.D).power;
  }
  G.powerWith = powerWith;

  function gainGear(it, srcTier) {
    const S = G.S, h = S.hero;
    if (!h) return null;
    const g = makeGear(it.id, S.depth + (chance(0.35) ? 1 : 0));
    h.fresh++;
    const slot = G.slotOf(g.id);
    let equipped = false;
    if (h.auto && h.cls) {
      const cur = h.eq[slot];
      if (!cur || powerWith(slot, g) > powerWith(slot, cur)) { equip(g, true); equipped = true; }
    }
    if (!equipped) {
      if (h.salv && g.r < h.salv) { salvage(g, true); return g; }
      h.bag.push(g);
    }
    while (h.bag.length > TUNE.bagMax) {
      {
        // Drop the weakest item in the bag into shards
        let worst = null, ws = Infinity;
        for (const b of h.bag) { const s = powerWith(G.slotOf(b.id), b); if (s < ws) { ws = s; worst = b; } }
        salvage(worst, true);
      }
    }
    emit('gear', g, equipped);
    return g;
  }
  G.gainGear = gainGear;

  function equip(g, silent) {
    const h = G.S.hero, slot = G.slotOf(g.id);
    const old = h.eq[slot];
    const i = h.bag.indexOf(g);
    if (i >= 0) h.bag.splice(i, 1);
    h.eq[slot] = g;
    if (old) h.bag.push(old);
    G.dirty(); G.recalc();
    if (!silent) emit('equip', g);
    return true;
  }
  G.equip = equip;
  function unequip(slot) {
    const h = G.S.hero, g = h.eq[slot];
    if (!g) return false;
    h.eq[slot] = null; h.bag.push(g);
    G.dirty(); G.recalc(); emit('equip', null);
    return true;
  }
  G.unequip = unequip;

  function salvageValue(g) { return Math.ceil(SALVAGE[g.r] * (1 + g.il * 0.05) * (1 + 0.5 * g.e) * (G.D.shardMult || 1)); }
  G.salvageValue = salvageValue;
  function salvage(g, silent) {
    const h = G.S.hero;
    const i = h.bag.indexOf(g);
    if (i >= 0) h.bag.splice(i, 1);
    for (const s of G.SLOTS) if (h.eq[s] === g) return 0; // never scrap what you wear
    const v = salvageValue(g);
    h.shards += v;
    if (!silent) emit('salvage', g, v);
    return v;
  }
  G.salvage = salvage;
  G.salvageBelow = function (r) {
    const h = G.S.hero;
    let n = 0, v = 0;
    for (const g of h.bag.slice()) if (g.r < r) { v += salvage(g, true); n++; }
    emit('salvage', null, v);
    return { n, v };
  };

  function enchantCost(g) {
    return { shards: Math.ceil(4 * Math.pow(1.5, g.e) * G.RMUL[g.r]), gold: Math.max(50, G.D.incomeRef * 6 * Math.pow(1.3, g.e)) };
  }
  G.enchantCost = enchantCost;
  function enchant(g) {
    const S = G.S, h = S.hero;
    if (g.e >= G.ENCHANT_MAX) return false;
    const c = enchantCost(g);
    if (h.shards < c.shards || S.gold < c.gold) return false;
    h.shards -= c.shards; S.gold -= c.gold; g.e++;
    G.dirty(); G.recalc();
    emit('enchant', g);
    return true;
  }
  G.enchant = enchant;

  function chooseClass(id) {
    const S = G.S, h = S.hero, cls = G.CLASS_BY_ID[id];
    if (!cls) return false;
    h.cls = id;
    const hasWeapon = [h.eq.weapon].concat(h.bag).some(g => g && G.slotOf(g.id) === 'weapon' && cls.weapons.includes(G.ITEM_TYPE[g.id]));
    if (!hasWeapon) { const g = makeGear(cls.starter, 0); h.bag.push(g); }
    // Wear the best weapon for the new class
    let best = h.eq.weapon, bp = best ? powerWith('weapon', best) : -1;
    for (const g of h.bag) if (G.slotOf(g.id) === 'weapon') { const p = powerWith('weapon', g); if (p > bp) { bp = p; best = g; } }
    if (best && best !== h.eq.weapon) equip(best, true);
    G.dirty(); G.recalc();
    h.hp = G.D.heroHp;
    emit('classChosen', cls);
    return true;
  }
  G.chooseClass = chooseClass;

  // ---------- Hooks called from recalc ----------
  // Economy side of gear affixes, applied before gold multipliers are summed
  G.heroEcon = function (d) {
    const h = G.S.hero;
    if (!h) return;
    const aff = {};
    for (const slot of G.SLOTS) { const g = h.eq[slot]; if (g) for (const [k, v] of g.a) aff[k] = (aff[k] || 0) + v; }
    d.goldMult *= 1 + (aff.gold || 0);
    d.luck += aff.luck || 0;
    d.xpMult = 1 + (aff.xp || 0);
    d.shardMult = 1 + (aff.shard || 0);
  };
  G.heroFinish = function (d) {
    const S = G.S, h = S.hero;
    if (!h) return;
    d.heroMult = (d.heroMult || 1) * (1 + 0.005 * S.fameTotal) * (1 + 0.02 * (d.heroClasses || 0));
    const c = combat(h.eq, d);
    const buffDmg = (R.hb.tome > 0 ? 1.5 : 1) * (R.hb.orb > 0 ? 1.3 : 1);
    d.hero = c;
    const might = 1 + 0.12 * perk('might'), frenzy = 1 + 0.12 * perk('frenzy');
    d.heroHit = c.hit * buffDmg * might;
    d.heroRate = c.rate * (R.hb.wing > 0 ? 2 : 1) * frenzy;
    d.heroHp = c.hp * (1 + 0.2 * perk('bulwark'));
    d.heroDps = c.dps * buffDmg * might * frenzy;
    d.power = c.power;
    if (h.hp > d.heroHp) h.hp = d.heroHp;
    if (c.power > S.rec.maxPower) S.rec.maxPower = c.power;
  };

  // ---------- The Horde ----------
  // Mobs walk from the edge of the arena (p = 0) to the Button (p = 1). Each
  // kind has a weight: its share of a standard mob's HP, bite, rewards and
  // clearing progress. A swarm of fodder is worth the same as a few brutes,
  // it just dies in a much bigger heap.
  function mobHp(d) { return TUNE.mobBase * Math.pow(TUNE.mobGrowth, d); }
  function mobAtk(d) { return TUNE.mobAtkBase * Math.pow(TUNE.mobAtkGrowth, d); }
  G.mobHp = mobHp; G.mobAtk = mobAtk;
  // Bosses are worth a few dozen mobs at first and grow into real walls by
  // the second land: from then on a boss needs a Warden strong for this depth.
  G.bossHp = d => mobHp(d) * Math.min(TUNE.bossHpMobs, 40 + 30 * d) * (G.isLord(d) ? TUNE.lordHp : 1);
  function xpNeed(l) { return Math.floor(10 * Math.pow(1.2, l - 1) + 6 * l); }
  G.xpNeed = xpNeed;

  G.MOB_KINDS = {
    fodder: { w: 0.03, spd: 1.3, gold: 1 },
    brute:  { w: 1, spd: 1, gold: 1 },
    magic:  { w: 2, spd: 1.05, gold: 1.25 }, // blue champions, they come in pairs
    rare:   { w: 6, spd: 0.9, gold: 1.5 },   // yellow, named, one modifier, a pack of minions
  };
  G.RARE_MODS = {
    hasted:   { name: 'Hasted' },    // walks 70% faster
    stone:    { name: 'Stoneskin' }, // takes half damage
    splitter: { name: 'Splitting' }, // bursts into fodder when it dies
    frenzied: { name: 'Frenzied' },  // bites twice as hard
  };
  const RARE_A = ['Gloom', 'Rot', 'Blight', 'Grim', 'Dread', 'Hollow', 'Ash', 'Bile', 'Doom', 'Rust', 'Wretch', 'Vile'];
  const RARE_B = ['Maw', 'Fang', 'Gnaw', 'Howl', 'Spawn', 'Husk', 'Claw', 'Rend', 'Brood', 'Shriek', 'Grin', 'Hunger'];

  const hordeCap = d => TUNE.hordeCap + Math.min(10, d / 4);
  const clamp01 = v => Math.max(0, Math.min(1, v));
  function aliveWeight(adds) { let w = 0; for (const m of R.mobs) if (!!m.add === adds) w += m.w; return w; }

  // Arena position, the same angle mapping the stage draws with (the top,
  // under the HUD, stays clear). The spawn ring is radius 1.
  function mobXY(m) {
    const th = -Math.PI / 2 + 0.55 + m.a * (Math.PI * 2 - 1.1);
    const r = 1 - 0.88 * m.p;
    return [Math.cos(th) * r, Math.sin(th) * r];
  }
  G.mobXY = mobXY;

  // How hard the Warden hits this depth: standard mobs they could kill per second
  const mightRatio = () => (G.D.heroDps || 0) / mobHp(G.S.depth);
  G.mightRatio = mightRatio;
  // The Horde answers strength: a Warden who kills faster faces a bigger, heavier
  // flow, so a stronger Warden clears lands (and earns gold and XP) faster
  const hordeScale = () => G.clamp(mightRatio() / TUNE.hordeRef, 0.4, TUNE.hordeMax);
  G.hordeScale = hordeScale;
  function makeMob(kind, a, p, add) {
    const K = G.MOB_KINDS[kind];
    const w = K.w * (add ? 1 : Math.max(1, (R.hs || 1) / 1.5));
    const hp = mobHp(G.S.depth) * w;
    const m = { id: ++R.mobUid, kind, w, hp, max: hp, p, a: clamp01(a), sp: K.spd / (TUNE.mobWalk * rand(0.85, 1.15)), atkT: 0, add: !!add };
    if (kind === 'rare') {
      m.mod = pick(Object.keys(G.RARE_MODS));
      m.name = pick(RARE_A) + ' ' + pick(RARE_B);
      if (m.mod === 'hasted') m.sp *= 1.7;
    }
    R.mobs.push(m);
    emit('mobSpawn', m);
    return m;
  }
  // One pack, all from one direction
  function spawnPack(add) {
    const d = G.S.depth, a = G.rng(), roll = G.rng();
    const fodder = (n, spread) => { for (let i = 0; i < n; i++) makeMob('fodder', a + rand(-spread, spread), -rand(0, 0.1), add); };
    if (add) { fodder(randInt(10, 16), 0.07); return; }
    if (d >= 1 && roll < 0.03) { makeMob('rare', a, 0); fodder(16, 0.07); emit('rareSpawn'); }
    else if (roll < 0.1) { makeMob('magic', a, 0); makeMob('magic', a + 0.03, -0.04); fodder(10, 0.06); }
    else if (roll < 0.35) { makeMob('brute', a, 0); fodder(8, 0.06); }
    else fodder(randInt(14, 26), 0.08);
  }

  // Frontmost mobs first (they're about to bite), the tapped one before all.
  // reach limits how far from the Button the hero can strike.
  function targets(n, reach) {
    const minP = reach ? (1 - reach) / 0.88 : -1;
    const list = R.mobs.filter(m => m.p >= minP).sort((a, b) => b.p - a.p);
    const fi = R.focus ? list.findIndex(m => m.id === R.focus) : -1;
    if (fi > 0) list.unshift(list.splice(fi, 1)[0]);
    else if (fi < 0) R.focus = null;
    return list.slice(0, n);
  }
  // Everything within r of any of the targets, except the targets themselves
  function around(ts, r) {
    if (!(r > 0) || !ts.length) return [];
    const cs = ts.map(mobXY), out = [], r2 = r * r;
    for (const m of R.mobs) {
      if (ts.includes(m)) continue;
      const [x, y] = mobXY(m);
      for (const c of cs) { const dx = x - c[0], dy = y - c[1]; if (dx * dx + dy * dy <= r2) { out.push(m); break; } }
    }
    return out;
  }
  // The Hand guards the Button: it strikes where the horde is thickest among
  // the mobs that got close
  function smiteTarget() {
    const front = targets(6, TUNE.smiteReach);
    if (R.focus && front[0] && front[0].id === R.focus) return front[0];
    let best = front[0], bn = -1;
    for (const m of front) { const n = around([m], TUNE.smiteR).length; if (n > bn) { bn = n; best = m; } }
    return best;
  }

  function dealHit(m, dmg, src, crit) {
    if (m.dead) return;
    m.hp -= m.mod === 'stone' ? dmg * 0.5 : dmg;
    if (m.hp <= 0) { m.over = -m.hp / m.max; m.crit = crit; killMob(m, src); }
  }
  function killMob(m, src) {
    const S = G.S, D = G.D, h = S.hero;
    m.dead = true;
    const i = R.mobs.indexOf(m);
    if (i >= 0) R.mobs.splice(i, 1);
    const K = G.MOB_KINDS[m.kind];
    const gold = D.incomeRef * TUNE.mobGold * m.w * K.gold * (m.add ? 0.4 : 1) * (1 + 0.2 * perk('greed'));
    G.addGold(gold, 'mob');
    gainXp(2.5 * (1 + S.depth) * m.w * (m.kind === 'rare' ? 1.5 : 1) * (D.xpMult || 1));
    h.kills++;
    if (m.kind === 'magic' || m.kind === 'rare') h.elites++;
    let chest = null;
    if (!m.add) {
      S.bossMeter += m.w;
      const greed = (R.hb.scroll > 0 ? 3 : 1) * (1 + 0.25 * perk('loot'));
      const p = m.kind === 'rare' ? 1 : m.kind === 'magic' ? 0.4 * greed : TUNE.mobChest * m.w * greed;
      if (chance(p)) chest = dropBag(m);
      if (m.kind === 'rare' && chance(0.5)) dropBag(m);
    }
    if (perk('leech')) h.hp = Math.min(D.heroHp, h.hp + D.heroHp * 0.003 * perk('leech') * (m.kind === 'fodder' ? 1 : 4));
    G.questProgress('kills', 1);
    emit('mobDie', m, gold, chest, src);
    if (m.mod === 'splitter') for (let k = 0; k < 6; k++) makeMob('fodder', m.a + rand(-0.03, 0.03), m.p - rand(0, 0.06), m.add);
  }
  // Mobs drop loot bags where they fall (the stage reads R.dropAt to know where)
  function dropBag(m) {
    R.dropAt = m;
    const c = G.spawnChest();
    R.dropAt = null;
    if (c) c.bag = 1;
    return c;
  }
  function gainXp(x) {
    const S = G.S, h = S.hero;
    const before = h.lvl;
    h.xp += x;
    let up = false;
    while (h.xp >= xpNeed(h.lvl)) { h.xp -= xpNeed(h.lvl); h.lvl++; up = true; }
    if (up) {
      if (h.lvl > S.rec.maxLevel) S.rec.maxLevel = h.lvl;
      h.perkPts = (h.perkPts || 0) + (h.lvl - before);
      if (!h.offer) offerPerks();
      G.dirty(); G.recalc();
      h.hp = G.D.heroHp;
      emit('levelUp', h.lvl);
    }
  }
  G.gainXp = gainXp;

  function offerPerks() {
    const h = G.S.hero;
    const open = Object.keys(G.PERKS).filter(k => perk(k) < G.PERKS[k].max);
    if (!open.length || !(h.perkPts > 0)) { h.offer = null; h.perkPts = 0; return; }
    const pickN = [];
    while (pickN.length < Math.min(3, open.length)) { const k = pick(open); if (!pickN.includes(k)) pickN.push(k); }
    h.offer = pickN; h.offerT = 0;
    emit('perkOffer', pickN);
  }
  G.pickPerk = function (id) {
    const h = G.S.hero;
    if (!h.offer || !h.offer.includes(id)) return false;
    h.perks = h.perks || {};
    h.perks[id] = (h.perks[id] || 0) + 1;
    h.perkPts = Math.max(0, (h.perkPts || 1) - 1);
    h.offer = null;
    G.dirty(); G.recalc();
    emit('perk', id, h.perks[id]);
    if (h.perkPts > 0) offerPerks();
    return true;
  };

  // One attack of the hero's weapon. k scales it: clicks (the Hand's smite)
  // and pets fire partial volleys. Against a boss the hit lands on the boss
  // and the same swing cuts through its adds.
  function attack(k, src) {
    const D = G.D;
    if (!G.S.hero.cls) return;
    const wt = D.hero.wt;
    let ts, aoe = wt.aoe, sp = wt.sp;
    if (src === 'click') { const t = R.mobs.length ? smiteTarget() : null; ts = t ? [t] : []; aoe = TUNE.smiteR; sp = 0.5; }
    else if (src === 'pet') { ts = targets(1, 0.7); aoe = 0.05; sp = 1; }
    else { ts = targets(D.hero.targets + perk('multi'), Math.min(1, wt.reach * (1 + 0.2 * perk('reach')))); aoe = wt.aoe * (1 + 0.3 * perk('cleave')); }
    // nothing in reach: the hero holds the swing for when something walks in
    if (!R.boss && !ts.length) return false;
    const crit = chance(D.hero.crit);
    const dmg = D.heroHit * k * (crit ? D.hero.critMult : 1);
    if (R.boss) {
      G.hitBoss(dmg * D.bossMult);
      emit('heroAttack', { boss: true, crit, src, dmg });
    }
    if (!ts.length) return true;
    const splash = around(ts, aoe);
    emit('heroAttack', { ids: ts.map(m => m.id), splash: splash.map(m => m.id), aoe, crit, src, dmg });
    if (src === 'click') for (const m of ts.concat(splash)) m.p = Math.max(-0.05, m.p - 0.05 / Math.sqrt(m.w));
    for (const m of ts) dealHit(m, dmg, src, crit);
    for (const m of splash) dealHit(m, dmg * sp, src, crit);
    // Chain Lightning arcs from the first target to three more
    if (src === 'auto' && perk('chain') && chance(0.15 * perk('chain'))) {
      const from = ts[0], near = around([from], 0.4).filter(m => !m.dead).slice(0, 3);
      if (near.length) { emit('chain', from, near); for (const m of near) dealHit(m, dmg * 0.6, 'chain', false); }
    }
    // Heavy Hand: more bolts per click, each on a different pack
    if (src === 'click' && perk('thunder') && !attack.inThunder) {
      attack.inThunder = true;
      for (let i = 0; i < perk('thunder'); i++) {
        const hitSet = new Set(ts.concat(splash));
        const cand = targets(8, TUNE.smiteReach).filter(m => !hitSet.has(m) && !m.dead);
        if (!cand.length) break;
        const t = cand[Math.floor(G.rng() * cand.length)], sp2 = around([t], TUNE.smiteR);
        emit('heroAttack', { ids: [t.id], splash: sp2.map(m => m.id), aoe: TUNE.smiteR, crit, src, dmg, extra: true });
        dealHit(t, dmg, src, crit); for (const m of sp2) dealHit(m, dmg * 0.5, src, crit);
      }
      attack.inThunder = false;
    }
    return true;
  }
  G.heroVolley = attack;

  function hurtButton(dmg) {
    const h = G.S.hero;
    if (R.stun > 0) return;
    h.hp -= dmg;
    emit('buttonHurt', dmg);
    if (h.hp <= 0) breakButton();
  }
  function breakButton() {
    const S = G.S, h = S.hero;
    R.stun = 4;
    h.hp = G.D.heroHp;
    for (const m of R.mobs) emit('mobFlee', m);
    R.mobs.length = 0;
    S.bossMeter = Math.floor(S.bossMeter * 0.5);
    if (R.boss) G.fleeBoss();
    emit('buttonBreak');
  }

  function castAbility() {
    const S = G.S, D = G.D, h = S.hero;
    const g = h.eq.ability;
    if (!g || R.abilCd > 0 || !h.cls) return false;
    const type = G.ITEM_TYPE[g.id], ab = G.ABILITIES[type];
    R.abilCd = ab.cd * (1 - Math.min(0.5, 0.03 * g.e));
    const hit = D.heroHit;
    switch (type) {
      case 'potion': h.hp = Math.min(D.heroHp, h.hp + D.heroHp * 0.6); break;
      case 'tome': h.hp = Math.min(D.heroHp, h.hp + D.heroHp * 0.3); R.hb.tome = 6; break;
      case 'scroll': R.hb.scroll = 12; break;
      case 'orb': R.hb.orb = 6; break;
      case 'wing': R.hb.wing = 8; break;
      case 'skull':
        if (R.boss) G.hitBoss(hit * 8 * D.bossMult);
        for (const m of R.mobs.slice()) dealHit(m, hit * 8, 'ability');
        break;
      case 'egg':
        if (R.boss) G.hitBoss(hit * 15 * D.bossMult);
        else { const t = targets(1)[0]; if (t) dealHit(t, hit * 11, 'ability'); }
        for (const m of R.mobs.slice()) dealHit(m, hit * 4, 'ability');
        break;
    }
    G.dirty(); G.recalc();
