:root {
  --bg: #0e0c15;
  --panel: #1d1b26;
  --panel2: #262331;
  --slot: #332f40;
  --slot-hi: #403b50;
  --line: #474258;
  --line-hi: #6d6784;
  --ink: #0a0910;
  --text: #f1ece0;
  --dim: #a9a2b9;
  --faint: #6f6883;
  --gold: #ffd84a;
  --gold-dk: #c98f10;
  --ess: #b76eff;
  --fame: #ffa033;
  --egg: #f4ecd8;
  --hp: #e84a4a;
  --mp: #4c86ff;
  --xp: #56d45a;
  --good: #56d45a;
  --bad: #ff5a5a;
  --r0: #c7b299; --r1: #63d85b; --r2: #4fa8ff; --r3: #b36bff; --r4: #ffa033; --r5: #ff4f7e; --r6: #ffffff;
  --font-display: "Press Start 2P", "BTTN Body", ui-monospace, monospace;
  --font-body: "BTTN Body", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.35 var(--font-body);
  -webkit-font-smoothing: none; font-smooth: never;
  overflow: hidden; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
img, canvas { image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

#app { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: 100%; }

/* ---------- Stage ---------- */
#stageWrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--ink); }
#stage { display: block; position: absolute; inset: 0; touch-action: none; }
.hud { position: absolute; left: 0; right: 0; pointer-events: none; display: flex; gap: 8px; padding: 10px 12px; align-items: flex-start; }
.hud.top { top: 10px; justify-content: space-between; }
.hud.bottom { bottom: 0; flex-direction: column; align-items: stretch; gap: 6px; }
.hud .pill { pointer-events: auto; }
.realm { font: 8px/1.6 var(--font-display); letter-spacing: 0.04em; text-shadow: 2px 2px 0 var(--ink); }
.realm b { color: var(--gold); font-weight: normal; }
.realm small { display: block; font: 15px/1.2 var(--font-body); color: var(--dim); letter-spacing: 0; }
#omenLine { color: #c8b4ff; max-width: 300px; }
/* the land strip: name, stars, five zones (the last the lord's) */
#realmBox { display: inline-block; pointer-events: auto; cursor: pointer; padding: 2px 6px 4px 2px; margin: -2px 0 0 -2px; border-radius: 2px; }
#realmBox:hover { background: rgba(12,11,18,.35); }
.lstars { display: inline-flex; gap: 1px; font: 11px/1 var(--font-body); vertical-align: 1px; }
.lstars i { font-style: normal; color: #3a3850; text-shadow: 1px 1px 0 var(--ink); }
.lstars i.on { color: #ffd84a; text-shadow: 0 0 4px #ffd84a88, 1px 1px 0 var(--ink); }
.zoneRow { display: flex; align-items: center; gap: 6px; font: 15px/1.2 var(--font-body); letter-spacing: 0; color: #fff; margin-top: 1px; }
.pips { display: inline-flex; gap: 3px; align-items: center; }
.pips i { width: 8px; height: 8px; background: #2a2838; border: 1px solid var(--ink); box-shadow: 1px 1px 0 var(--ink); }
.pips i.done { background: #ffd84a; }
.pips i.cur { background: #fff; animation: pipPulse 1s ease-in-out infinite; }
.pips i.lord { width: 10px; height: 10px; background: #5a1a2a; }
.pips i.lord.done { background: #ff4f7e; }
.pips i.lord.cur { background: #ff4f7e; }
@keyframes pipPulse { 50% { box-shadow: 0 0 6px #fff, 1px 1px 0 var(--ink); } }
/* the clearing bar is fought in three waves */
#bossWrap.waves::before, #bossWrap.waves::after { content: ''; position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(12,11,18,.8); z-index: 1; }
#bossWrap.waves::before { left: 33.3%; }
#bossWrap.waves::after { left: 66.6%; }
/* world map */
.wmList { display: grid; gap: 6px; }
.wmHead { margin: 6px 0 0; font: 10px/1.4 var(--font-display); color: #ff9ab4; text-align: center; }
.wmRow { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; background: #1c1a28; border: 2px solid var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.wmRow img { width: 30px; image-rendering: pixelated; }
.wmRow b { display: block; font: 9px/1.5 var(--font-display); color: var(--gold); font-weight: normal; }
.wmRow b em { font-style: normal; color: #fff; font-size: 8px; background: #3f7fff; padding: 0 4px; margin-left: 4px; }
.wmRow small { display: block; font: 14px/1.2 var(--font-body); color: var(--dim); }
.wmRow.here { box-shadow: inset 0 0 0 2px #ffd84a; }
.wmRow.clear { background: #1e2a22; }
.wmRow.locked { opacity: .55; }
.wmRow .lstars { font-size: 16px; }
.wmZones { display: flex; gap: 3px; margin: 3px 0; }
.wmZones span { width: 14px; height: 6px; background: #2a2838; border: 1px solid var(--ink); }
.wmZones span.done { background: #ffd84a; }
.wmZones span.cur { background: #fff; }
.wmZones span.lord { background: #5a1a2a; }
.wmZones span.lord.done { background: #ff4f7e; }
.wmTotal { text-align: center; font: 12px/1.4 var(--font-display) !important; color: #ffd84a !important; }
.goalBox { margin-top: 6px; max-width: 300px; padding: 4px 8px 6px; background: rgba(12,11,18,.72); border: 2px solid var(--ink); box-shadow: inset 0 0 0 1px #ffd84a55; font: 15px/1.2 var(--font-body); letter-spacing: 0; color: var(--text); }
.goalBox b { font: 8px/1 var(--font-display); color: #ffd84a; margin-right: 4px; }
.goalBox em { font-style: normal; color: #a8dcff; float: right; margin-left: 8px; }
.goalBox i { display: block; height: 3px; margin-top: 4px; background: #2a2838; }
.goalBox u { display: block; height: 100%; width: 0; background: #ffd84a; transition: width .3s; }
.hudBtns { display: flex; gap: 6px; pointer-events: auto; }
.iconBtn {
  width: 34px; height: 34px; padding: 0; display: grid; place-items: center; cursor: pointer;
  background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line), 0 2px 0 var(--ink);
}
.iconBtn img { width: 20px; height: 20px; }
.iconBtn.off { opacity: 0.45; }
.iconBtn:focus-visible, .btn:focus-visible, .tab:focus-visible, .row:focus-visible, .slot:focus-visible, .node:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.meter { position: relative; height: 16px; background: var(--ink); border: 2px solid var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--xp); box-shadow: inset 0 3px 0 rgba(255,255,255,.25), inset 0 -3px 0 rgba(0,0,0,.25); transition: width .12s linear; }
.meter.combo > i { background: var(--mp); }
.meter.combo.hot > i { background: #ff7ae6; }
.meter.boss > i { background: var(--fame); }
.meter.hp > i { background: var(--hp); }
.meter > span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 8px/1 var(--font-display); text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink); white-space: nowrap; }
.bossRow { display: flex; gap: 8px; align-items: center; }
.bossRow .meter { flex: 1; }
.buffs { display: flex; gap: 6px; flex-wrap: wrap; }
.buff { font: 8px/1 var(--font-display); padding: 5px 7px; background: rgba(10,9,16,.8); border: 2px solid var(--gold); color: var(--gold); }
.buff.storm { border-color: #7fe9ff; color: #7fe9ff; }

#toasts { position: absolute; top: 54px; right: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; z-index: 5; width: min(70%, 320px); }
.toast { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--panel); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line-hi), 0 3px 0 var(--ink); font-size: 15px; line-height: 1.2; animation: toastIn .18s ease-out; max-width: 100%; }
.toast img { width: 24px; height: 24px; flex: none; }
.toast b { color: var(--gold); font-weight: 600; }
.toast.ach { box-shadow: inset 0 0 0 2px var(--gold), 0 3px 0 var(--ink); }
.toast.out { animation: toastOut .25s ease-in forwards; }
@keyframes toastIn { from { transform: translateY(-8px); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(-8px); opacity: 0; } }

/* Big loot banner */
#banner { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 6; }
#banner .inner { text-align: center; animation: bannerIn .5s cubic-bezier(.2,1.6,.4,1); }
#banner h2 { margin: 0 0 10px; font: 16px/1.4 var(--font-display); letter-spacing: 0.08em; text-shadow: 3px 3px 0 var(--ink); }
#banner .ico { width: 96px; height: 96px; filter: drop-shadow(0 0 18px currentColor); animation: spin 2.4s linear infinite; }
#banner p { margin: 8px 0 0; font: 20px/1.2 var(--font-body); text-shadow: 2px 2px 0 var(--ink); }
#banner.out .inner { animation: toastOut .4s ease-in forwards; }
@keyframes bannerIn { from { transform: scale(.3); opacity: 0; } }
@keyframes spin { 0%,100% { transform: rotate(-8deg) scale(1); } 50% { transform: rotate(8deg) scale(1.08); } }

/* ---------- Panel ---------- */
#panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 3px solid var(--ink); box-shadow: inset 2px 0 0 var(--line); }
.res { padding: 12px 14px 10px; background: var(--panel2); border-bottom: 3px solid var(--ink); box-shadow: inset 0 -2px 0 var(--line); display: grid; gap: 8px; }
.goldLine { display: flex; align-items: center; gap: 10px; }
.goldLine img { width: 32px; height: 32px; }
.goldNum { font: 24px/1 var(--font-display); color: var(--gold); text-shadow: 3px 3px 0 var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rates { display: flex; gap: 12px; flex-wrap: wrap; color: var(--dim); font-size: 15px; }
.rates b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.subRes { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px 3px 4px; background: var(--slot); border: 2px solid var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
.chip img { width: 18px; height: 18px; }
.chip.ess b { color: var(--ess); } .chip.egg b { color: var(--egg); } .chip.fame b { color: var(--fame); }
.chip b { font-weight: 600; }

/* every tab fits in one row, whatever the width: they share it equally */
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; padding: 8px 10px; overflow: hidden; border-bottom: 3px solid var(--ink); background: var(--panel); flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; width: 100%; max-width: 44px; justify-self: center; height: 38px; padding: 0; display: grid; place-items: center; cursor: pointer;
  background: var(--slot); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
.tab img { width: 24px; height: 24px; }
.tab.on { background: var(--slot-hi); box-shadow: inset 0 0 0 2px var(--gold); }
.tab.locked { opacity: 0.3; cursor: default; }
.tab.afford::after { content: ''; position: absolute; left: 3px; bottom: 3px; width: 6px; height: 6px; background: var(--gold); box-shadow: 1px 1px 0 var(--ink); }
.tab .dot { position: absolute; top: -4px; right: -4px; width: 10px; height: 10px; background: var(--bad); border: 2px solid var(--ink); }
.tabTitle { padding: 10px 14px 0; font: 8px/1.6 var(--font-display); color: var(--gold); letter-spacing: 0.04em; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tabTitle small { font: 15px/1.2 var(--font-body); color: var(--dim); letter-spacing: 0; }
.tabBody { flex: 1; overflow-y: auto; padding: 8px 10px 16px; min-height: 0; overscroll-behavior: contain; }
.tabBody::-webkit-scrollbar { width: 10px; } .tabBody::-webkit-scrollbar-thumb { background: var(--line); border: 2px solid var(--panel); }
.note { color: var(--dim); font-size: 15px; margin: 4px 4px 10px; max-width: 60ch; }
.sect { margin: 14px 4px 8px; font: 8px/1.6 var(--font-display); color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; }

.list { display: grid; gap: 6px; }
.row {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left;
  padding: 7px 9px; cursor: pointer; background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line);
}
.row:hover { background: var(--slot); }
.row:active { transform: translateY(1px); }
.row.cant { cursor: default; }
.row.cant .cost { color: var(--bad); }
.row.maxed { opacity: .7; cursor: default; }
.row.maxed .cost { color: var(--good); }
.row.can { box-shadow: inset 0 0 0 2px var(--line-hi); }
.row.can .cost { color: var(--gold); }
.row .ico { width: 44px; height: 44px; display: grid; place-items: center; background: var(--slot); border: 2px solid var(--ink); }
.row .ico img { width: 40px; height: 40px; }
.row .info { min-width: 0; }
.row .name { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 15px; color: #fff; }
.row .lv { font: 8px/1 var(--font-display); color: var(--dim); }
.row .desc { color: var(--dim); font-size: 15px; line-height: 1.25; }
.row .cost { display: flex; align-items: center; gap: 5px; font: 8px/1 var(--font-display); white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .cost img { width: 16px; height: 16px; }
.row .bar { height: 4px; margin-top: 5px; background: var(--ink); }
.row .bar i { display: block; height: 100%; width: 0; background: var(--gold); }
.row.shake { animation: shake .25s; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.row .count { font: 8px/1 var(--font-display); color: var(--text); }
.row.locked { opacity: .55; cursor: default; }
.row.locked .ico img { filter: brightness(0) opacity(.55); }

.seg { display: inline-flex; border: 2px solid var(--ink); }
.seg button { padding: 5px 8px; background: var(--slot); border: 0; border-right: 2px solid var(--ink); cursor: pointer; font: 8px/1 var(--font-display); color: var(--dim); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--slot-hi); color: var(--gold); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; cursor: pointer;
  background: #3a3550; border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line-hi), 0 3px 0 var(--ink); font: 8px/1.2 var(--font-display); color: var(--text); letter-spacing: 0.03em; }
.btn:hover { background: #46406a; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--line-hi), 0 1px 0 var(--ink); }
.btn img { width: 16px; height: 16px; }
.btn.gold { background: #8a5a10; box-shadow: inset 0 0 0 2px var(--gold), 0 3px 0 var(--ink); color: #fff6d0; }
.btn.gold:hover { background: #a86e14; }
.btn.red { background: #6a1f2a; box-shadow: inset 0 0 0 2px #ff6a6a, 0 3px 0 var(--ink); }
.btn.fight { pointer-events: auto; background: #7a2a14; box-shadow: inset 0 0 0 2px var(--fame), 0 3px 0 var(--ink); animation: pulse 0.9s ease-in-out infinite; padding: 6px 10px; }
.btn[disabled] { opacity: .45; cursor: default; transform: none; }
@keyframes pulse { 50% { filter: brightness(1.3); } }

/* Potion stat grid (RotMG-style character stats) */
.statGrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 0 0 6px; }
.stat { display: flex; align-items: center; gap: 4px; padding: 4px; background: var(--panel2); border: 2px solid var(--ink); font-variant-numeric: tabular-nums; }
.stat img { width: 20px; height: 20px; }
.stat b { font: 8px/1 var(--font-display); color: var(--dim); }
.stat span { font-size: 15px; margin-left: auto; }
.stat.full span { color: var(--gold); }

/* Constellation */
.starmap { position: relative; margin: 4px auto 8px; background: radial-gradient(ellipse at center, #1c1830 0%, #0b0a12 75%); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); overflow: hidden; }
.starmap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; transform: translate(-50%, -50%); width: 34px; height: 34px; padding: 0; cursor: pointer; display: grid; place-items: center;
  background: #15131e; border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); font: 8px/1 var(--font-display); color: var(--dim); }
.node::before { content: ''; width: 40%; height: 40%; background: currentColor; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
.node i { position: absolute; bottom: -6px; right: -8px; font-style: normal; font-size: 8px; line-height: 1; padding: 2px 2px 1px; background: var(--ink); color: var(--dim); white-space: nowrap; }
.node.avail { color: var(--c); box-shadow: inset 0 0 0 2px var(--c); animation: nodePulse 1.1s ease-in-out infinite; }
@keyframes nodePulse { 50% { box-shadow: inset 0 0 0 2px var(--c), 0 0 12px var(--c); } }
.node.owned { color: var(--c); background: #231f33; box-shadow: inset 0 0 0 2px var(--c), 0 0 10px var(--c); }
.node.maxed { background: var(--c); color: var(--ink); }
.node.maxed i { color: var(--c); }
.node.locked { opacity: .35; }
.node.sel { outline: 2px solid #fff; outline-offset: 2px; }
.detail { padding: 10px 12px; background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); display: grid; gap: 6px; }
.detail h3 { margin: 0; font-size: 20px; font-weight: 600; }
.detail p { margin: 0; color: var(--dim); font-size: 15px; }
.detail .act { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }

/* Collection slots */
.rarRow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; margin-bottom: 4px; }
.rarLabel { margin: 10px 4px 5px; font: 8px/1 var(--font-display); letter-spacing: .06em; display: flex; justify-content: space-between; }
.slot { position: relative; aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; cursor: pointer; padding: 0;
  background: var(--slot); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line), inset 0 -4px 0 rgba(0,0,0,.25); }
.slot img { width: 70%; height: 70%; }
.slot.none img { filter: brightness(0) opacity(.5); }
.slot .n { position: absolute; right: 3px; bottom: 2px; font: 8px/1 var(--font-display); text-shadow: 1px 1px 0 var(--ink); }
.slot .stars { position: absolute; left: 3px; top: 3px; display: flex; gap: 1px; }
.slot .stars i { width: 4px; height: 4px; background: var(--gold); box-shadow: 1px 1px 0 var(--ink); }
.slot.sel { box-shadow: inset 0 0 0 2px #fff; }
.slot.r6:not(.none) { animation: shimmer 2.5s linear infinite; }
@keyframes shimmer { 50% { box-shadow: inset 0 0 0 2px #fff, 0 0 10px #bfe8ff; } }
.bonusList { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; font-size: 15px; color: var(--dim); margin: 4px 4px 10px; }
.bonusList b { color: var(--good); font-weight: 600; }
.modList { display: grid; gap: 4px; }
.modItem { display: flex; gap: 8px; align-items: baseline; font-size: 15px; }
.modItem b { font-weight: 600; min-width: 9em; }
.modItem span { color: var(--dim); }
.modItem.off { opacity: .45; }
.tierCounts { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font: 8px/1.4 var(--font-display); text-align: center; }
.tierCounts div { padding: 6px 2px; background: var(--panel2); border: 2px solid var(--ink); }

/* Pets */
.hatch { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; background: linear-gradient(180deg, #2a2438, #1d1a28); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line-hi); }
.hatch .egg { width: 96px; height: 96px; animation: wobble 1.8s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes wobble { 0%,70%,100% { transform: rotate(0); } 78% { transform: rotate(-8deg); } 86% { transform: rotate(7deg); } 93% { transform: rotate(-3deg); } }
.hatch .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.hatch small { display: block; color: var(--dim); font-size: 15px; margin-top: 6px; }
.petGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pet { position: relative; display: grid; justify-items: center; gap: 2px; padding: 8px 4px 6px; cursor: pointer; text-align: center;
  background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
.pet img { width: 48px; height: 48px; }
.pet b { font-size: 15px; font-weight: 600; }
.pet small { font-size: 15px; color: var(--dim); line-height: 1.2; }
.pet .lv { font: 8px/1 var(--font-display); color: var(--dim); }
.pet.on { box-shadow: inset 0 0 0 2px var(--good); background: #22302a; }
.pet.none { opacity: .45; cursor: default; }
.pet.none img { filter: brightness(0) opacity(.6); }
.pet.gold { box-shadow: inset 0 0 0 2px var(--gold); }
.pet.on.gold { box-shadow: inset 0 0 0 2px var(--gold), 0 0 0 2px var(--good); }
.pet .tag { position: absolute; top: 4px; right: 4px; font: 8px/1 var(--font-display); padding: 3px; background: var(--good); color: var(--ink); }

/* Quests */
.quest { padding: 10px 12px; background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); display: grid; gap: 7px; }
.quest.done { box-shadow: inset 0 0 0 2px var(--gold); }
.quest .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.quest .top b { font-weight: 600; font-size: 15px; }
.reward { display: inline-flex; align-items: center; gap: 4px; font: 8px/1 var(--font-display); white-space: nowrap; }
.reward img { width: 16px; height: 16px; }
.pbar { position: relative; height: 14px; background: var(--ink); border: 2px solid var(--ink); }
.pbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--xp); }
.pbar span { position: absolute; inset: 0; display: grid; place-items: center; font: 8px/1 var(--font-display); text-shadow: 1px 1px 0 var(--ink); }
.quest.wait { opacity: .6; text-align: center; color: var(--dim); font-size: 15px; }
.dailyDays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dailyDays div { padding: 6px 2px; text-align: center; background: var(--slot); border: 2px solid var(--ink); font: 8px/1.4 var(--font-display); color: var(--dim); }
.dailyDays div.past { color: var(--good); }
.dailyDays div.now { box-shadow: inset 0 0 0 2px var(--gold); color: var(--gold); }
.dailyDays img { width: 20px; height: 20px; display: block; margin: 2px auto; }

/* Achievements */
.achGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.ach { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px 8px; background: var(--panel2); border: 2px solid var(--ink); }
.ach img { width: 28px; height: 28px; }
.ach b { display: block; font-size: 15px; font-weight: 600; line-height: 1.15; }
.ach small { color: var(--dim); font-size: 15px; line-height: 1.2; display: block; }
.ach.no { opacity: .45; }
.ach.no img { filter: grayscale(1) brightness(.6); }
.skinRow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.skin { display: grid; justify-items: center; gap: 4px; padding: 8px 4px; cursor: pointer; background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); font-size: 15px; }
.skin canvas, .skin img { width: 58px; height: auto; }
.skin.on { box-shadow: inset 0 0 0 2px var(--gold); }
.skin.no { opacity: .4; cursor: default; }
.statList { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 15px; margin: 0 4px; }
.statList span { color: var(--dim); }
.statList b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

/* Ascension */
.ascBox { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 14px; background: linear-gradient(180deg, #2a2238, #16131f); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line-hi); }
.ascBox img { width: 80px; height: 72px; }
.ascBox .big { font: 16px/1.2 var(--font-display); color: var(--fame); text-shadow: 3px 3px 0 var(--ink); }
.ascBox p { margin: 0; color: var(--dim); font-size: 15px; max-width: 46ch; }

/* Settings */
.setList { display: grid; gap: 8px; }
.setRow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; background: var(--panel2); border: 2px solid var(--ink); font-size: 15px; }
.toggle { width: 48px; height: 26px; position: relative; cursor: pointer; background: var(--ink); border: 2px solid var(--line); padding: 0; flex: none; }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: var(--faint); transition: left .12s; }
.toggle.on { border-color: var(--good); }
.toggle.on::after { left: 24px; background: var(--good); }
input[type=range] { accent-color: var(--gold); width: 140px; }

/* phones: the level-up cards come up as a sheet from the bottom, over the panel, so the Button stays clear */
@media (max-width: 860px) {
  #perks { position: fixed; left: 0; right: 0; bottom: 0; top: auto; transform: none; width: auto; z-index: 15; padding: 10px 8px 14px; background: rgba(12,11,18,.95); border-top: 3px solid var(--ink); box-shadow: inset 0 2px 0 var(--line); }
  #perks .cards { max-width: 520px; }
}
/* phones on their side: stage and panel side by side, not stacked */
@media (max-width: 960px) and (orientation: landscape) and (max-height: 520px) {
  #app { grid-template-columns: minmax(0, 1fr) minmax(280px, 44%); grid-template-rows: 100%; }
  #panel { border-top: 0; border-left: 3px solid var(--ink); box-shadow: inset 2px 0 0 var(--line); }
  #perks { left: 0; right: auto; width: 56%; }
  .introInner .art { min-height: 0; }
  .introInner .art img { max-height: 90px; }
  .introTitle { font-size: 22px; }
}
/* inputs at 16px so iPhones don't zoom in on focus */
@media (pointer: coarse) { .charInfo input, #saveBox, input, textarea { font-size: 16px !important; } }
/* bigger tap targets on touch screens */
@media (pointer: coarse) {
  .btn.fight { min-width: 44px; min-height: 40px; }
  .seg button { min-height: 34px; padding-left: 10px; padding-right: 10px; }
  .iconBtn { width: 36px; height: 36px; }
}
/* during a boss fight the boss bar owns the top of the stage */
.fighting #realmSub, .fighting #omenLine, .fighting #rivalLine, .fighting .goalBox { display: none !important; }
/* the land strip stays readable on bright ground */
.realm { background: rgba(12,11,18,.5); padding: 2px 8px 4px 6px; margin: -2px 0 0 -6px; box-shadow: 0 0 0 2px rgba(12,11,18,.25); }
@media (max-width: 600px) { #realmSub, #omenLine { display: none !important; } .zoneRow { font-size: 14px; } }
#bossWrap > span { z-index: 2; }
/* toasts step down out of the boss bar's way */
.fighting #toasts { top: 124px; }
@media (max-width: 860px) { .fighting #toasts { top: 104px; } }
.bragBox { width: 100%; font: 15px/1.3 var(--font-body); background: var(--ink); color: var(--text); border: 2px solid var(--line); padding: 8px; resize: none; user-select: text; -webkit-user-select: text; }
.lrow.stale { opacity: .55; }
.invite { padding: 6px 8px; margin: 4px 0; background: #1e2a22; border: 2px solid var(--ink); box-shadow: inset 0 0 0 1px #3fd65b66; }
.invite b { font: 8px/1.6 var(--font-display); color: #8ae07a; font-weight: normal; }
.invite p { margin: 2px 0 0; }
/* short landscape screens: only the land strip and the goal */
@media (max-height: 520px) and (orientation: landscape) { #realmSub, #omenLine, #rivalLine { display: none !important; } }
/* a boss the Warden can't take yet: the button stops begging */
.btn.fight.long { animation: none; opacity: .75; }
@media (pointer: coarse) { .btn.fight { font-size: 20px; } .node { min-width: 28px; min-height: 28px; } }
@media (max-width: 960px) and (orientation: landscape) and (max-height: 520px) {
  .classGrid { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
  .clsCard img { width: 48px; } .clsCard small { display: none; }
}

/* ======================= 2.0: a compact panel, the party ======================= */
#app { grid-template-columns: minmax(0, 1fr) clamp(300px, 26vw, 372px); }
.res { padding: 8px 10px 7px; gap: 5px; }
.goldLine { gap: 8px; }
.goldLine img { width: 24px; height: 24px; }
.goldNum { font-size: 18px; min-width: 0; }
.rates { gap: 10px; font-size: 14px; }
.chip { font-size: 14px; padding: 2px 6px 2px 3px; }
.chip img { width: 16px; height: 16px; }
.tabs { padding: 6px 8px; gap: 2px; }
.tab { height: 32px; max-width: 38px; }
.tab img { width: 20px; height: 20px; }
.tabTitle { padding: 8px 10px 0; }
.tabBody { padding: 6px 8px 14px; }
.note { font-size: 14px; margin: 3px 3px 8px; }
.sect { margin: 10px 3px 6px; }
.list { gap: 4px; }
.row { grid-template-columns: 36px minmax(0, 1fr) auto; gap: 8px; padding: 5px 7px; }
.row .ico { width: 36px; height: 36px; }
.row .ico img { width: 30px; height: 30px; }
.row .name, .row .desc { font-size: 14px; }
.statList { font-size: 14px; gap: 2px 10px; }
.charCard { grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 7px; }
.portrait { width: 64px; height: 60px; }
.portrait img { width: 76px; }
.power b { font-size: 13px; }
.doll { grid-template-columns: repeat(4, minmax(0, 58px)); justify-content: center; gap: 8px; margin: 6px 0; }
.dslot { padding: 3px 2px; }
.bag { grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 4px; }
.gear small, .gear u { font-size: 9px; }
.clsCard { padding: 7px 5px; }
.clsCard img { width: 44px; height: 44px; }
.clsCard small { font-size: 13px; line-height: 1.15; }
.foldBtn { display: none; }

/* roles */
.r_tank { --role: #5a9cff; } .r_heal { --role: #6ee07a; } .r_dps { --role: #ff8a5a; }
em.role { font: 8px/1.4 var(--font-display); font-style: normal; color: var(--role); }
.clsCard.need { box-shadow: inset 0 0 0 2px var(--role, var(--gold)); }
.clsCard.need em.role { color: #fff; }

/* the party strip in the Party tab */
.partyStrip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 0 0 6px; }
.pmem { position: relative; display: grid; justify-items: center; gap: 1px; padding: 4px 2px 5px; cursor: pointer; background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); color: var(--text); }
.pmem img { width: 40px; height: 38px; image-rendering: pixelated; }
.pmem small { font: 7px/1.3 var(--font-display); color: var(--role, var(--dim)); white-space: nowrap; }
.pmem i { display: block; width: 86%; height: 3px; background: var(--ink); }
.pmem i u { display: block; height: 100%; background: var(--good); }
.pmem.on { background: var(--slot-hi); box-shadow: inset 0 0 0 2px var(--gold); }
.pmem.down img { filter: grayscale(1) brightness(.6); transform: rotate(-80deg) translate(-4px, 0); }
.pmem.add { place-content: center; font: 16px/1 var(--font-display); color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); animation: pulse 1.4s ease-in-out infinite; }
.pmem.add small { color: var(--gold); margin-top: 6px; }
.pmem.lock { place-content: center; cursor: default; opacity: .55; background: var(--slot); }
.pmem.lock small { color: var(--dim); white-space: normal; text-align: center; }

/* the party on the field: a chip per unit */
.partyHud { display: flex; gap: 4px; pointer-events: auto; align-self: flex-start; }
.pchip { position: relative; width: 38px; padding: 1px 1px 3px; display: grid; justify-items: center; gap: 1px; cursor: pointer; background: rgba(12,11,18,.78); border: 2px solid var(--ink); box-shadow: inset 0 0 0 1px var(--role, var(--line)); }
.pchip img { width: 30px; height: 28px; image-rendering: pixelated; }
.pchip i { display: block; width: 100%; height: 4px; background: #2a0f16; }
.pchip i u { display: block; height: 100%; background: var(--good); transition: width .15s linear; }
.pchip.low i u { background: var(--hp); }
.pchip b { position: absolute; left: 0; right: 0; top: 8px; font: 8px/1 var(--font-display); color: #fff; text-align: center; text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink); font-weight: normal; }
.pchip.down { box-shadow: inset 0 0 0 2px #e84a4a; animation: downBlink 1s steps(2) infinite; }
.pchip.down img { filter: grayscale(1) brightness(.45); }
@keyframes downBlink { 50% { box-shadow: inset 0 0 0 2px #ffd84a; } }
.pchip:active { transform: translateY(1px); }

/* phones: a bigger field, and a panel that folds away */
@media (max-width: 860px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(250px, 58%) minmax(0, 1fr); }
  #app.fold { grid-template-rows: minmax(0, 1fr) auto; }
  #app.fold .tabTitle, #app.fold .tabBody, #app.fold .subRes { display: none; }
  .res { grid-template-columns: auto 1fr auto; }
  .foldBtn { display: grid; grid-column: 3; grid-row: 1; width: 30px; height: 26px; font: 12px/1 var(--font-body); color: var(--gold); }
  .res { padding: 5px 10px; gap: 3px; }
  .goldNum { font-size: 15px; flex: none; }
  .rates { font-size: 13px; gap: 8px; }
  .tabs { padding: 4px 4px; }
  .tab { height: 30px; }
  .tab img { width: 18px; height: 18px; }
  .meter { height: 12px; }
  .meter > span { font-size: 7px; }
  .hud.bottom { gap: 4px; padding: 6px; }
  .pchip { width: 34px; }
  .pchip img { width: 26px; height: 24px; }
  .bag { grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); }
  .classGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
}
@media (max-width: 960px) and (orientation: landscape) and (max-height: 520px) {
  #app, #app.fold { grid-template-columns: minmax(0, 1fr) minmax(260px, 40%); grid-template-rows: 100%; }
  #app.fold .tabTitle, #app.fold .tabBody, #app.fold .subRes { display: revert; }
  .foldBtn { display: none; }
}

/* ======================= 2.1: sudden events ======================= */
.evRow { display: flex; gap: 6px; align-items: center; pointer-events: none; }
.evRow img { width: 22px; height: 22px; image-rendering: pixelated; filter: drop-shadow(1px 1px 0 var(--ink)); animation: evPulse .6s ease-in-out infinite; }
.evRow .meter { flex: 1; box-shadow: inset 0 0 0 1px var(--ev, #ffd84a), 0 0 8px var(--ev, #ffd84a); }
.meter.ev > i { background: var(--ev, #ffd84a); }
@keyframes evPulse { 50% { transform: scale(1.18); } }

/* 2.1: damage you can feel */
.meter > i.trail { background: #fff3a0; opacity: .8; transition: width .5s ease-in .35s; box-shadow: none; }
.meter.hpm.low { animation: lowHp .8s ease-in-out infinite; }
@keyframes lowHp { 50% { box-shadow: inset 0 0 0 1px var(--line), 0 0 10px #ff3b3b; } }
.pchip.hit:not(.down) { animation: chipHit .3s ease-out; }
@keyframes chipHit { 0% { background: #ff3b3b; transform: translateY(-2px); } }

/* 2.2: the Hand's powers */
.powers { display: flex; gap: 4px; pointer-events: auto; }
.pw { position: relative; width: 38px; height: 38px; padding: 0; display: grid; place-items: center; cursor: pointer; overflow: hidden;
  background: var(--panel2); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 var(--ink); }
.pw img { width: 30px; height: 30px; position: relative; z-index: 1; }
.pw i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(10,9,16,.72); z-index: 2; }
.pw kbd { position: absolute; right: 1px; bottom: 0; z-index: 3; font: 7px/1 var(--font-display); color: #fff; text-shadow: 1px 1px 0 var(--ink); }
.pw.ready { box-shadow: inset 0 0 0 2px var(--gold), 0 3px 0 var(--ink); }
.pw:active { transform: translateY(1px); }
@media (max-width: 860px) { .pw { width: 34px; height: 34px; } .pw img { width: 26px; height: 26px; } }

/* 2.2: a quieter field */
#omenLine { display: none !important; }
.realm small#realmSub { font-size: 13px; }
.goalBox { max-width: 240px; font-size: 13px; padding: 3px 7px 4px; }

/* 2.3: the Torment dial under the land name */
.torment { pointer-events: auto; display: inline-flex; align-items: center; gap: 4px; margin: 2px 0 0; padding: 2px 3px; background: rgba(12,11,18,.72); border: 2px solid var(--ink); font: 8px/1 var(--font-display); color: #ff8a8a; }
.torment button { width: 18px; height: 18px; padding: 0; border: 2px solid var(--ink); background: #3a1a22; color: #fff; font: 10px/1 var(--font-display); cursor: pointer; }
.torment button:disabled { opacity: .35; cursor: default; }
.torment span { min-width: 92px; text-align: center; }
.torment.on { box-shadow: inset 0 0 0 1px #ff3b5c88; color: #ff5a6a; }
.torment.on span { text-shadow: 0 0 4px #ff2a4a; }
#bossWrap.enr { box-shadow: 0 0 0 2px #ff2a2a, 0 0 12px #ff2a2a; animation: enrPulse .5s steps(2) infinite; }
@keyframes enrPulse { 50% { box-shadow: 0 0 0 2px #ffd84a, 0 0 16px #ff2a2a; } }

/* ---------- 2.4: the Town ---------- */
.townBtn { width: auto !important; padding: 0 8px 0 4px !important; display: inline-flex !important; align-items: center; gap: 4px; background: #3a2a14 !important; box-shadow: inset 0 0 0 2px #ffd84a66; }
.townBtn b { font: 8px/1 var(--font-display); color: #ffe27a; letter-spacing: .04em; }
.townBtn.on { background: #1c3a2a !important; box-shadow: inset 0 0 0 2px #7fe9ff88; }
.townBtn.on b { color: #b8f4ff; }
.townBtn.dim { opacity: .5; }
.townBtn.glow { animation: townGlow 1.6s ease-in-out infinite; }
@keyframes townGlow { 50% { box-shadow: inset 0 0 0 2px #ffd84a, 0 0 10px #ffd84a66; } }
#app.inTown .hud.bottom, #app.inTown #xpBar, #app.inTown #perks { visibility: hidden; }
#townWin { position: absolute; inset: 56px 14px 14px; z-index: 30; display: flex; align-items: flex-start; justify-content: center; pointer-events: auto; }
#townWin[hidden] { display: none; }
.tw { width: min(1040px, 100%); max-height: 100%; display: flex; flex-direction: column; background: rgba(20,18,30,.97); border: 3px solid var(--ink); box-shadow: 0 0 0 2px #ffd84a55, 0 10px 40px #000a; color: var(--text); font: 15px/1.25 var(--font-body); }
.twHead { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #2a2214; border-bottom: 2px solid var(--ink); }
.twHead > img { width: 44px; height: auto; image-rendering: pixelated; }
.twHead b { display: block; font: 12px/1.2 var(--font-display); color: #ffe27a; }
.twHead small { display: block; color: var(--dim); font-size: 14px; }
.twHead > div { flex: 1; }
.twX { width: 32px; height: 32px; border: 2px solid var(--ink); background: #3a1a22; color: #fff; font: 14px/1 var(--font-display); cursor: pointer; }
.twWho { display: flex; gap: 6px; padding: 6px 10px; border-bottom: 2px solid var(--ink); background: #1a1826; }
.twWho button { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 3px; border: 2px solid var(--ink); background: var(--panel2); color: var(--text); cursor: pointer; font: 13px/1 var(--font-body); }
.twWho button.on { box-shadow: inset 0 0 0 2px #ffd84a; background: #3a3014; }
.twWho img { width: 32px; height: 32px; image-rendering: pixelated; }
.twBody { display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; gap: 10px; padding: 10px; overflow: auto; min-height: 0; }
.twDoll { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.twPortrait { display: grid; place-items: center; background: radial-gradient(#3a3550, #1a1826); border: 2px solid var(--ink); padding: 6px; }
.twPortrait img { width: 120px; height: auto; image-rendering: pixelated; }
.twSlots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.twSlot { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 4px; background: var(--panel2); border: 2px solid var(--ink); cursor: pointer; color: var(--text); min-width: 0; }
.twSlot.sel { box-shadow: inset 0 0 0 2px #fff; }
.twSlot .lbl { font: 8px/1 var(--font-display); color: var(--dim); }
.twSlot .row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.twSlot .gear, .twSlot .empty { width: 44px !important; height: 44px; flex: none; aspect-ratio: auto; }
.twSlot .empty { display: grid; place-items: center; background: var(--slot); border: 2px solid var(--ink); }
.twSlot .empty img { width: 50%; opacity: .5; }
.twSlot .nm { font-size: 13px; line-height: 1.1; overflow: hidden; }
.twStat { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 8px; background: #1a1826; border: 2px solid var(--ink); font-size: 14px; }
.twStat b { color: #ffe27a; }
.btn.big { padding: 10px; font-size: 10px; }
.btn.pulse { animation: townGlow 1.2s ease-in-out infinite; }
.twAuto { font-size: 13px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
.twBag { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.twBagHead { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.twBagHead b { font: 9px/1 var(--font-display); color: #ffe27a; }
.flt { display: flex; gap: 3px; flex-wrap: wrap; }
.flt button { padding: 3px 6px; border: 2px solid var(--ink); background: var(--panel2); color: var(--dim); font: 8px/1 var(--font-display); cursor: pointer; }
.flt button.on { color: #fff; box-shadow: inset 0 0 0 1px #ffd84a; }
.twGrid { flex: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 5px; align-content: start; max-height: 52vh; overflow: auto; padding: 2px; }
.twTile { position: relative; display: block; cursor: pointer; }
.twTile .gear { width: 100%; aspect-ratio: 1; }
.twTile.sel .gear { box-shadow: inset 0 0 0 2px #fff; }
.twTile.no { opacity: .45; }
.twTile.better .gear { box-shadow: 0 0 0 2px var(--good); }
.twTile i.up { position: absolute; right: 1px; top: 0; color: var(--good); font: 10px/1 var(--font-display); font-style: normal; text-shadow: 1px 1px 0 var(--ink); pointer-events: none; }
.twSalv { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; padding-top: 6px; border-top: 2px solid var(--ink); font-size: 14px; }
.twSalv select { background: var(--panel2); color: var(--text); border: 2px solid var(--ink); font: 13px var(--font-body); padding: 2px; }
.twCard { background: #1a1826; border: 2px solid var(--ink); padding: 8px 10px; align-self: start; }
.twCard.empty { color: var(--dim); }
.twCard h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font: 11px/1.2 var(--font-display); }
.twCard h3 .gear { width: 40px; height: 40px; flex: none; }
.twCard .sub { margin: 0 0 4px; color: var(--dim); font-size: 13px; }
.twCard .worn { color: #8ae07a; font-weight: normal; }
.twCard .main { margin: 4px 0; }
.twCard .hint { color: var(--dim); font-size: 13px; margin: 6px 0; }
.twCard .warn { color: var(--bad); }
.twCmp { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin: 8px 0; padding: 6px 8px; background: #12101c; border: 2px solid var(--ink); }
.twCmp small { grid-column: 1 / 3; color: var(--dim); font-size: 13px; }
.twCmp b { color: var(--text); }
.twCmp em { font-style: normal; font-size: 13px; margin-left: 4px; }
.twCmp em.up { color: var(--good); }
.twCmp em.dn { color: var(--bad); }
.twActs { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.twActs .btn { text-align: left; }
.twOrbs small { display: block; color: var(--dim); font-size: 13px; margin: 6px 0 4px; }
.tw.ench .twOrbs { order: -1; }
.tw.ench .twOrbs .orbBar { box-shadow: 0 0 0 2px #c88aff88; }
.twPots { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; padding: 10px; overflow: auto; }
.twPot { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; background: var(--panel2); border: 2px solid var(--ink); }
.twPot > img { width: 40px; image-rendering: pixelated; }
.twPot b { display: block; font: 9px/1.2 var(--font-display); }
.twPot small { display: block; color: var(--dim); font-size: 13px; }
.twPot .bar { display: block; height: 4px; background: #2a2838; margin: 4px 0 2px; }
.twPot .bar u { display: block; height: 100%; }
.twParty { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; }
.twMem { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px; min-width: 120px; background: var(--panel2); border: 2px solid var(--ink); }
.twMem.lead { box-shadow: inset 0 0 0 2px #ffd84a55; }
.twMem img { width: 64px; image-rendering: pixelated; }
.twMem b { font: 9px/1.2 var(--font-display); }
.twMem small { color: var(--dim); font-size: 13px; }
.tw.tavern > p { padding: 0 10px; }
.twRecruit { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; padding: 0 10px 10px; }
.bestRow { display: flex; justify-content: center; margin: 2px 0 6px; }
@media (max-width: 860px) {
  #townWin { inset: 44px 4px 4px; }
  .twBody { grid-template-columns: 1fr; }
  .twPortrait img { width: 84px; }
  .twGrid { max-height: none; }
  .twBag { min-height: auto; }
  .twBody { display: flex; flex-direction: column; }
  .twBody > * { flex: none; }
  .twHead > img { width: 32px; }
}
.meter .mIco { position: absolute; left: 3px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; z-index: 3; image-rendering: pixelated; pointer-events: none; filter: drop-shadow(1px 1px 0 #0c0b12); }
.meter { cursor: help; }
#btnFight, #btnRift, #btnRetreat { cursor: pointer; }

</style>

<body>
<div id="app">
  <section id="stageWrap">
    <canvas id="stage" aria-label="BTTN"></canvas>
    <div id="xpBar" hidden><i id="xpFill"></i><span id="xpText"></span></div>

/* js/util.js */
// BTTN — shared helpers. Every file attaches to the global G namespace so the
// game runs from file://, as a single inlined page, and inside a Node sim.
(function (G) {
  'use strict';

  const SUFFIXES = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc',
    'UDc', 'DDc', 'TDc', 'QaDc', 'QiDc', 'SxDc', 'SpDc', 'OcDc', 'NoDc', 'Vg'];

  // Compact number: 999, 1.23K, 45.6M, 7.89e75
  function fmt(n, small) {
    if (n === undefined || n === null || Number.isNaN(n)) return '0';
    if (!Number.isFinite(n)) return '∞';
    const neg = n < 0; if (neg) n = -n;
    let s;
    if (n < 1000) {
      if (small && n < 10 && n % 1 !== 0) s = (Math.floor(n * 10) / 10).toString();
      else if (small && n < 100 && n % 1 !== 0) s = (Math.floor(n * 10) / 10).toFixed(1);
      else s = Math.floor(n).toString();
    } else {
      const e = Math.floor(Math.log10(n) / 3);
      if (e < SUFFIXES.length) {
        const v = n / Math.pow(1000, e);
        const d = v < 10 ? 2 : v < 100 ? 1 : 0;
        s = (Math.floor(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d) + SUFFIXES[e];
      } else {
        const ex = Math.floor(Math.log10(n));
        s = (n / Math.pow(10, ex)).toFixed(2) + 'e' + ex;
      }
    }
    return (neg ? '-' : '') + s;
  }

  function fmtPct(x) { // 0.25 -> +25%
    const v = x * 100;
    return (v >= 0 ? '+' : '') + (Math.abs(v) < 10 && v % 1 ? v.toFixed(1) : Math.round(v)) + '%';
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600),
      m = Math.floor(sec % 3600 / 60), s = sec % 60;
    if (d) return d + 'd ' + h + 'h';
    if (h) return h + 'h ' + m + 'm';
    if (m) return m + 'm ' + s + 's';
    return s + 's';
  }

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  // All game randomness goes through G.rng so a run can be replayed from a seed
  // (G.useSeed) — the base for a cheat-resistant ladder. Visual effects may
  // keep using Math.random.
  G.rng = Math.random;
  const rnd = () => G.rng();
  const rand = (a = 0, b = 1) => a + rnd() * (b - a);
  const randInt = (a, b) => Math.floor(a + rnd() * (b - a + 1));
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const chance = p => rnd() < p;

  function weighted(weights) { // returns index
    let total = 0;
    for (let i = 0; i < weights.length; i++) total += weights[i];
    let r = rnd() * total;
    for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r < 0) return i; }
    return weights.length - 1;
  }

  // Deterministic RNG for level decoration so a biome always looks the same.
  function seeded(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  G.useSeed = seed => { G.rng = seed == null ? Math.random : seeded(seed); };

  function todayKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  // The shared day, the same for friends in every time zone (omens, today's Rift board)
  G.utcDayKey = function () {
    const d = new Date();
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
  };

  // Sum of geometric series cost: buying `n` levels starting from level L.
  function geoCost(base, growth, L, n) {
    if (n <= 0) return 0;
    if (growth === 1) return base * n;
    return base * Math.pow(growth, L) * (Math.pow(growth, n) - 1) / (growth - 1);
  }
  // How many levels are affordable with `money`.
  function geoMax(base, growth, L, money) {
    const first = base * Math.pow(growth, L);
    if (money < first) return 0;
    return Math.floor(Math.log(money * (growth - 1) / first + 1) / Math.log(growth));
  }

  const hexToRgb = h => {
    h = h.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  };
  const rgbToHex = (r, g, b) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  function shade(hex, amt) { // amt -1..1
    const [r, g, b] = hexToRgb(hex);
    if (amt >= 0) return rgbToHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
    return rgbToHex(r * (1 + amt), g * (1 + amt), b * (1 + amt));
  }

  // Tiny event bus: logic emits, stage/ui/audio listen.
  const listeners = {};
  function on(ev, fn) { (listeners[ev] = listeners[ev] || []).push(fn); }
  function emit(ev, a, b, c, d, e) {
    const l = listeners[ev]; if (!l) return;
    for (let i = 0; i < l.length; i++) l[i](a, b, c, d, e);
  }

  Object.assign(G, {
    fmt, fmtPct, fmtTime, clamp, lerp, rand, randInt, pick, chance, weighted, seeded,
    todayKey, geoCost, geoMax, hexToRgb, rgbToHex, shade, on, emit,
  });
})(globalThis.G = globalThis.G || {});

  G.itemValue = itemValue;
  function chestValue(tier) { return D.incomeRef * G.RARITIES[tier].secs * D.itemMult; }

  function tryMerge() {
    const S = G.S;
    for (let t = 0; t < 6; t++) {
      // the Horde's little chests of coin don't fuse into real ones
      const same = S.chests.filter(c => c.tier === t && !c.mod && !c.small);
      if (same.length >= 3) {
        const parts = same.slice(0, 3);
        S.chests = S.chests.filter(c => !parts.includes(c));
        const nc = makeChest(t + 1, null);
        nc.merged = true;
        S.chests.push(nc);
        S.st.merges++;
        emit('merge', parts, nc);
        return true;
      }
    }
    return false;
  }

  function makeChest(tier, mod) {
    const S = G.S;
    const c = { id: ++S.uid, tier, mod: mod || null, age: 0 };
    if (mod === 'frozen') c.hp = 8;
    if (mod === 'blazing') c.life = TUNE.blazeLife;
    if (mod === 'mimic') { c.hp = TUNE.mimicClicks; c.awake = false; }
    return c;
  }

  function spawnChest(tier, mod, fromBoss, small) {
    const S = G.S;
    if (tier === undefined || tier === null) tier = rollTier();
    tier = Math.min(tier, rarityCap());
    if (mod === undefined) mod = rollMod();
    if (mod === 'chromatic') tier = Math.min(6, tier + 1);
    if (S.chests.length >= D.slots) {
      if (!(D.merge && tryMerge())) {
        // No room: the lowest plain chest on the field pops open to make space. A little chest only
        // pushes out another little one; a real chest pushes out the little ones first.
        const plain = S.chests.filter(c => (!c.mod || c.mod === 'golden' || c.mod === 'ghost' || c.mod === 'void' || c.mod === 'chromatic') && (!small || c.small));
        const worth = c => (c.small ? 0 : 10) + c.tier;
        const low = plain.reduce((a, b) => (!a || worth(b) < worth(a) ? b : a), null);
        if (low && (low.small && !small || low.tier <= tier)) openChest(low, 'overflow');
        else {
          const v = chestValue(tier) * 0.3 * (small ? TUNE.smallChestK : 1);
          addGold(v, 'spill');
          emit('spill', tier, v);
          return null;
        }
      }
    }
    const c = makeChest(tier, mod);
    if (small) c.small = 1;
    S.chests.push(c);
    if (mod) S.modsSeen[mod] = 1;
    emit('chestSpawn', c, fromBoss);
    return c;
  }
  G.spawnChest = spawnChest;

  function spawnFromMeter() {
    const S = G.S;
    let guard = 0;
    while (S.chestMeter >= D.chestNeed && guard++ < 40) {
      S.chestMeter -= D.chestNeed;
      spawnChest();
    }
    if (S.chestMeter > D.chestNeed * 40) S.chestMeter = 0;
  }

  // Opens a chest (on the field or virtual). Returns loot summary.
  function openChest(c, source, depthGuard) {
    const S = G.S;
    const idx = S.chests.indexOf(c);
    if (idx >= 0) S.chests.splice(idx, 1);
    let n = 1;
    if (c.mod === 'ghost') n = 2;
    if (c.mod === 'frozen') n = 3;
    if (c.mod === 'mimic') n = 5;
    if (D.double && chance(D.double)) n *= 2;
    const rolls = c.mod === 'chromatic' ? 3 : 1;
    const loot = { items: [], gold: 0, ess: 0, eggs: 0, pots: [], tier: c.tier, mod: c.mod, chest: c, source };
    // a chest that bursts for want of room spills half of it
    const valMult = (c.mod === 'blazing' ? 5 : 1) * (source === 'overflow' ? TUNE.overflowK : 1) * (c.small ? TUNE.smallChestK : 1);
    // a little chest from the Horde is mostly coin: an item only now and then
    if (c.small && !chance(TUNE.smallItem)) n = 0;
    for (let i = 0; i < n; i++) {
      // (a promised chest, from the Journey or the daily gift, holds what it promises whatever the depth)
      const li = lootItem(pickItem(rollRarity(c.tier, rolls), source === 'journey' || source === 'daily'), source);
      li.v *= valMult;
      loot.gold += li.v;
      loot.items.push(li);
    }
    if (c.small && !loot.items.length) loot.gold += chestValue(c.tier) * valMult;
    if (c.mod === 'golden') loot.gold += D.incomeRef * 8 * (c.tier + 1);
    addGold(loot.gold, 'chest');
    let e = c.small ? 0 : G.RARITIES[c.tier].ess * D.essMult * (c.mod === 'void' ? 10 : 1); // the little ones hold no essence
    if (c.mod === 'void') e = Math.max(e, 1 * D.essMult);
    loot.ess = e; addEssence(e, 'chest' + c.tier);
    if (!c.small && c.tier >= 4 && chance(0.02 * (c.tier - 3) * D.eggMult)) loot.eggs += addEggs(1);
    if (!c.small && c.tier >= 4 && chance(0.02 * (c.tier - 3))) { const p = givePotion(); if (p) loot.pots.push(p); }

    if (c.small) S.st.purses = (S.st.purses || 0) + 1;
    else { S.opened[c.tier]++; S.st.chests++; questProgress('chests', 1); }
    if (c.mod) { S.st.modded++; questProgress('mod', 1); }
    emit('chestOpen', loot);
    if (!c.small && source !== 'offline' && G.jackpotRoll) G.jackpotRoll(null, 'chest');
    if (c.mod === 'lightning' && !depthGuard) {
      const targets = S.chests.filter(o => o.mod !== 'mimic' && o.mod !== 'frozen').slice(0, 3);
      emit('lightning', c, targets);
      targets.forEach(t => openChest(t, 'chain', true));
    }
    return loot;
  }
  G.openChest = openChest;
  G.makeChest = makeChest;
  G.addEggs = n => addEggs(n);

  // Player tapped a chest on the field.
  function clickChest(c) {
    const S = G.S;
    if (!S.chests.includes(c)) return;
    if (c.mod === 'frozen') {
      c.hp -= critRoll() ? 3 : 1;
      emit('chestHit', c);
      if (c.hp <= 0) openChest(c, 'hand');
      return;
    }
    if (c.mod === 'mimic') {
      if (!c.awake) { c.awake = true; c.life = TUNE.mimicLife; emit('mimicWake', c); return; }
      c.hp -= critRoll() ? 3 : 1;
      emit('chestHit', c);
      if (c.hp <= 0) { S.st.mimics++; if (chance(0.5 * D.eggMult)) addEggs(1); openChest(c, 'hand'); }
      return;
    }
    openChest(c, 'hand');
  }
  G.clickChest = clickChest;

  // The golem does the chores: lowest chests first, and it leaves the good ones
  // (epic and better) for the Hand for 20 seconds so the player gets to open them
  function golemPick(skip) {
    const S = G.S;
    // a chest lies a moment before a Looter goes for it (and a good one waits 20 s for your own hand)
    const list = S.chests.filter(c => c.mod !== 'mimic' && (c.age || 0) > 2 && (c.tier < 3 || c.age > 20 || c.mod === 'blazing') && !(skip && skip.has(c.id)));
    if (!list.length) return null;
    return list.find(c => c.mod === 'blazing') || list.find(c => c.mod === 'frozen') ||
      list.reduce((a, b) => (b.tier < a.tier ? b : a), list[0]);
  }
  function golemAct(c, i) {
    c = c || golemPick();

    if (c.mod === 'frozen') { c.hp -= 2; emit('chestHit', c); if (c.hp <= 0) openChest(c, 'golem'); }
    else openChest(c, 'golem');
    return true;
  }
  // The Looters: each picks a chest, runs to it and opens it when its time is up
  function lootersTick(dt) {
    const S = G.S, n = D.autoOpen ? Math.max(1, D.looters | 0) : 0;
    R.looters = R.looters || [];
    R.looters.length = Math.min(R.looters.length, n);
    while (R.looters.length < n) R.looters.push({ acc: 0, tgt: null });
    const taken = new Set(R.looters.map(l => l.tgt).filter(x => x != null));
    R.looters.forEach((l, i) => {
      if (l.tgt != null && !S.chests.some(c => c.id === l.tgt)) { taken.delete(l.tgt); l.tgt = null; }
      if (l.tgt == null) { const c = golemPick(taken); if (c) { l.tgt = c.id; l.acc = 0; taken.add(c.id); emit('looterGo', i, c); } }
      if (l.tgt == null) return;
      l.acc += dt;
      if (l.acc >= D.autoOpen) {
        const c = S.chests.find(x => x.id === l.tgt);
        taken.delete(l.tgt); l.tgt = null; l.acc = 0;
        if (c) golemAct(c, i);
      }
    });
  }

  // ---------- Potions ----------
  // 2.4: the Town. Between fights the party can walk into town: the field holds still (the Garrison keeps
  // earning) while you gear up at the Forge, brew at the Alchemist, recruit at the Tavern.
  G.townOk = () => !!(G.S.hero && G.S.hero.cls) && !R.boss && !R.rift && !R.inv && !(R.btnDown > 0) && !(R.ev && R.ev.k !== 'jackpot') && !(R.stun > 0);
  G.enterTown = function () {
    if (R.town || !G.townOk()) return false;
    R.town = true; R.bossIn = null;
    G.S.st.townVisits = (G.S.st.townVisits || 0) + 1;
    emit('town', true);
    return true;
  };
  G.leaveTown = function () {
    if (!R.town) return false;
    R.town = false;
    emit('town', false);
    return true;
  };
  // the Alchemist brews the potion you ask for: dearer with every one you already drink
  G.brewCost = id => Math.round(Math.max(200, D.incomeRef * 90) * Math.pow(1.45, G.S.pots[id] || 0));
  G.brewPotion = function (id) {
    const S = G.S, c = G.brewCost(id);
    if (!(S.pots[id] < D.potCap) || S.gold < c) return null;
    S.gold -= c;
    return givePotion(id);
  };
  function givePotion(id) {
    const S = G.S;
    const avail = G.POTIONS.filter(p => S.pots[p.id] < D.potCap);
    if (!avail.length) { addEssence(10 * D.essMult, 'potion'); emit('potionFull'); return null; }
    const p = id ? G.POTIONS.find(x => x.id === id && S.pots[x.id] < D.potCap) || pick(avail) : pick(avail);
    S.pots[p.id]++;
    R.dirty = true;
    emit('potion', p);
    return p;
  }
  G.givePotion = givePotion;

  // ---------- Bosses ----------
  // Past the Mad Button the lands come round again, corrupted: cycle 1 at depth 40, 2 at 80…
  const SPAN = () => G.REALMS.length * G.REALM_SIZE;
  function realmIndex(d) { return Math.floor(Math.max(0, d) / G.REALM_SIZE) % G.REALMS.length; }
  G.realmIndex = realmIndex;
  G.cycle = d => Math.floor(Math.max(0, d) / SPAN());
  const ROMAN = ['', '', ' II', ' III', ' IV', ' V', ' VI', ' VII', ' VIII', ' IX', ' X'];
  G.corrupt = (name, d) => { const c = G.cycle(d); return c ? 'Corrupted ' + name.replace(/^The /, '') + (c in ROMAN ? ROMAN[c] : ' ' + c) : name; };
  G.realmName = d => G.corrupt(G.REALMS[realmIndex(d)].name, d);
  function isLord(d) { return d % G.REALM_SIZE === G.REALM_SIZE - 1; }
  G.isLord = isLord;
  function bossHp(d) {
    return TUNE.bossBase * Math.pow(TUNE.bossGrowth, d) * (isLord(d) ? TUNE.lordHp : 1);
  }
  G.bossHp = bossHp;
  function bossName(d) {
    const r = G.REALMS[realmIndex(d)];
    return G.corrupt(isLord(d) ? r.lordName : r.minionName, d);
  }
  G.bossName = bossName;

  // Boss moves: a telegraphed wind-up the Hand can break by tapping. Broken,
  // the boss staggers and takes more damage; left alone, the move lands.
  G.BOSS_MOVES = {
    // (2.3: broken only by tapping the weak point that opens beside the boss, or by Smite; clicking the Button doesn't)
    slam:   { col: '#ff3b3b', name: 'SLAM', wind: 2.2, need: 3 },
    summon: { col: '#b36bff', name: 'SUMMON', wind: 2.4, need: 3 },
    shield: { col: '#4fa8ff', name: 'SHIELD', wind: 3, need: 4 },
    barrage: { col: '#ffb347', name: 'BARRAGE', wind: 2, need: 3 },
    // DOOM: lands on everyone for most of their health. Ward it, break it, or Smite it
    doom:   { col: '#ff2ad4', name: 'DOOM', wind: 3.2, need: 6 },
  };
  // later phases bring the barrage, a volley at the heroes themselves
  const MOVE_ORDER = {
    lord: [['slam', 'summon', 'shield', 'doom'], ['slam', 'barrage', 'doom', 'summon', 'shield', 'barrage'], ['barrage', 'doom', 'slam', 'barrage', 'summon', 'doom']],
    boss: [['slam', 'slam', 'summon'], ['slam', 'barrage', 'doom', 'summon', 'barrage']],
  };
  // the first land's bosses never Doom; from the second land on every boss can
  const moveOk = (b, k) => k !== 'doom' || b.d >= TUNE.doomFrom;
  function bossMoves(b, dt) {
    if (b.stagger > 0) b.stagger -= dt;
    if (!b.move) {
      if ((b.moveT -= dt) > 0) return;
      const set = MOVE_ORDER[b.lord ? 'lord' : 'boss'], order = set[Math.min(set.length, b.phase || 1) - 1];
      let k = order[(b.moveN = (b.moveN || 0) + 1) % order.length];
      if (!moveOk(b, k)) k = 'slam';
      const M = G.BOSS_MOVES[k], need = M.need + (b.lord ? 1 : 0);
      // wp: where round the boss its weak point opens (0-1 of a turn, kept off the top)
      const wind = M.wind * (G.bossHas(b, 'hasted') ? 0.8 : 1);
      b.move = { k, t: wind, T: wind, n: 0, need, wp: 0.1 + G.rng() * 0.8 };
      emit('bossMove', b);
      return;
    }
    if ((b.move.t -= dt) > 0) return;
    // the move lands
    const k = b.move.k;
    b.move = null; b.moveT = (b.lord ? 5 : 7) / (1 + 0.3 * ((b.phase || 1) - 1)) * (b.enr > 0 ? 0.5 : 1);
    // 2.2: a boss's blows take a share of what they hit, so a fight is never safe; its depth's curve is the floor
    const rage = b.rage ? 1.5 : 1;
    if (k === 'barrage' && G.partyUnits) {
      const a = G.mobAtk(b.d) * rage;
      for (let i = 0; i < 3 && R.boss === b; i++) { const up = G.partyUnits().filter(u => !(u.down > 0)); const v = up.length && chance(0.75) ? up[Math.floor(G.rng() * up.length)].who : 'button'; G.blowParty(v, a * 2.2, 0.1 * rage, 'barrage'); emit('barrageHit', b, v, i); }
    }
    // a slam lands on everyone: the Button and each hero standing
    if (k === 'slam' && G.hurtButton) {
      const a = G.mobAtk(b.d) * rage;
      const up = G.partyUnits ? G.partyUnits().filter(u => !(u.down > 0)) : [];
      G.blowParty('button', a * (b.lord ? 5 : 3.5), (b.lord ? 0.2 : 0.15) * rage, 'slam');
      // (a wipe on the Button's hit ends the fight: the revived party isn't hit again)
      for (const u of up) if (R.boss === b) G.blowParty(u.who, a * (b.lord ? 3 : 2), (b.lord ? 0.18 : 0.13) * rage, 'slam');
    }
    if (k === 'summon' && G.spawnPack) { G.spawnPack(true); G.spawnPack(true); }
    // Doom: most of everyone's health at once. A Button that isn't full breaks, and the party goes down with it
    if (k === 'doom' && G.blowParty) {
      const up = G.partyUnits ? G.partyUnits().filter(u => !(u.down > 0)) : [];
      // (never the rage on top: a Button at full health always survives it)
      G.blowParty('button', 0, b.lord ? 0.95 : 0.85, 'doom');
      for (const u of up) if (R.boss === b) G.blowParty(u.who, 0, b.lord ? 0.9 : 0.8, 'doom');

    emit('bossMoveLand', b, k);
  }
  // ---------- The Hand's powers (2.2): three choices with cooldowns ----------
  // Smite hits the boss for five seconds of the party's damage and breaks its wind-up (or blasts the
  // crowd at the Button); Ward makes the Button and the party untouchable for a moment; Mend heals
  // everyone and lifts the fallen.
  G.POWERS = {
    smite: { cd: 18, icon: 'ic_bolt', key: 'Z' },
    ward: { cd: 26, dur: 3.5, icon: 'it_knight_shield', key: 'X' },
    mend: { cd: 40, icon: 'ic_heart', key: 'C' },
  };
  R.pw = { smite: 0, ward: 0, mend: 0 };
  // Smite needs something to hit: not a boss shrugging off a phase change, not an empty field
  const smiteTarget = () => R.boss ? !R.boss.dead && !(R.boss.inv > 0) : R.mobs.some(m => !m.dead && m.p > 0.45 && m.kind !== 'guardian');

  G.usePower = function (id) {
    const P = G.POWERS[id];

    R.pw[id] = P.cd;
    const S = G.S;
    if (id === 'smite') {
      const b = R.boss;
      if (b && !b.dead) {
        if (b.move) { const mk = b.move.k; b.move = null; b.moveT = b.lord ? 5 : 7; b.stagger = 3; emit('bossStagger', b, mk); }
        if (G.bossHas(b, 'shielded') && !(b.sh > 0)) { b.sh = TUNE.shieldDown; emit('shieldBreak', b); }
        hitBoss((D.heroDps || 1) * (D.bossMult || 1) * 5);
      } else if (G.dealHit) for (const m of R.mobs.slice()) if (!m.dead && m.p > 0.45 && m.kind !== 'guardian') G.dealHit(m, (D.heroHit || 1) * 8, 'smite', false);
    } else if (id === 'ward') {
      R.ward = P.dur;
    } else if (id === 'mend') {
      const h = S.hero;
      if (!(R.btnDown > 0)) h.hp = Math.min(D.heroHp, h.hp + D.heroHp * 0.35);
      if (G.mendParty) G.mendParty(0.4);
    }

    emit('power', id);
    return true;
  };
  function powersTick(dt) {
    for (const k in R.pw) if (R.pw[k] > 0) R.pw[k] = Math.max(0, R.pw[k] - dt);
    if (R.ward > 0) R.ward = Math.max(0, R.ward - dt);
  }
  function tapBoss() {
    const b = R.boss;
    if (!b || !b.move) return false;
    emit('bossTap', b);
    if (++b.move.n >= b.move.need) {
      const k = b.move.k;
      b.move = null; b.moveT = b.lord ? 5 : 7; b.stagger = 3;
      if (G.bossHas(b, 'shielded')) { b.sh = TUNE.shieldDown; emit('shieldBreak', b); }

  }
  G.tapBoss = tapBoss;
  function startBoss() {

    const d = S.depth;
    const lord = isLord(d);
    const max = bossMax(d);
    // a boss that got away comes back with the wounds it took
    const scar = S.scar && S.scar.d === d ? S.scar.k : 1;
    // every failed try rallies the Warden: +20% damage on a lord (+15% on a boss), up to five tries,
    // and after a long rest the first fight is fought rested (+40%)
    const rally = (S.scar && S.scar.d === d ? TUNE.rally * Math.min(TUNE.rallyMax, S.scar.n || 0) : 0) + (S.rested ? 0.4 : 0);
    const hp = max * scar;
    if (G.heroBossStart) G.heroBossStart();
    const time = (D.bossTime + (lord ? 15 : 0)) * torment().bossTime;
    R.boss = { d, lord, hp, max, scar, rally, phase: 1, inv: 0, t: time, T: time, moveT: lord ? 4 : 6, stagger: 0,
      realm: realmIndex(d), sprite: lord ? G.REALMS[realmIndex(d)].lord : G.REALMS[realmIndex(d)].minion };
    // 2.3: from the second land on, bosses carry affixes, the same ones at the same depth every try
    R.boss.affix = bossAffixes(d);

  }
  G.startBoss = startBoss;
  const AFFIXES = ['shielded', 'vampiric', 'hasted', 'regen', 'frenzied'];
  function bossAffixes(d) {
    const n = (d >= TUNE.affixFrom ? 1 : 0) + (d >= 30 ? 1 : 0) + (isLord(d) && d >= 14 ? 1 : 0) + (G.torment ? G.torment().affix : 0);
    const rnd = G.seeded(d * 7919 + 13), pool = AFFIXES.slice(), out = [];
    for (let i = 0; i < Math.min(n, pool.length); i++) out.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);

  G.bossHas = (b, a) => !!(b && b.affix && b.affix.includes(a));
  // How much of this depth's boss the Warden would take down in the time limit, without clicking (1 = all of it)

  function bossMax(d) {

    // (the party's damage and the Hand's own: clicks at the pace you've been clicking)
