<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTTN</title>
<meta name="description" content="Pixel-art incremental about a button that drops chests, heroes, bosses and pets.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--BODY-->
<div id="app">
  <section id="stageWrap">
    <canvas id="stage" aria-label="BTTN"></canvas>
    <div class="hud top">
      <div class="realm"><b id="realmName"></b> · <span data-depth-label>Гл.</span> <span id="depthNum">1</span><small id="realmSub"></small></div>
      <div class="hudBtns">
        <button class="iconBtn" id="btnSound" aria-label="Sound"><img alt=""></button>
        <button class="iconBtn" id="btnMusic" aria-label="Music"><img alt=""></button>
      </div>
    </div>
    <div class="hint" id="hint" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="banner" hidden></div>
    <div class="hud bottom">
      <div class="buffs" id="buffs"></div>
      <div class="bossRow" id="bossRow" hidden>
        <div class="meter boss" id="bossWrap"><i id="bossMeter"></i><span id="bossText"></span></div>
        <button class="btn fight" id="btnFight" hidden>⚔</button>
        <button class="btn fight" id="btnRetreat" hidden style="animation:none">✕</button>
      </div>
      <div class="hpRow" id="hpRow" hidden>
        <div class="meter hpm" id="hpWrap"><i id="hpMeter"></i><span id="hpText"></span></div>
        <button class="abil" id="btnAbil" hidden><img alt=""><i id="abilCd"></i></button>
      </div>
      <div class="meters">
        <div class="meter"><i id="chestMeter"></i><span id="chestText"></span></div>
        <div class="meter combo" id="comboWrap"><i id="comboMeter"></i><span id="comboText"></span></div>
      </div>
    </div>
  </section>
  <aside id="panel">
    <header class="res">
      <div class="goldLine"><img id="goldIco" alt=""><span class="goldNum" id="goldNum">0</span></div>
      <div class="rates"><span><b id="gpsNum">0</b> <span data-t="perSec"></span></span><span><b id="clickNum">1</b> <span data-t="perClick"></span></span></div>
      <div class="subRes">
        <span class="chip ess" id="essChip" hidden><img id="essIco" alt=""><b id="essNum">0</b></span>
        <span class="chip egg" id="eggChip" hidden><img id="eggIco" alt=""><b id="eggNum">0</b></span>
        <span class="chip fame" id="fameChip" hidden><img id="fameIco" alt=""><b id="fameNum">0</b></span>
      </div>
    </header>
    <nav class="tabs" id="tabs"></nav>
    <div class="tabTitle" id="tabTitle"></div>
    <div class="tabBody" id="tabBody"></div>
  </aside>
</div>
<div id="modal" hidden></div>
<!--/BODY-->
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/game.js"></script>
<script src="js/hero.js"></script>
<script src="js/ach.js"></script>
<script src="js/net.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/stage.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
